<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banc d'essai — le geste des lettres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:8px;background:#f4f9ff;font-family:system-ui,sans-serif;color:#01579b}
  h1{font-size:15px;margin:0 0 4px}
  #etat{font:600 11px/1.5 system-ui;color:#0277bd;background:#fff;border:1px solid #cde;
    border-radius:8px;padding:6px 8px;margin-bottom:8px;white-space:pre-wrap}
  #grille{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  @media(min-width:640px){#grille{grid-template-columns:repeat(4,1fr)}}
  .case{background:#fff;border:2px solid rgba(2,136,209,.3);border-radius:10px;padding:3px}
  .lbl{font:700 11px system-ui;color:#0277bd;text-align:center;padding:2px 0 3px}
  canvas{display:block;width:100%;height:auto}
</style>
</head><body>
<h1>Le geste des lettres — banc d'essai</h1>
<div id="etat">Chargement de l'application…</div>
<div id="grille"></div>
<script>
/* Ce banc ne contient AUCUNE copie du moteur : il charge l'application
   réellement servie par le site, en extrait ses scripts, et s'en sert. Ce
   qu'il montre est donc exactement ce que l'appareil exécute — c'est tout
   l'intérêt : si le geste est juste ici et faux dans le cours, le problème
   est ailleurs que dans la table des gestes. */
var etat=document.getElementById('etat');
function dit(s){etat.textContent=s;}

fetch('/app',{credentials:'same-origin',cache:'no-store'})
  .then(function(r){
    if(!r.ok)throw new Error('réponse '+r.status);
    return r.text();
  })
  .then(function(src){
    var v=/_VERSION_REPLI\s*=\s*'([^']+)'/.exec(src);
    var re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi,m,n=0;
    while((m=re.exec(src))){
      if(/\bsrc\s*=/i.test(m[1]))continue;
      if(/type\s*=\s*["'](?!text\/javascript)/i.test(m[1]))continue;
      n++;
      var s=document.createElement('script');s.textContent=m[2];
      try{document.head.appendChild(s);}catch(e){}
    }
    if(typeof _revelateur!=='function'||typeof _TRACE_MODELE!=='object'){
      dit('Le moteur n\'a pas pu être chargé depuis l\'application.');
      return;
    }
    var ay=_TRACE_MODELE['ع']&&_TRACE_MODELE['ع'].milieu;
    var aire=0;
    if(ay){var p=ay[0].slice(2,10);
      for(var i=0;i<p.length-1;i++)aire+=p[i][0]*p[i+1][1]-p[i+1][0]*p[i][1];}
    dit('app.html reçu : '+(v?v[1]:'version inconnue')
      +'\n'+n+' blocs de script chargés'
      +'\ntriangle du ʿayn milieu : aire '+aire.toFixed(4)
      +(aire>0?'  → sens des AIGUILLES D\'UNE MONTRE':'  → sens INVERSE'));
    dessine();
  })
  .catch(function(e){
    dit('Impossible de charger l\'application : '+e.message
      +'\nConnecte-toi d\'abord sur le site, puis reviens ici.');
  });

function dessine(){
  var PX=140,W=210,H=210,AX=105,AY=132,vues=[];
  var g=document.getElementById('grille');
  [['ʿayn',['عـ','ـعـ','ـع','ع']],
   ['fā',  ['فـ','ـفـ','ـف','ف']],
   ['qāf', ['قـ','ـقـ','ـق','ق']]].forEach(function(L){
    L[1].forEach(function(ch,k){
      var b=document.createElement('div');b.className='case';
      var lb=document.createElement('div');lb.className='lbl';
      lb.textContent=L[0]+' · '+['début','milieu','fin','isolée'][k];
      b.appendChild(lb);
      var cv=document.createElement('canvas');cv.width=W;cv.height=H;
      b.appendChild(cv);g.appendChild(b);
      vues.push({cx:cv.getContext('2d'),rev:_revelateur(ch,AX,AY,PX,0,0,W,H)});
    });
  });
  /* Une seule horloge pour les douze : 2 s de geste, puis une pause, et on
     recommence. Toutes partent ensemble, on peut donc les comparer. */
  var t0=Date.now();
  setInterval(function(){
    var p=((Date.now()-t0)%2600)/2000*3;if(p>3)p=3;
    vues.forEach(function(v){
      v.cx.clearRect(0,0,W,H);
      v.cx.save();
      v.cx.strokeStyle='rgba(2,136,209,.25)';v.cx.setLineDash([7,5]);v.cx.lineWidth=2;
      v.cx.beginPath();v.cx.moveTo(8,AY);v.cx.lineTo(W-8,AY);v.cx.stroke();
      v.cx.restore();
      if(v.rev)v.cx.drawImage(_reveleJusqua(v.rev,p),v.rev.x0,v.rev.y0);
    });
  },40);
}
</script>
</body></html>
