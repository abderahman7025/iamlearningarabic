*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --gold:#f5c842;--gold2:#fde68a;--gold-dim:rgba(245,200,66,.15);
  --glass:rgba(255,255,255,0.04);--glass2:rgba(255,255,255,0.08);
  --glass3:rgba(255,255,255,0.12);
  --border:rgba(255,255,255,0.08);--border2:rgba(245,200,66,0.35);
  --txt:#f0ece4;--txt2:rgba(240,236,228,0.5);--txt3:rgba(240,236,228,0.28);
  --green:#22d3a0;--red:#ff4d6d;--blue:#38bdf8;--orange:#fb923c;--vowel:#f97316;
  --r:20px;--r2:16px;
  --ff:'Outfit',sans-serif;--fa:'Scheherazade New',serif;
  --shadow-gold:0 0 40px rgba(245,200,66,.2);
  --shadow-card:0 8px 32px rgba(0,0,0,.4);
}

html,body{width:100%;height:100%;overflow:hidden;background:#04030a}

/* ── BACKGROUND ANIMÉ ── */
#root{
  position:fixed;inset:0;
  background:#04030a;
  font-family:var(--ff);color:var(--txt);
  display:flex;flex-direction:column;
  overflow:hidden;
}
#root::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 20%, rgba(120,40,200,.15) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 80%, rgba(20,80,160,.15) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(245,200,66,.03) 0%, transparent 70%);
  animation:bgPulse 8s ease-in-out infinite alternate;
}
#root::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.03) 1px, transparent 0);
  background-size:32px 32px;
}
@keyframes bgPulse{
  0%{opacity:1}
  50%{opacity:.7}
  100%{opacity:1}
}

/* ── ORBITING PARTICLES ── */
.particle{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  animation:floatParticle var(--dur,12s) ease-in-out infinite;
  opacity:var(--op,.15);
}
@keyframes floatParticle{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(var(--dx1,20px),var(--dy1,-30px)) scale(1.2)}
  66%{transform:translate(var(--dx2,-15px),var(--dy2,20px)) scale(0.8)}
}

/* ── SCREENS ── */
.scr{display:none;flex-direction:column;width:100%;height:100%;position:relative;z-index:1;overflow:hidden}
.scr.on{display:flex}

/* ── TRANSITIONS ── */
@keyframes zoomIn{0%{opacity:0;transform:scale(.88) translateY(16px);filter:blur(4px)}60%{opacity:1;transform:scale(1.02) translateY(-3px);filter:blur(0)}100%{opacity:1;transform:scale(1) translateY(0);}}
@keyframes zoomOut{0%{opacity:0;transform:scale(1.12) translateY(-16px);filter:blur(4px)}60%{opacity:1;transform:scale(.98) translateY(3px);filter:blur(0)}100%{opacity:1;transform:scale(1) translateY(0);}}
@keyframes slideR{0%{opacity:0;transform:translateX(80px) scale(.96);filter:blur(3px)}70%{opacity:1;transform:translateX(-6px) scale(1.01);filter:blur(0)}100%{opacity:1;transform:translateX(0) scale(1);}}
@keyframes slideL{0%{opacity:0;transform:translateX(-80px) scale(.96);filter:blur(3px)}70%{opacity:1;transform:translateX(6px) scale(1.01);filter:blur(0)}100%{opacity:1;transform:translateX(0) scale(1);}}
@keyframes slideUp{0%{opacity:0;transform:translateY(60px) scale(.96);filter:blur(3px)}65%{opacity:1;transform:translateY(-5px) scale(1.01);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes slideDown{0%{opacity:0;transform:translateY(-60px) scale(.96);filter:blur(3px)}65%{opacity:1;transform:translateY(5px) scale(1.01);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes flipIn{0%{opacity:0;transform:perspective(1000px) rotateY(-25deg) scale(.92);filter:blur(4px)}60%{opacity:1;transform:perspective(1000px) rotateY(4deg) scale(1.02);filter:blur(0)}100%{opacity:1;transform:perspective(1000px) rotateY(0) scale(1);}}
@keyframes fadeIn{0%{opacity:0;transform:scale(.98)}100%{opacity:1;transform:scale(1)}}
@keyframes morphIn{0%{opacity:0;transform:scale(.82) rotate(-1deg);filter:blur(10px)}60%{opacity:1;transform:scale(1.03) rotate(.3deg);filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0);}}

.tx-zoom-in{animation:zoomIn .5s cubic-bezier(.34,1.4,.64,1) both}
.tx-zoom-out{animation:zoomOut .45s cubic-bezier(.4,0,.2,1) both}
.tx-slide-r{animation:slideR .48s cubic-bezier(.34,1.3,.64,1) both}
.tx-slide-l{animation:slideL .48s cubic-bezier(.34,1.3,.64,1) both}
.tx-slide-up{animation:slideUp .45s cubic-bezier(.34,1.3,.64,1) both}
.tx-slide-down{animation:slideDown .42s cubic-bezier(.4,0,.2,1) both}
.tx-flip{animation:flipIn .52s cubic-bezier(.34,1.2,.64,1) both}
.tx-fade{animation:fadeIn .38s cubic-bezier(.4,0,.2,1) both}
.tx-morph{animation:morphIn .55s cubic-bezier(.34,1.2,.64,1) both}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes rp{0%{box-shadow:0 0 0 0 rgba(245,200,66,.7)}100%{box-shadow:0 0 0 30px rgba(245,200,66,0)}}
@keyframes cfetti{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pring{0%{box-shadow:0 0 0 0 rgba(34,211,160,.6)}70%{box-shadow:0 0 0 16px rgba(34,211,160,0)}100%{box-shadow:0 0 0 0 rgba(34,211,160,0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(245,200,66,.3)}50%{box-shadow:0 0 40px rgba(245,200,66,.6),0 0 80px rgba(245,200,66,.2)}}
@keyframes slideInStagger{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes navSlideIn{
  0%{opacity:0;transform:translateX(-110%)}
  100%{opacity:1;transform:translateX(0)}
}
@keyframes sessGrow{
  0%{opacity:0;transform:scale(.05);border-radius:50%}
  60%{opacity:1;transform:scale(1.06);border-radius:20px}
  80%{transform:scale(.97)}
  100%{opacity:1;transform:scale(1);border-radius:18px}
}
@keyframes floatCard{
  0%,100%{transform:scale(1.09);box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 0 1px rgba(245,200,66,.22)}
  50%{transform:scale(1.10) translateY(-4px);box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(245,200,66,.3)}
}
@keyframes cardPulse{
  from{transform:scale(1.05);}
  to{transform:scale(1.09);}
}
@keyframes borderRotate{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;flex-shrink:0;
  background:transparent;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:none;
  position:fixed;top:0;left:0;width:100%;z-index:100;overflow:hidden;max-height:200px;
  transition:transform .3s ease, opacity .3s ease;
}
.tb-title{
  font-size:.95rem;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.5px;
}
.tb-back{
  display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--txt2);
  cursor:pointer;padding:8px 14px;border-radius:50px;
  background:var(--glass2);border:1px solid var(--border);
  backdrop-filter:blur(16px);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.tb-back::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(245,200,66,.1),transparent);
  opacity:0;transition:opacity .25s;
}
.tb-back:active{transform:scale(.94);}
.tb-back:active::before{opacity:1;}

.sound-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--green);cursor:pointer;
  transition:all .3s;
  box-shadow:0 0 8px rgba(34,211,160,.6);
  animation:pulse 2s ease-in-out infinite;
}
.sound-dot.off{background:var(--txt3);box-shadow:none;animation:none;}

/* ── SCROLLABLE CONTENT ── */
.ca{
  flex:1;overflow-y:auto;padding:14px 18px 100px;
  scrollbar-width:thin;scrollbar-color:rgba(245,200,66,.3) transparent;
}
.ca::-webkit-scrollbar{width:3px}
.ca::-webkit-scrollbar-thumb{background:rgba(245,200,66,.3);border-radius:2px}

/* ── CARD BASE ── */
.card{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r);backdrop-filter:blur(20px);
  box-shadow:var(--shadow-card);
  transition:all .3s cubic-bezier(.34,1.2,.64,1);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 50%);
  pointer-events:none;
}

/* ── LOGIN / BUY ── */
#s-login{align-items:center;justify-content:center}
#s-buy{align-items:center;justify-content:center}
#s-register{align-items:center;justify-content:center}

.login-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.login-moon{
  position:absolute;top:5%;left:5%;
  animation:float 6s ease-in-out infinite;
  pointer-events:none;
}
.moon-3d{
  width:88px;height:88px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 32%, #fffbe8 0%, #f5e07a 18%, #d4a020 45%, #8a5e00 75%, #4a3000 100%);
  box-shadow:
    0 0 0 2px rgba(245,200,66,.15),
    0 0 24px rgba(245,200,66,.55),
    0 0 60px rgba(245,200,66,.28),
    0 0 110px rgba(245,200,66,.12),
    inset -14px -10px 28px rgba(0,0,0,.55),
    inset 4px 4px 12px rgba(255,255,220,.18);
}
.moon-3d::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 72% 68%, rgba(0,0,0,.22) 0%, transparent 40%),
    radial-gradient(circle at 28% 72%, rgba(0,0,0,.18) 0%, transparent 30%),
    radial-gradient(circle at 55% 40%, rgba(255,255,200,.08) 0%, transparent 35%);
}
.moon-3d::after{
  content:'';position:absolute;inset:-18px;border-radius:50%;
  background:radial-gradient(circle, rgba(245,200,66,.12) 40%, transparent 72%);
  animation:glow 4s ease-in-out infinite;
}
.moon-crater{position:absolute;border-radius:50%;background:rgba(0,0,0,.22);box-shadow:inset 1px 1px 3px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.1)}
.login-stars{
  position:absolute;top:4%;right:7%;
  display:flex;gap:10px;align-items:center;
  pointer-events:none;
}
.star-deco{
  border-radius:50%;background:#fff;
  box-shadow:0 0 6px rgba(255,255,255,.9),0 0 14px rgba(245,200,66,.5);
  animation:twinkle var(--td,2.5s) ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
@keyframes shootingStar{
  0%{transform:translateX(0) translateY(0) rotate(-30deg);opacity:1;width:0}
  5%{width:80px;opacity:1}
  80%{opacity:.4}
  100%{transform:translateX(280px) translateY(80px) rotate(-30deg);opacity:0;width:80px}
}
.mosque-svg{position:absolute;bottom:0;left:0;right:0;opacity:.9;overflow:visible}
@keyframes tipGlow{0%,100%{opacity:.5;r:3px}50%{opacity:1;r:5px;filter:drop-shadow(0 0 6px rgba(245,200,66,.9))}}
@keyframes domeBreath{0%,100%{opacity:.08}50%{opacity:.14}}
.mosque-tip{animation:tipGlow 2.5s ease-in-out infinite}
.mosque-dome-fill{animation:domeBreath 4s ease-in-out infinite}

.login-box{
  position:relative;z-index:2;width:min(360px,92vw);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;padding:36px 28px;
  backdrop-filter:blur(32px);
  box-shadow:0 32px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  animation:morphIn .5s cubic-bezier(.34,1.2,.64,1);
}
.login-ar{
  font-family:'Scheherazade New',serif;font-size:1.9rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;line-height:1.5;margin-bottom:24px;
  filter:drop-shadow(0 0 20px rgba(245,200,66,.3));
}

.linp{
  width:100%;padding:14px 18px;border-radius:14px;margin-bottom:12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  color:var(--txt);font-family:var(--ff);font-size:.9rem;outline:none;
  transition:all .25s;
  backdrop-filter:blur(8px);
}
.linp::placeholder{color:var(--txt3)}
.linp:focus{
  border-color:rgba(245,200,66,.5);
  background:rgba(255,255,255,.08);
  box-shadow:0 0 0 3px rgba(245,200,66,.1),0 4px 20px rgba(0,0,0,.3);
}

.lbtn{
  width:100%;padding:15px;border-radius:50px;border:none;margin-top:8px;
  background:linear-gradient(135deg,var(--gold) 0%,#e8a020 50%,var(--gold) 100%);
  background-size:200% auto;
  color:#0a0718;font-family:var(--ff);font-size:.95rem;font-weight:800;
  cursor:pointer;letter-spacing:.5px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 30px rgba(245,200,66,.35);
  animation:shimmer 3s linear infinite;
}
.lbtn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(245,200,66,.5);}
.lbtn:active{transform:scale(.96);}
.lbtn:disabled{opacity:.5;animation:none;}

.lerr{color:#ff6b6b;font-size:.74rem;text-align:center;margin-top:8px;min-height:18px}

/* ── GLOBE LANG ── */
.lang-globe-wrap{position:relative;display:inline-flex;justify-content:center;margin-top:16px}
.lang-globe-btn{
  display:flex;align-items:center;gap:8px;padding:9px 18px;
  border-radius:50px;border:1px solid var(--border2);
  background:var(--gold-dim);color:var(--gold);
  font-family:var(--ff);font-size:.83rem;font-weight:700;
  cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(12px);
  box-shadow:0 4px 16px rgba(245,200,66,.15);
}
.lang-globe-btn:active{transform:scale(.94)}
.lang-globe-btn .globe-icon{font-size:1.1rem}
.lang-dropdown{
  position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);
  background:rgba(8,6,20,.95);border:1px solid var(--border2);
  border-radius:20px;padding:12px;display:none;flex-wrap:wrap;
  gap:8px;justify-content:center;z-index:200;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  min-width:280px;max-width:340px;backdrop-filter:blur(24px);
}
.lang-dropdown.open{display:flex;animation:slideUp .25s cubic-bezier(.34,1.56,.64,1)}
.lang-chip{
  padding:7px 14px;border-radius:50px;font-size:.75rem;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,.18);color:var(--txt2);
  background:rgba(10,7,24,.75);transition:all .2s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;
}
.lang-chip:active{transform:scale(.94)}
.lang-chip.on{background:var(--gold-dim);color:var(--gold);border-color:var(--border2);box-shadow:0 0 12px rgba(245,200,66,.2);}

/* ── WELCOME ── */
#s-welcome{align-items:center;justify-content:center;gap:0;padding:30px 24px}
.w-ar{
  font-family:'Scheherazade New',serif;font-size:2.6rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2),#fff8dc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;line-height:1.4;margin-bottom:10px;
  filter:drop-shadow(0 0 30px rgba(245,200,66,.4));
  animation:float 5s ease-in-out infinite;
}
.w-sub{font-size:.9rem;color:var(--txt2);margin-bottom:32px;text-align:center}
.prof-cards{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px}

.prof-card{
  display:flex;align-items:center;gap:18px;padding:20px 22px;
  border-radius:22px;cursor:pointer;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(10,7,24,.75);
  backdrop-filter:blur(20px);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-card);
}
.prof-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
  opacity:0;transition:opacity .3s;
}
.prof-card:hover{transform:translateX(8px) scale(1.02);box-shadow:0 16px 48px rgba(0,0,0,.5);}
.prof-card:hover::after{opacity:1;}
.prof-card:active{transform:scale(.97);}
.prof-card.girl:hover{border-color:rgba(255,100,200,.4);box-shadow:0 16px 48px rgba(255,100,200,.2);}
.prof-card.boy:hover{border-color:rgba(56,189,248,.4);box-shadow:0 16px 48px rgba(56,189,248,.2);}
.prof-card.adult:hover{border-color:rgba(245,200,66,.4);box-shadow:var(--shadow-gold);}

.prof-card:nth-child(1){animation:slideInStagger .4s .1s both cubic-bezier(.34,1.56,.64,1)}
.prof-card:nth-child(2){animation:slideInStagger .4s .2s both cubic-bezier(.34,1.56,.64,1)}
.prof-card:nth-child(3){animation:slideInStagger .4s .3s both cubic-bezier(.34,1.56,.64,1)}

.prof-emoji{font-size:2.2rem;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
.prof-info{flex:1}
.prof-name{font-size:1.05rem;font-weight:700;margin-bottom:3px}
.prof-desc{font-size:.77rem;color:var(--txt2)}
.prof-arrow{
  color:var(--txt3);font-size:1.1rem;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .3s;
}
.prof-card:hover .prof-arrow{transform:translateX(6px);color:var(--gold);}

/* ── MENU ── */
#s-menu{padding:0;overflow-y:auto;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(245,200,66,.08) 0%,transparent 70%)}
.menu-header{
  padding:28px 22px 20px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
  transition:opacity .3s ease, top .3s ease;
}
.menu-logo-ar{
  font-family:'Scheherazade New',serif;font-size:2rem;letter-spacing:.02em;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 50%,var(--gold) 100%);
  background-size:200% auto;animation:shimmer 4s linear infinite;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(245,200,66,.35));
}
.menu-avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#b8860b);
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;font-weight:800;color:#0a0718;
  box-shadow:0 0 0 2px rgba(245,200,66,.2),0 8px 24px rgba(245,200,66,.3);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
}
.menu-avatar:active{transform:scale(.88);}
.menu-avatar:hover{box-shadow:0 0 0 3px rgba(245,200,66,.4),0 12px 32px rgba(245,200,66,.4);}

.menu-nav{display:flex;flex-direction:column;gap:10px;padding:0 16px 24px}

/* Cartes menu — style oblique glassmorphism avec glow latéral */
.nav-card{
  display:flex;align-items:center;gap:18px;padding:0;
  border-radius:20px;cursor:pointer;overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);
  backdrop-filter:blur(24px);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s;
  position:relative;
  box-shadow:0 2px 20px rgba(0,0,0,.3);
  height:80px;
}
/* Bande colorée gauche avec glow */
.nav-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--gold),var(--gold2));
  box-shadow:0 0 18px rgba(245,200,66,.6),0 0 40px rgba(245,200,66,.2);
  transition:width .3s,box-shadow .3s;
}
/* Overlay shimmer */
.nav-card-shimmer{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(245,200,66,.06) 50%,transparent 70%);
  background-size:300% auto;
  animation:shimmer 5s linear infinite;
  border-radius:20px;
}
.nav-card:hover{
  transform:translateX(6px) scale(1.01);
  border-color:rgba(245,200,66,.18);
  box-shadow:0 8px 40px rgba(0,0,0,.4),0 0 0 1px rgba(245,200,66,.08);
}
.nav-card:hover::before{width:6px;box-shadow:0 0 24px rgba(245,200,66,.8),0 0 60px rgba(245,200,66,.3);}
.nav-card:active{transform:scale(.97);}

.nav-card:nth-child(1){opacity:0;transform:translateX(-110%)}
.nav-card:nth-child(2){opacity:0;transform:translateX(-110%)}
.nav-card:nth-child(3){opacity:0;transform:translateX(-110%)}
.nav-card:nth-child(4){opacity:0;transform:translateX(-110%)}

/* Zone icône avec fond translucide */
.nav-icon{
  width:56px;height:80px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;
  background:rgba(255,255,255,.03);
  border-right:1px solid rgba(255,255,255,.05);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s;
  margin-left:4px;
}
.nav-card:hover .nav-icon{transform:scale(1.2) rotate(-6deg);background:rgba(245,200,66,.06);}
.nav-icon.gold img,.nav-icon.pink img,.nav-icon.blue img,.nav-icon.green img{filter:none}

.nav-text{flex:1;padding:0 4px}
.nav-title{
  font-size:1.1rem;font-weight:800;margin-bottom:4px;letter-spacing:.01em;
  background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.8) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.nav-desc{font-size:.72rem;color:var(--txt2);line-height:1.4}
.nav-arrow{
  color:rgba(245,200,66,.4);font-size:1.1rem;padding-right:18px;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .3s;
}
.nav-card:hover .nav-arrow{transform:translateX(5px);color:var(--gold);}

.menu-bottom{
  margin:0 16px 28px;padding:14px 20px;border-radius:16px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:space-between;
}
.mb-score{font-size:.8rem;color:var(--txt2)}
.streak-bar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.15);border-radius:12px;margin:0 16px 8px}
.streak-fire{font-size:1.2rem;line-height:1}
.streak-count{font-size:1.1rem;font-weight:800;color:var(--gold)}
.streak-label{font-size:.7rem;color:var(--txt2);line-height:1.2}
.streak-toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);background:linear-gradient(135deg,#f5c842,#fde68a);color:#1a1408;padding:12px 24px;border-radius:16px;font-weight:800;font-size:1rem;z-index:9999;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .4s;opacity:0;pointer-events:none;box-shadow:0 4px 24px rgba(245,200,66,.4);text-align:center}
.streak-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* ── BARRE DE PROGRESSION GLOBALE ── */
.global-prog-wrap{margin:0 16px 8px;padding:10px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;}
.global-prog-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.global-prog-lbl{font-size:.72rem;color:var(--txt2);font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
.global-prog-pct{font-size:.85rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.global-prog-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;}
.global-prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.mb-score span{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-weight:800;font-size:1.1rem;
}
.mb-actions{display:flex;gap:10px}
.mb-btn{
  padding:8px 16px;border-radius:50px;font-size:.75rem;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,.18);color:var(--txt2);
  background:rgba(10,7,24,.75);backdrop-filter:blur(8px);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.mb-btn:active{transform:scale(.93);}

/* ── CONTENT SECTIONS ── */
.p-section{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r);padding:18px 20px;margin-bottom:14px;
  backdrop-filter:blur(20px);box-shadow:var(--shadow-card);
  transition:all .3s;position:relative;overflow:hidden;
}
.p-section::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 50%);
  pointer-events:none;
}
.p-section:hover{border-color:rgba(245,200,66,.2);}
.p-sec-title{
  font-size:.95rem;font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:10px;
}
.p-sec-body{font-size:.84rem;color:var(--txt2);line-height:1.85}

.dua-box{
  background:linear-gradient(135deg,rgba(245,200,66,.1) 0%,rgba(245,200,66,.03) 100%);
  border:1px solid rgba(245,200,66,.25);
  border-radius:var(--r);padding:22px;text-align:center;margin-bottom:16px;
  backdrop-filter:blur(20px);
  box-shadow:0 8px 32px rgba(245,200,66,.1),inset 0 1px 0 rgba(245,200,66,.1);
  transition:all .35s cubic-bezier(.34,1.2,.64,1);
  position:relative;overflow:hidden;
}
.dua-box::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(245,200,66,.05) 0%,transparent 60%);
  animation:borderRotate 8s linear infinite;
}
.dua-box:hover{
  box-shadow:0 16px 48px rgba(245,200,66,.2),inset 0 1px 0 rgba(245,200,66,.15);
  transform:translateY(-2px);
}
.dua-ar{
  font-family:'Scheherazade New',serif;font-size:1.5rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2),#fff8dc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:2;margin-bottom:10px;
}
.dua-tr{font-size:.78rem;color:var(--txt2);font-style:italic;line-height:1.8}

.info-box{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r2);padding:14px 16px;
  font-size:.8rem;color:var(--txt2);line-height:1.7;
  backdrop-filter:blur(16px);
}
.info-box strong{color:var(--gold)}

.tip-box{
  background:rgba(10,7,24,.75);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r2);padding:14px 16px;
  font-size:.78rem;color:var(--txt2);line-height:1.7;
  backdrop-filter:blur(12px);
  transition:all .25s;
}
.tip-box:hover{border-color:rgba(255,255,255,.25);background:rgba(10,7,24,.85);}

/* ── SESSIONS ── */
.sess-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Cartes leçons — style carte hexagonale avec coin coupé */
.sess-card{
  background:linear-gradient(135deg,rgba(10,7,24,.95) 0%,var(--gold-dim) 40%,rgba(245,200,66,.06) 50%,var(--gold-dim) 60%,rgba(10,7,24,.95) 100%);
  background-size:300% auto;
  animation:shimmer 5s linear infinite;
  border:1px solid rgba(255,255,255,.07);
  border-radius:18px;padding:18px 14px 14px;cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s,background .3s;
  position:relative;overflow:hidden;
  backdrop-filter:blur(16px);
  box-shadow:0 2px 16px rgba(0,0,0,.25);
  min-height:120px;display:flex;flex-direction:column;
}
/* Coin décoratif haut-droite */
.sess-card::before{
  content:'';position:absolute;top:0;right:0;
  width:40px;height:40px;
  background:linear-gradient(225deg,var(--gold-dim) 0%,transparent 60%);
  border-bottom-left-radius:40px;
  transition:width .3s,height .3s,background .3s;
}
/* Barre de couleur en bas */
.sess-card::after{
  content:'';position:absolute;bottom:0;left:12px;right:12px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  border-radius:2px;opacity:.4;
  transition:opacity .3s,left .3s,right .3s;
}
.sess-card.c-blue::after{background:linear-gradient(90deg,transparent,var(--blue),transparent);}
.sess-card.c-orange::after{background:linear-gradient(90deg,transparent,var(--orange),transparent);}
.sess-card.c-both::after{background:linear-gradient(90deg,var(--orange),var(--blue));}
.sess-card.c-blue::before{background:linear-gradient(225deg,rgba(56,189,248,.12) 0%,transparent 60%);}
.sess-card.c-orange::before{background:linear-gradient(225deg,rgba(251,146,60,.12) 0%,transparent 60%);}

.sess-card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 16px 40px rgba(0,0,0,.45),0 0 0 1px rgba(245,200,66,.12);
  border-color:rgba(245,200,66,.15);
  background:rgba(255,255,255,.05);
}
.sess-card.sess-float{
  animation:floatCard 3s ease-in-out infinite;
  border-color:rgba(245,200,66,.22);
  background:rgba(245,200,66,.04);
  z-index:2;position:relative;
}
.sess-card:hover::before{width:56px;height:56px;background:linear-gradient(225deg,rgba(245,200,66,.1) 0%,transparent 60%);}
.sess-card:hover::after{opacity:.8;left:6px;right:6px;}
.sess-card:active{transform:scale(.96);}

.sess-num{font-size:.75rem;font-weight:800;color:var(--txt3);margin-right:5px;flex-shrink:0}
.sess-ar{
  font-family:var(--fa);font-size:1.7rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-top:8px;display:flex;justify-content:space-around;direction:rtl;
}
.sess-badge{display:inline-block;font-size:.56rem;padding:3px 8px;border-radius:50px;font-weight:700;margin-top:6px}
.bd-o{background:rgba(251,146,60,.12);color:var(--orange);border:1px solid rgba(251,146,60,.25);}
.bd-b{background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.22);}
.bd-ob{background:linear-gradient(135deg,rgba(251,146,60,.12),rgba(56,189,248,.1));color:var(--txt);border:1px solid rgba(251,146,60,.25);}

/* ── LESSON ── */
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;direction:rtl}
.ltab{
  font-family:var(--fa);font-size:1.4rem;padding:6px 14px;border-radius:14px;
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);color:var(--txt2);
  cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);font-weight:400;
  backdrop-filter:blur(12px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:48px;
}
.ltab:active{transform:scale(.9);}
.ltab.on{
  background:rgba(245,200,66,.15);color:#ffffff;
  border-color:rgba(245,200,66,.4);transform:scale(1.12);
  box-shadow:0 4px 20px rgba(245,200,66,.25),inset 0 1px 0 rgba(245,200,66,.2);
}
.ltab.t-o{border-color:var(--orange)}
.ltab.t-b{border-color:var(--blue)}
.ltab.t-ob{border-color:var(--orange);outline:1px solid var(--blue);outline-offset:2px}

.lc-layout{display:flex;flex-direction:column;gap:14px}
.pos-row-wrap{display:flex;gap:12px;direction:rtl;flex-wrap:wrap}
.pos-c{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:14px;text-align:center;
  min-width:76px;flex:1;max-width:116px;
  cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(16px);
  display:flex;flex-direction:column;justify-content:space-between;
}
.pos-c:active{transform:scale(.9);}
.pos-c:hover{border-color:rgba(245,200,66,.3);transform:translateY(-3px);}
.pos-lbl{font-size:.52rem;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;word-break:break-word;hyphens:auto}
.pos-ar{font-family:var(--fa);font-size:2rem;line-height:1.2}

.badge-row{display:flex;gap:8px;flex-wrap:wrap}
.bd-big{font-size:.74rem;padding:5px 14px;border-radius:50px;font-weight:700}

.fab{
  display:flex;justify-content:center;margin-top:20px;margin-bottom:4px;
  background:linear-gradient(135deg,var(--gold) 0%,#e8a020 50%,var(--gold) 100%);
  background-size:200% auto;
  color:#0a0718;border:none;border-radius:50px;padding:14px 36px;
  font-family:var(--ff);font-size:.9rem;font-weight:800;
  cursor:pointer;box-shadow:0 8px 30px rgba(245,200,66,.4);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  align-self:center;animation:shimmer 3s linear infinite;
}
.fab:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 16px 40px rgba(245,200,66,.5);}
.fab:active{transform:scale(.96);}

/* ── ORBITAL ── */
.orb-wrap{position:relative;width:270px;height:270px;margin:12px auto}
.orb-ctr{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:68px;height:68px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#c87a00);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fa);font-size:2.1rem;color:#0a0718;
  cursor:pointer;z-index:5;
  box-shadow:0 0 0 2px rgba(245,200,66,.3),0 0 30px rgba(245,200,66,.5),0 0 60px rgba(245,200,66,.2);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  animation:glow 3s ease-in-out infinite;
}
.orb-ctr:active{transform:translate(-50%,-50%) scale(.88);}
.orb-ctr.rpl{animation:rp .5s ease}

/* Ring autour de l'orb-ctr */
.orb-wrap::before{
  content:'';position:absolute;top:50%;left:50%;
  width:106px;height:106px;margin:-53px 0 0 -53px;
  border-radius:50%;border:1px solid rgba(245,200,66,.15);
  animation:borderRotate 8s linear infinite;
}

.orb-sat{
  position:absolute;width:48px;height:48px;border-radius:50%;
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);gap:2px;
  backdrop-filter:blur(12px);
}
.orb-sat:active{transform:scale(.82)!important}
.orb-sat:hover{border-color:rgba(245,200,66,.4);background:rgba(245,200,66,.08);}
.orb-sat.lit{
  background:rgba(245,200,66,.15);border-color:rgba(245,200,66,.5);
  box-shadow:0 0 16px rgba(245,200,66,.3);
}
.orb-sat.lit .orb-ar,.orb-sat.lit .orb-lat{color:var(--gold)}
.orb-ar{font-family:var(--fa);font-size:.95rem;color:var(--vowel);line-height:1}
.orb-lat{font-size:.44rem;color:var(--txt2)}

/* ── VOWEL ── */
.vline-section{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r2);padding:16px 10px;
  backdrop-filter:blur(16px);
}
.wline{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:2px}
.wline-lbl{font-size:.68rem;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0}

/* ── QUIZ ── */
.qz-layout{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.qz-q{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:22px;padding:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;flex:1;min-height:0;
  backdrop-filter:blur(20px);box-shadow:var(--shadow-card);
  position:relative;overflow:visible;
}
.qz-q::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(245,200,66,.06) 0%,transparent 70%);
  pointer-events:none;
}
.qz-a{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.qz-a-row{display:flex;gap:10px}.qz-a-row .ans-btn{flex:1}
.qz-a-center{display:flex;justify-content:center}.qz-a-center .ans-btn{width:60%;min-width:180px}

.q-lbl{font-size:.8rem;color:var(--txt2);margin-bottom:10px}
.q-big{
  font-family:var(--fa);font-size:clamp(1.3rem,5.5vw,2.8rem);
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.6;cursor:pointer;word-break:break-word;direction:rtl;
  padding:4px 8px;overflow:visible;
  filter:drop-shadow(0 4px 12px rgba(245,200,66,.3));
}
.q-big.noclick{cursor:default;pointer-events:none}
.q-big-vow{
  font-family:var(--fa);font-size:3.5rem;color:var(--vowel);line-height:1;cursor:pointer;
  filter:drop-shadow(0 4px 12px rgba(249,115,22,.3));
}
.q-big-vow.noclick{cursor:default;pointer-events:none}
.vow-baseline-wrap{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:16px 40px 8px;}
.vow-baseline-line{width:100%;height:2px;background:rgba(255,255,255,0.25);border-radius:2px;margin:0;}
.vow-baseline-char{font-family:var(--fa);font-size:3.5rem;color:var(--vowel);line-height:1.0;cursor:pointer;display:block;text-align:center;padding:0 8px;filter:drop-shadow(0 4px 12px rgba(249,115,22,.3));}
.q-lbtn{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:50px;padding:8px 18px;color:var(--txt);cursor:pointer;
  font-size:.77rem;display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(12px);
}
.q-lbtn:active{transform:scale(.94);}

.ans-btn{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:14px;cursor:pointer;
  font-weight:600;font-size:.87rem;color:var(--txt);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);text-align:center;
  backdrop-filter:blur(16px);position:relative;overflow:hidden;
}
.ans-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
  opacity:0;transition:opacity .2s;
}
.ans-btn:hover{border-color:rgba(255,255,255,.2);transform:translateY(-2px);}
.ans-btn:hover::before{opacity:1;}
.ans-btn.ar-ans{font-family:var(--fa);font-size:1.6rem}
.ans-btn:active{transform:scale(.95);}
.ans-btn.correct{
  background:rgba(34,211,160,.15);border-color:var(--green);color:#7fffd4;
  animation:pring .5s ease;box-shadow:0 0 20px rgba(34,211,160,.3);
}
.ans-btn.wrong{
  background:rgba(255,77,109,.12);border-color:var(--red);color:#ffb3c0;
  animation:shake .4s ease;
}
.ans-btn.reveal{border-color:var(--green);opacity:.5}

.rf{
  padding:8px 14px;border-radius:12px;font-weight:700;font-size:.82rem;
  display:none;text-align:center;margin-top:8px;
}
.rf.on{display:block}
.rf.ok{background:rgba(34,211,160,.15);border:1px solid var(--green);color:#7fffd4}
.rf.bad{background:rgba(255,77,109,.12);border:1px solid var(--red);color:#ffb3c0}

.qz-prog{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-shrink:0}
.qpb{
  flex:1;height:5px;background:rgba(255,255,255,.06);
  border-radius:3px;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
}
.qpf{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));
  background-size:200% auto;
  transition:width .5s cubic-bezier(.34,1.2,.64,1);
  border-radius:3px;
  box-shadow:0 0 8px rgba(245,200,66,.5);
  animation:shimmer 2s linear infinite;
}
.qs-lbl{font-size:.75rem;color:var(--gold);font-weight:700;white-space:nowrap}

.res-w{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center}
.res-c{
  width:110px;height:110px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:2rem;font-weight:800;
  animation:zoomIn .5s cubic-bezier(.34,1.56,.64,1);
}
.rc-p{
  background:radial-gradient(circle,#22d3a0,#0a7f5c);
  box-shadow:0 0 40px rgba(34,211,160,.6),0 0 80px rgba(34,211,160,.2);
}
.rc-f{
  background:radial-gradient(circle,#ff4d6d,#cc0033);
  box-shadow:0 0 40px rgba(255,77,109,.5),0 0 80px rgba(255,77,109,.2);
}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rbtn{
  padding:12px 24px;border-radius:50px;border:none;
  font-family:var(--ff);font-size:.86rem;font-weight:700;
  cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);
}
.rbtn-m{
  background:linear-gradient(135deg,var(--gold),#e8a020);
  color:#0a0718;box-shadow:0 8px 24px rgba(245,200,66,.4);
}
.rbtn-m:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(245,200,66,.5);}
.rbtn-s{background:rgba(10,7,24,.75);color:var(--txt);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);}
.rbtn-s:hover{border-color:rgba(255,255,255,.2);}
.rbtn:active{transform:scale(.95);}

/* ── PROGRESS ── */
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-c{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:12px 14px;
  backdrop-filter:blur(16px);transition:all .25s;
}
.pg-c:hover{border-color:rgba(245,200,66,.2);}
.pg-n{font-size:.73rem;font-weight:700;margin-bottom:6px}
.pg-bw{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.pg-bf{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width .8s cubic-bezier(.34,1.2,.64,1);
  border-radius:3px;box-shadow:0 0 6px rgba(245,200,66,.4);
}
.pg-p{font-size:.67rem;color:var(--gold);margin-top:4px;font-weight:700}
.pg-ov{
  grid-column:span 2;
  background:linear-gradient(135deg,var(--gold),#c87a00);
  border-radius:16px;padding:14px;text-align:center;
  color:#0a0718;font-weight:800;font-size:.95rem;
  box-shadow:var(--shadow-gold);
  animation:glow 3s ease-in-out infinite;
}

/* ── SETTINGS ── */
.set-row{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;font-size:.84rem;
  backdrop-filter:blur(16px);
  transition:all .25s;
}
.set-row:hover{border-color:rgba(255,255,255,.14);}
.tog{
  width:42px;height:22px;background:rgba(255,255,255,.1);
  border-radius:11px;position:relative;cursor:pointer;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.tog.on{background:var(--gold);box-shadow:0 0 12px rgba(245,200,66,.4);}
.tog::after{
  content:'';position:absolute;width:16px;height:16px;border-radius:50%;
  background:white;top:3px;left:3px;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.tog.on::after{transform:translateX(20px)}

/* ── CONTACT ── */
.cform-input{
  width:100%;padding:14px 16px;border-radius:14px;margin-bottom:12px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  color:var(--txt);font-family:var(--ff);font-size:.86rem;outline:none;
  transition:all .25s;resize:vertical;backdrop-filter:blur(8px);
}
.cform-input::placeholder{color:var(--txt3)}
.cform-input:focus{border-color:rgba(245,200,66,.4);background:rgba(255,255,255,.07);box-shadow:0 0 0 3px rgba(245,200,66,.08);}
.cform-btn{
  width:100%;padding:14px;border-radius:50px;border:none;
  background:linear-gradient(135deg,var(--gold),#e8a020);
  color:#0a0718;font-family:var(--ff);font-size:.9rem;font-weight:800;
  cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 30px rgba(245,200,66,.35);
}
.cform-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(245,200,66,.5);}
.cform-btn:disabled{opacity:.5;cursor:not-allowed;}
.cform-btn:active{transform:scale(.97);}
.cform-success{
  background:rgba(34,211,160,.1);border:1px solid rgba(34,211,160,.3);
  border-radius:16px;padding:22px 18px;text-align:center;
  color:#7fffd4;font-size:.9rem;line-height:2;
}

@media(max-width:420px){
  .pg-grid{grid-template-columns:1fr}
  .pos-row-wrap{justify-content:center}
}


/* ── MASCOT BOB ANIMATION ── */
@keyframes mascotBob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-12px) rotate(2deg); }
}
@keyframes mascotSpin {
  0% { transform: translateY(-20px) scale(1.2) rotate(0deg); }
  100% { transform: translateY(-20px) scale(1.2) rotate(360deg); }
}

/* ── BOY MASCOT THUMBNAIL ── */
#boy-mascot{
  position:fixed;bottom:16px;left:16px;
  width:90px;height:90px;border-radius:0;
  overflow:visible;z-index:50;
  box-shadow:none;border:none;
  display:none;
  cursor:pointer;
  animation: mascotBob 2s ease-in-out infinite !important;
}
#boy-mascot:hover{
  animation: none !important;
  transform: translateY(-20px) scale(1.2) rotate(5deg) !important;
  transition: transform 0.3s ease !important;
}
#boy-mascot.mascot-spin {
  animation: mascotSpin 0.5s ease-in-out !important;
}
#boy-mascot img{width:100%;height:100%;object-fit:contain;}

/* ── GIRL MASCOT THUMBNAIL ── */
#girl-mascot{
  position:fixed;bottom:16px;left:16px;
  width:90px;height:90px;border-radius:0;
  overflow:visible;z-index:50;
  box-shadow:none;
  border:none;
  display:none;
  cursor:pointer;
  animation: mascotBob 2s ease-in-out infinite !important;
}
#girl-mascot:hover{
  animation: none !important;
  transform: translateY(-20px) scale(1.2) rotate(5deg) !important;
  transition: transform 0.3s ease !important;
}
#girl-mascot.mascot-spin {
  animation: mascotSpin 0.5s ease-in-out !important;
}
#girl-mascot img{width:100%;height:100%;object-fit:cover;}

/* ── SCHEHERAZADE NEW POUR TOUT TEXTE ARABE ── */
:lang(ar), [dir="rtl"], .ar, .dua-ar, .dua-ar2,
[style*="font-family:var(--fa)"],
[style*="font-family:'Scheherazade"] {
  font-family: 'Scheherazade New', serif !important;
}

/* Forcer sur tout caractère arabe via CSS unicode */
* {
  font-family: inherit;
}

/* Override global pour les caractères arabes */
@font-face {
  font-family: 'ArabicOverride';
  src: local('Scheherazade New');
  unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF;
}

body {
  font-family: 'ArabicOverride', 'Outfit', sans-serif;
}


/* ══════════════════════════════════════════
   MODULE ÉCRITURE - PRATIQUE DES LETTRES
══════════════════════════════════════════ */
.writing-module{
  margin-top:20px;
  background:rgba(10,7,24,.75);
  border:1px solid rgba(255,255,255,.18);
  border-radius:20px;
  padding:18px;
  backdrop-filter:blur(16px);
}
/* ── Portrait : colonne simple ── */
.wm-body{ display:flex; flex-direction:column; gap:8px; }
.wm-forms-col{ display:none; } /* caché en portrait */
.wm-controls-col{ display:none; } /* caché en portrait, géré via .wm-portrait-only */
.wm-canvas-col{ width:100%; }

/* Canvas portrait : plus petit */
@media(orientation:portrait){
  .canvas-wrap{ max-width:82vw; margin:0 auto; }
  .writing-canvas{ aspect-ratio:1/1 !important; max-height:72vw; }
  .wm-mini-tabs{ gap:8px; direction:rtl; }
}

/* ── Paysage : 3 colonnes ── */
@media(orientation:landscape){
  .writing-module{ padding:10px 14px; }
  .wm-body{ flex-direction:row; align-items:flex-start; gap:10px; }
  .wm-forms-col{
    display:flex; flex-direction:column;
    gap:4px; width:115px; flex-shrink:0;
    border:none; overflow:hidden;
    max-height:none; height:auto;
  }
  .wm-forms-col .letter-forms{
    overflow:hidden !important;
    flex-wrap:nowrap;
    flex-direction:column !important;
    height:auto;
    max-height:none;
  }
  .wm-canvas-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; border:none; }
  .wm-controls-col{
    display:flex; flex-direction:column;
    gap:8px; min-width:120px;
  }
  .canvas-wrap{ width:100%; max-width:none; margin:0; }
  .writing-canvas{ aspect-ratio:4/3 !important; max-height:42vh; }
  .wm-portrait-only{ display:none !important; }
  .writing-module-title{ display:none; }
  .wm-mini-tabs{ direction:rtl; }
}
.writing-module-title{
  font-size:.85rem;font-weight:700;
  color:var(--pink);
  text-align:center;margin-bottom:14px;
  letter-spacing:.05em;text-transform:uppercase;
}
.writing-controls{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;margin-bottom:12px;
}
.writing-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:50px;
  font-size:.75rem;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.07);color:#ccc;
  transition:all .2s;
}
.writing-btn:hover{background:rgba(255,255,255,.15);color:#fff;}
.writing-btn.active{
  background:rgba(245,200,66,.2);
  border-color:rgba(245,200,66,.5);
  color:var(--gold);
}
.brush-sizes{
  display:flex;gap:6px;justify-content:center;margin-bottom:12px;
}
.brush-btn{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.07);
  transition:all .2s;
}
.brush-btn.active{
  border-color:rgba(245,200,66,.6);
  background:rgba(245,200,66,.15);
}
.brush-dot{
  border-radius:50%;
  background:#ccc;
  transition:background .2s;
}
.brush-btn.active .brush-dot{background:var(--gold);}
.canvas-wrap{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  touch-action:none;
}
.writing-canvas{
  display:block;width:100%;
  aspect-ratio:1;
  cursor:crosshair;
  touch-action:none;
}
@media(orientation:landscape){
  
}
.canvas-hint{
  text-align:center;font-size:.95rem;font-weight:700;
  color:#ffffff;margin-top:8px;margin-bottom:6px;
  letter-spacing:.01em;
}
.wm-mini-tabs{
  display:flex;gap:5px;justify-content:center;
  margin-bottom:8px;flex-wrap:wrap;
  padding:0 4px;
  direction:rtl;
}
.wm-mini-tab{
  display:flex;flex-direction:column;align-items:center;
  gap:1px;padding:4px 7px;border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  cursor:pointer;transition:all .2s;
  font-family:'Scheherazade New',serif;
  font-size:1.1rem;color:#aaa;
}
.wm-mini-tab.active{
  background:rgba(245,200,66,.2);
  border-color:rgba(245,200,66,.5);
  color:var(--gold);
}
.wm-mini-tab-name{
  font-size:.48rem;color:rgba(255,255,255,.4);
  font-family:Outfit,sans-serif;text-align:center;
}
.letter-forms{
  display:flex;gap:6px;justify-content:center;
  margin-bottom:12px;flex-wrap:nowrap;
  overflow-x:auto;
}
.lform-btn{
  display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:5px 6px;border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);
  cursor:pointer;transition:all .2s;
  flex:1;min-width:0;
}
.lform-btn:hover{background:rgba(255,255,255,.14);}
.lform-btn.active{
  background:rgba(245,200,66,.2);
  border-color:rgba(245,200,66,.5);
}
.lform-ar{
  font-family:'Scheherazade New',serif;
  font-size:1.5rem;color:var(--gold);
  direction:rtl;line-height:1.2;
}
.lform-label{
  font-size:.6rem;color:rgba(255,255,255,.5);
  text-transform:uppercase;letter-spacing:.04em;
}
/* En paysage les formes sont en row: lettre à gauche, label à droite */
@media(orientation:landscape){
  .lform-btn{ 
    flex-direction:row !important; 
    gap:0; 
    justify-content:space-between !important; 
    align-items:center;
    padding:6px 10px;
  }
  .lform-ar{ 
    font-size:1.4rem; 
    flex-shrink:0; 
    order:1;
    margin-right:auto;
  }
  .lform-label{ 
    order:2;

    flex-shrink:0;
  }
}
.writing-actions{
  display:flex;gap:8px;margin-top:10px;justify-content:center;
}
.writing-action-btn{
  flex:1;max-width:120px;
  padding:8px 10px;border-radius:12px;
  font-size:.78rem;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:#ccc;
  transition:all .2s;text-align:center;
}
.writing-action-btn:hover{background:rgba(255,255,255,.14);color:#fff;}
.writing-action-btn.danger{
  border-color:rgba(255,80,80,.3);
  color:rgba(255,100,100,.8);
}
.writing-action-btn.danger:hover{
  background:rgba(255,80,80,.15);
  color:#ff6060;
}
.bonus-title-ar{font-size:.92rem;}
@media(min-width:601px){.bonus-title-ar{font-size:1.08rem!important;}}
.bonus-title-lat{font-size:.92rem;}
@media(max-width:600px){.bonus-title-lat{font-size:.77rem!important;}}
.bonus-img{width:100%;border-radius:10px;margin:12px auto;display:block;}
@media(min-width:601px){.bonus-img{width:33%;}}
.bonus-flowers-row{display:flex;flex-direction:column;align-items:center;gap:24px;}
@media(min-width:601px){.bonus-flowers-row{flex-direction:row;justify-content:center;gap:40px;}}


/* ══════════════════════════════════════════════════════════
   WELCOME — CARTES PROFIL ENFANT (avant sélection)

.prof-card.girl {

  border: 2.5px solid rgba(233,30,140,.35) !important;

  box-shadow: 0 10px 36px rgba(233,30,140,.22), 0 2px 8px rgba(0,0,0,.08) !important;
}
.prof-card.boy {

  border: 2.5px solid rgba(2,136,209,.35) !important;

.prof-card.girl .prof-name {
  font-size: 1.25rem !important; color: #c2185b !important;

.prof-card.boy .prof-name {

/* ══════════════════════════════════════════════════════════
   INTERFACE FILLE — fond clair rose/lilas
══════════════════════════════════════════════════════════ */
body.profile-girl, #root.profile-girl {
  background: linear-gradient(145deg,#fce4ec 0%,#f3e5f5 40%,#fce4ec 100%) !important;
  color: #4a1040 !important;
  --txt: #4a1040;
  --txt2: #9c5a8a;
  --txt3: #c48aae;
  --gold: #c2185b;
  --gold2: #f06292;
}
#root.profile-girl::before {
  background:
    radial-gradient(circle at 15% 20%,rgba(255,182,193,.7) 0%,transparent 45%),
    radial-gradient(circle at 85% 75%,rgba(216,191,216,.7) 0%,transparent 45%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.4) 0%,transparent 60%) !important;
  animation: none !important;
}
#root.profile-girl::after { background-image: none !important; }

/* Particules flottantes fille */
@keyframes floatGirl { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-18px) rotate(10deg)} }
#root.profile-girl .particle { background: rgba(233,30,140,.25) !important; animation: floatGirl 6s ease-in-out infinite !important; }

/* Topbar fille */
#root.profile-girl .topbar {
  background: linear-gradient(180deg,rgba(252,228,236,.98) 0%,rgba(252,228,236,0) 100%) !important;
  backdrop-filter: blur(12px) !important;
}
#root.profile-girl .tb-title {
  background: linear-gradient(135deg,#c2185b,#f06292) !important;
  -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important;
}
#root.profile-girl .tb-back {
  background: rgba(255,255,255,.8) !important; border-color: rgba(233,30,140,.3) !important; color: #ad1457 !important;
}
#root.profile-girl .sound-dot { background: #e91e8c !important; box-shadow: 0 0 10px rgba(233,30,140,.6) !important; }

/* Cards / sections fille */
#root.profile-girl .card,
#root.profile-girl .p-section,
#root.profile-girl .nav-card,
#root.profile-girl .dua-box,
#root.profile-girl .writing-module,
#root.profile-girl .menu-bottom,
#root.profile-girl .global-prog-wrap {
  background: rgba(255,255,255,.82) !important;
  border-color: rgba(233,30,140,.22) !important;
  color: #4a1040 !important;
  box-shadow: 0 8px 28px rgba(233,30,140,.15), 0 2px 8px rgba(0,0,0,.07) !important;
}
#root.profile-girl .card::before { background: linear-gradient(135deg,rgba(255,182,193,.1) 0%,transparent 50%) !important; }

/* Nav cards fille */
#root.profile-girl .nav-card::before {
  background: linear-gradient(180deg,#c2185b,#f06292) !important;
  box-shadow: 0 0 20px rgba(194,24,91,.5), 0 0 40px rgba(194,24,91,.2) !important;
}
#root.profile-girl .nav-title {
  background: linear-gradient(135deg,#880e4f,#c2185b) !important;
  -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important;
  font-size: 1.15rem !important;
}

/* ══════════════════════════════════════════════════════════
   VRAIES ANIMATIONS 3D — CARTES, NAV, SESSIONS
══════════════════════════════════════════════════════════ */
@keyframes card3dIn {
  0%   { opacity:0; transform: perspective(800px) rotateX(15deg) rotateY(-8deg) scale(.88) translateY(30px); filter:blur(5px); }
  60%  { opacity:1; transform: perspective(800px) rotateX(-3deg) rotateY(2deg)  scale(1.02) translateY(-5px); filter:blur(0); }
  100% { opacity:1; transform: perspective(800px) rotateX(0)    rotateY(0)      scale(1)    translateY(0); }
}
@keyframes floatBounce {
  0%,100% { transform: translateY(0) rotate(0deg); }
  30%     { transform: translateY(-10px) rotate(-1deg); }
  60%     { transform: translateY(-6px) rotate(1deg); }
}
@keyframes shimmer3d {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes popBounce {
  0%   { opacity:0; transform: scale(0) rotate(-5deg); }
  55%  { opacity:1; transform: scale(1.12) rotate(2deg); }
  75%  { transform: scale(.96) rotate(-1deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes slideUp3d {
  0%   { opacity:0; transform: perspective(600px) rotateX(20deg) translateY(40px); filter:blur(4px); }
  70%  { opacity:1; transform: perspective(600px) rotateX(-3deg) translateY(-5px); filter:blur(0); }
  100% { opacity:1; transform: perspective(600px) rotateX(0) translateY(0); }
}
@keyframes waveIn {
  0%   { opacity:0; transform: translateX(-60px) skewX(8deg); filter:blur(4px); }
  60%  { opacity:1; transform: translateX(8px) skewX(-2deg); filter:blur(0); }
  100% { opacity:1; transform: translateX(0) skewX(0); }
}

/* Appliquer 3D sur les nav-cards */
.nav-card {
  transform-style: preserve-3d;
  transition: transform .4s cubic-bezier(.34,1.4,.64,1), box-shadow .4s, border-color .3s !important;
  will-change: transform;
}
.nav-card:hover {
  transform: translateX(8px) translateY(-3px) scale(1.02) perspective(500px) rotateY(-2deg) !important;
}
.nav-card:nth-child(1) { animation: waveIn .5s .05s both cubic-bezier(.34,1.4,.64,1); }
.nav-card:nth-child(2) { animation: waveIn .5s .55s both cubic-bezier(.34,1.4,.64,1); }
.nav-card:nth-child(3) { animation: waveIn .5s 1.05s both cubic-bezier(.34,1.4,.64,1); }
.nav-card:nth-child(4) { animation: waveIn .5s 1.55s both cubic-bezier(.34,1.4,.64,1); }
.nav-card:nth-child(5) { animation: waveIn .5s 2.05s both cubic-bezier(.34,1.4,.64,1); }
.nav-card:nth-child(6) { animation: waveIn .5s 2.55s both cubic-bezier(.34,1.4,.64,1); }
/* Menu déjà animé — neutralise les animations CSS */
.menu-anim-done .nav-card { animation: none !important; opacity: 1 !important; transform: translateX(0) !important; }

/* Appliquer 3D sur les sess-cards */
.sess-card {
  transform-style: preserve-3d;
  transition: transform .4s cubic-bezier(.34,1.4,.64,1), box-shadow .4s, border-color .3s !important;
  will-change: transform;
}
.sess-card:hover {
  transform: translateY(-10px) scale(1.04) perspective(600px) rotateX(3deg) !important;
  box-shadow: 0 20px 50px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.15) !important;

/* 3D sur prof-cards welcome */
.prof-card {
  transform-style: preserve-3d;
  transition: transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .4s, border-color .3s !important;
}

  transform: translateY(-8px) scale(1.04) perspective(600px) rotateY(3deg) !important;
}

/* Nav icon tourne en 3D au hover */

  transform: scale(1.25) rotateY(15deg) rotateZ(-5deg) !important;

/* Emoji profil flotte */

  transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s !important;
  box-shadow: 0 3px 0 rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.2);
}
.pg-c:hover {
  transform: translateY(-5px) scale(1.03) !important;
  box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 36px rgba(0,0,0,.25) !important;
}

/* Bottom menu buttons */
.mb-btn {
  transition: transform .15s, box-shadow .15s !important;
  box-shadow: 0 3px 0 rgba(0,0,0,.28), 0 5px 14px rgba(0,0,0,.2);
}
.mb-btn:active {
  transform: translateY(3px) scale(.94) !important;
  box-shadow: 0 0 0 rgba(0,0,0,.2) !important;
}

/* Petit bouton rbtn-s */
.rbtn-s {
  box-shadow: 0 3px 0 rgba(0,0,0,.25), 0 5px 12px rgba(0,0,0,.15);
  transition: transform .12s, box-shadow .12s !important;
}
.rbtn-s:active {
  transform: translateY(3px) !important;
  box-shadow: 0 0 0 rgba(0,0,0,.2) !important;
}

/* Info-box et tip-box — léger lift */
.info-box, .tip-box {
  transition: transform .3s cubic-bezier(.34,1.4,.64,1), box-shadow .3s !important;
  box-shadow: 0 3px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.15);
}
.info-box:hover, .tip-box:hover {
  transform: translateY(-3px) !important;
  box-shadow: 0 8px 0 rgba(0,0,0,.2), 0 14px 30px rgba(0,0,0,.2) !important;
}

/* Bonus/leçon cards sur la grille bonus */
.sess-card.sess-float {
  box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 14px 36px rgba(0,0,0,.3) !important;
}

/* ══ BOUTONS 3D PRESS ══ */
.lbtn {
  box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 10px 24px rgba(245,200,66,.2) !important;
  transition: transform .12s cubic-bezier(.4,0,.2,1), box-shadow .12s !important;
}
.lbtn:active {
  transform: translateY(5px) scale(.98) !important;
  box-shadow: 0 1px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.15) !important;
}
.fab {
  box-shadow: 0 5px 0 rgba(0,0,0,.28), 0 8px 20px rgba(245,200,66,.25);
  transition: transform .12s, box-shadow .12s !important;
}
.fab:hover { transform: translateY(-3px) !important; box-shadow: 0 8px 0 rgba(0,0,0,.28), 0 14px 30px rgba(245,200,66,.3) !important; }
.fab:active { transform: translateY(4px) scale(.98) !important; box-shadow: 0 1px 0 rgba(0,0,0,.2) !important; }
.rbtn-m {
  box-shadow: 0 4px 0 rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.15);
  transition: transform .12s, box-shadow .12s !important;
}
.rbtn-m:active { transform: translateY(3px) !important; box-shadow: 0 1px 0 rgba(0,0,0,.2) !important; }

/* ══ LETTRES ARABES DÉCO ══ */
.ar-deco-letter {
  position:absolute;font-family:'Scheherazade New',serif;
  pointer-events:none;user-select:none;
  background:linear-gradient(135deg,rgba(245,200,66,.35),rgba(245,200,66,.08));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 8px rgba(245,200,66,.25));
  animation:arFloat var(--ad,8s) ease-in-out infinite;
  animation-delay:var(--adel,0s);
}
@keyframes arFloat {
  0%,100%{transform:translateY(0) rotate(var(--ar,0deg)) scale(1)}
  33%{transform:translateY(-18px) rotate(calc(var(--ar,0deg) + 4deg)) scale(1.05)}
  66%{transform:translateY(8px) rotate(calc(var(--ar,0deg) - 3deg)) scale(.97)}
}

/* ══════════════════════════════════════════════════════════
   AMÉLIORATIONS ENFANTS — Police Nunito, couleurs vives, animations
══════════════════════════════════════════════════════════ */

/* B. Police Nunito pour profils enfants */
#root.profile-girl .nav-title,
#root.profile-boy .nav-title,
#root.profile-girl .tb-title,
#root.profile-boy .tb-title,
#root.profile-girl .lbtn,
#root.profile-boy .lbtn,
#root.profile-girl .rbtn-m,
#root.profile-boy .rbtn-m,
#root.profile-girl .pg-title,
#root.profile-boy .pg-title {
  font-family: 'Nunito', sans-serif !important;
}

/* A. Couleurs plus vives — girl : rose vif, boy : bleu vif */
#root.profile-girl .lbtn {
  background: linear-gradient(135deg,#ff1a8c 0%,#ff4da6 50%,#ff1a8c 100%) !important;
  background-size: 200% auto !important;
  box-shadow: 0 8px 28px rgba(255,26,140,.5) !important;
}
#root.profile-girl .lbtn:hover { box-shadow: 0 12px 40px rgba(255,26,140,.65) !important; }
#root.profile-girl .rbtn-m { background: linear-gradient(135deg,#ff1a8c,#ff4da6) !important; box-shadow: 0 8px 24px rgba(255,26,140,.45) !important; }
#root.profile-girl .rbtn-m:hover { box-shadow: 0 14px 32px rgba(255,26,140,.55) !important; }
#root.profile-girl .nav-title {
  background: linear-gradient(135deg,#ff1a8c,#ff4da6) !important;
  -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important;
}
#root.profile-girl .tb-title {
  background: linear-gradient(135deg,#ff1a8c,#ff4da6) !important;
  -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important;
}
#root.profile-girl .sound-dot { background: #ff1a8c !important; box-shadow: 0 0 12px rgba(255,26,140,.7) !important; }
#root.profile-girl .streak-count { color: #ff1a8c !important; }
#root.profile-girl .p-sec-title { background: linear-gradient(135deg,#ff1a8c,#ff4da6) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important; }
#root.profile-girl .global-prog-fill { background: linear-gradient(90deg,#ff1a8c,#ff4da6) !important; }

#root.profile-boy .lbtn {
  background: linear-gradient(135deg,#0077dd 0%,#00aaff 50%,#0077dd 100%) !important;
  background-size: 200% auto !important;
  box-shadow: 0 8px 28px rgba(0,119,221,.5) !important;
}
#root.profile-boy .lbtn:hover { box-shadow: 0 12px 40px rgba(0,119,221,.65) !important; }
#root.profile-boy .rbtn-m { background: linear-gradient(135deg,#0077dd,#00aaff) !important; box-shadow: 0 8px 24px rgba(0,119,221,.45) !important; }
#root.profile-boy .rbtn-m:hover { box-shadow: 0 14px 32px rgba(0,119,221,.55) !important; }
#root.profile-boy .nav-title {
  background: linear-gradient(135deg,#0077dd,#00aaff) !important;
  -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important;
}
#root.profile-boy .tb-title {
  background: linear-gradient(135deg,#0077dd,#00aaff) !important;
  -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important;
}
#root.profile-boy .sound-dot { background: #00aaff !important; box-shadow: 0 0 12px rgba(0,170,255,.7) !important; }
#root.profile-boy .streak-count { color: #0077dd !important; }
#root.profile-boy .p-sec-title { background: linear-gradient(135deg,#0077dd,#00aaff) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important; }
#root.profile-boy .global-prog-fill { background: linear-gradient(90deg,#0077dd,#00aaff) !important; }

/* C. Fond animé étoiles/papillons fille, fusées/éclairs garçon */
/* Papillon : vol en zigzag ondulant */
/* 🦋 Papillon : vient de gauche, zigzag ondulant vers la droite, se retourne */
@keyframes butterflyFly {
  0%   { transform: translate(-15vw, 0px) scaleX(1);   opacity:0; }
  5%   { opacity:1; }
  15%  { transform: translate(8vw,  -5vh) scaleX(-1);  opacity:1; }
  30%  { transform: translate(25vw,  3vh) scaleX(1);   opacity:1; }
  45%  { transform: translate(45vw, -6vh) scaleX(-1);  opacity:1; }
  60%  { transform: translate(63vw,  4vh) scaleX(1);   opacity:1; }
  75%  { transform: translate(82vw, -4vh) scaleX(-1);  opacity:1; }
  92%  { opacity:1; }
  100% { transform: translate(115vw, 2vh) scaleX(1);   opacity:0; }
}

/* ⚽ Ballon : vient de droite, sort à gauche, trajectoire en arc léger + rotation */
@keyframes footballKick {
  0%   { transform: translate(110vw, 0px) rotate(0deg);   opacity:0; }
  4%   { opacity:1; }
  30%  { transform: translate(70vw, -6vh) rotate(200deg); opacity:1; }
  60%  { transform: translate(30vw,  2vh) rotate(380deg); opacity:1; }
  92%  { opacity:1; }
  100% { transform: translate(-20vw, 4vh) rotate(520deg); opacity:0; }
}

/* 🦄 Licorne : vient de droite, vole vers la gauche (emoji déjà orienté gauche) */
@keyframes unicornFly {
  0%   { transform: translate(118vw,  6vh) rotate( 5deg) scale(0.7); opacity:0; }
  7%   { opacity:1; }
  25%  { transform: translate(80vw,  -2vh) rotate( 3deg) scale(1);   opacity:1; }
  50%  { transform: translate(50vw,  -7vh) rotate( 0deg) scale(1.1); opacity:1; }
  75%  { transform: translate(20vw,  -2vh) rotate(-3deg) scale(1);   opacity:1; }
  93%  { opacity:1; }
  100% { transform: translate(-20vw,  5vh) rotate(-6deg) scale(0.7); opacity:0; }
}

/* 🚀 Fusée : bas → haut en ligne droite, rétrécit à mi-écran */
@keyframes rocketLaunch {
  0%   { transform: translateY(110vh) rotate(-45deg) scale(1.4); opacity:0; }
  6%   { transform: translateY(85vh)  rotate(-45deg) scale(1.4); opacity:1; }
  48%  { transform: translateY(5vh)   rotate(-45deg) scale(1.3); opacity:1; }
  52%  { transform: translateY(-5vh)  rotate(-45deg) scale(1.1); opacity:1; }
  75%  { transform: translateY(-55vh) rotate(-45deg) scale(0.5); opacity:1; }
  92%  { transform: translateY(-95vh) rotate(-45deg) scale(0.1); opacity:0.4; }
  100% { transform: translateY(-115vh) rotate(-45deg) scale(0.05); opacity:0; }
}

/* ⚡ Éclair : flash vertical intense, disparaît */
@keyframes lightningStrike {
  0%,100%  { opacity:0; transform:scaleY(0.3) skewX(15deg); }
  3%  { opacity:1; transform:scaleY(1.4) skewX(-8deg); }
  6%  { opacity:0.1; }
  9%  { opacity:1; transform:scaleY(1)  skewX(10deg); }
  14% { opacity:0; }
}

/* ⭐ Étoile : scintille et dérive lentement vers le haut */
@keyframes starTwinkle {
  0%   { transform: translateY(0px)   rotate(0deg)   scale(1);   opacity:0.5; }
  25%  { transform: translateY(-12px) rotate(45deg)  scale(1.3); opacity:1;   }
  50%  { transform: translateY(-5px)  rotate(90deg)  scale(0.85);opacity:0.6; }
  75%  { transform: translateY(-18px) rotate(135deg) scale(1.2); opacity:1;   }
  100% { transform: translateY(0px)   rotate(180deg) scale(1);   opacity:0.5; }
}

#girl-bg-anim, #boy-bg-anim {
  position:fixed;inset:0;
  pointer-events:none;z-index:0;overflow:hidden;
  display:none;
}
body.profile-girl #girl-bg-anim,
body.profile-boy #boy-bg-anim {
  display:block !important;
}
#girl-bg-anim .bg-star {
  position:absolute;font-size:2.8rem;opacity:.6;
  animation:starTwinkle 4s ease-in-out infinite;
  animation-delay:var(--del,0s);
}
#girl-bg-anim .bg-butterfly {
  position:fixed;font-size:2.5rem;opacity:.5;
  animation:butterflyFly 12s linear infinite backwards;
  animation-delay:var(--del,0s);
}
#girl-bg-anim .bg-unicorn {
  position:fixed;font-size:3.5rem;opacity:.5;
  animation:unicornFly 14s linear infinite backwards;
  animation-delay:var(--del,0s);
}
#boy-bg-anim .bg-rocket {
  position:fixed;font-size:2.6rem;opacity:.5;
  animation:rocketLaunch 7s linear infinite backwards;
  animation-delay:var(--del,0s);
}
#boy-bg-anim .bg-lightning {
  position:absolute;font-size:2.8rem;opacity:0;
  animation:lightningStrike 5s linear infinite;
  animation-delay:var(--del,0s);
}
#boy-bg-anim .bg-football {
  position:fixed;font-size:3.2rem;opacity:.5;
  animation:footballKick 10s linear infinite backwards;
  animation-delay:var(--del,0s);
}

/* F. Boutons plus grands et arrondis pour enfants */
#root.profile-girl .lbtn,
#root.profile-boy .lbtn {
  border-radius: 50px !important;
  padding: 16px 32px !important;
  font-size: 1.1rem !important;
}

/* G. Effet bounce sur boutons enfants */
@keyframes btnBounce {
  0%{transform:scale(1)}
  30%{transform:scale(.92)}
  60%{transform:scale(1.08)}
  80%{transform:scale(.97)}
  100%{transform:scale(1)}
}
#root.profile-girl .lbtn:active,
#root.profile-boy .lbtn:active {
  animation: btnBounce .4s ease !important;
}

/* H. Étoiles burst sur bonne réponse */
@keyframes starBurst {
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx,0px),var(--ty,0px)) scale(0);opacity:0}
}
.star-burst-el {
  position:fixed;pointer-events:none;z-index:9999;
  font-size:1.2rem;
  animation:starBurst .7s ease-out forwards;
}

/* D. Confettis sur bonne réponse */
@keyframes confettiFall {
  0%{transform:translateY(-20px) rotate(0deg) translateX(0);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg) translateX(var(--cx,0px));opacity:0}
}
.confetti-el {
  position:fixed;top:-10px;pointer-events:none;z-index:9998;
  width:10px;height:10px;border-radius:2px;
  animation:confettiFall var(--cdur,1.5s) ease-in forwards;
}

/* ══════════════════════════════════════════════
   GAMIFICATION ENFANT (girl / boy uniquement)
   ══════════════════════════════════════════════ */

/* Étoiles par leçon */
@keyframes starRewardAnim {
  0% { transform:translateX(-50%) scale(0) rotate(-10deg); opacity:0; }
  50% { transform:translateX(-50%) scale(1.3) rotate(5deg); opacity:1; }
  100% { transform:translateX(-50%) scale(1) rotate(0); opacity:1; }
}
.child-stars { font-size:.9rem; margin-top:2px; letter-spacing:1px; min-height:1rem; }

/* ============================================================
   CARTE DE PROGRESSION — ÎLES
   ============================================================ */
.sess-map-wrap{padding:16px 14px 100px;max-width:520px;margin:0 auto}
.sess-map-title{text-align:center;font-size:1.35rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#fff;padding:10px 0 28px;text-shadow:0 0 28px rgba(255,210,40,.7),0 2px 10px rgba(0,0,0,.9)}
.sess-island{background:transparent;border:none;box-shadow:none;border-radius:0;overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1),filter .2s;position:relative;margin-bottom:0;text-align:center;padding:0}
.sess-island::before{display:none}
.sess-island>*{position:relative;z-index:2}
.sess-island:hover:not(.locked-isle){transform:translateY(-8px) scale(1.07)}
.sess-island:active:not(.locked-isle){transform:scale(.95)}
.sess-island.locked-isle{cursor:default;pointer-events:none;filter:grayscale(.9) brightness(.45) opacity(.5);position:relative;z-index:6}
.sess-island.sea,.sess-island.beach,.sess-island.forest,.sess-island.desert,.sess-island.palace{background:transparent;border:none;box-shadow:none}
.sess-island.boss-isle{background:transparent;border:none;box-shadow:none;animation:bossFloat 3s ease-in-out infinite}
@keyframes bossFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.isle-img{width:100%;height:220px;display:block;margin:0 auto;object-fit:contain}
.isle-ico{display:none}
.isle-name{font-size:1.1rem;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.95);text-align:center;letter-spacing:.02em;position:absolute;bottom:0;left:0;right:0;padding:8px 8px 10px;background:none;margin:0}
.isle-sub{display:none}
.isle-badge{display:none}
.isle-dot-wrap{display:none}
.isle-dot-stars{display:none}
@keyframes isleGlow{0%,100%{box-shadow:0 0 24px rgba(245,200,66,.8),0 4px 14px rgba(0,0,0,.5)}50%{box-shadow:0 0 44px rgba(245,200,66,1),0 0 76px rgba(245,200,66,.48),0 4px 14px rgba(0,0,0,.5)}}
.isle-prog{margin-top:8px}
.isle-prog-bar{height:6px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.isle-prog-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.isle-prog-lbl{display:flex;justify-content:space-between;font-size:.63rem;color:rgba(255,255,255,.35);margin-top:4px}
.isle-connector{display:flex;align-items:center;justify-content:center;height:20px;opacity:.25;font-size:.9rem}
.isle-mg{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(124,58,237,.1));border:1.5px solid rgba(168,85,247,.35);border-radius:16px;padding:11px 14px;cursor:pointer;transition:all .2s;margin:2px 0}
.isle-mg:active{transform:scale(.97)}
.isle-mg-icon{font-size:1.5rem;flex-shrink:0}
.isle-mg-text{font-size:.8rem;font-weight:700;color:#c084fc}
.isle-mg-sub{font-size:.67rem;color:rgba(255,255,255,.4);margin-top:2px}
.isle-mg-arrow{font-size:1rem;opacity:.5;margin-left:auto}
.isle-mg.locked-mg{opacity:.35;cursor:default;filter:grayscale(1)}

/* ============================================================
   MINI-JEUX — LISTE & JEUX
   ============================================================ */
.mg-list-wrap{padding:12px 14px 80px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@media(min-width:700px){.mg-list-wrap{padding:20px 24px 80px;}}
.mg-list-title{font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.28);text-align:center;padding:6px 0 10px}
.mg-game-card{border-radius:22px;padding:18px 16px;border:1.5px solid;cursor:pointer;transition:transform .2s;display:flex;align-items:center;gap:14px}
.mg-game-card:active{transform:scale(.97)}
.mg-game-card.memory{background:linear-gradient(135deg,rgba(6,182,212,.12),rgba(14,165,233,.08));border-color:rgba(6,182,212,.3)}
.mg-game-card.puzzle{background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(21,128,61,.08));border-color:rgba(34,197,94,.3)}
.mg-game-card.match-g{background:linear-gradient(135deg,rgba(245,200,66,.12),rgba(251,146,60,.08));border-color:rgba(245,200,66,.3)}
.mg-game-card.locked{opacity:.38;filter:grayscale(.8);cursor:default}
.mg-game-icon{font-size:2.2rem;flex-shrink:0}
.mg-game-name{font-size:.93rem;font-weight:800}
.mg-game-desc{font-size:.73rem;color:rgba(255,255,255,.45);margin-top:3px}
.mg-game-best{font-size:.72rem;color:var(--gold);margin-top:4px}
/* Memory */
.mem-wrap{padding:6px 6px 4px;max-width:680px;margin:0 auto;display:flex;flex-direction:column;height:100%;box-sizing:border-box;overflow:hidden}
.mem-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;padding:0 4px;flex-shrink:0}
.mem-score{font-size:.85rem;font-weight:700;color:var(--gold)}
.mem-timer{font-size:.85rem;font-weight:700;background:rgba(255,255,255,.08);border-radius:20px;padding:4px 12px}
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1;align-content:stretch;min-height:0}
.mem-card{border-radius:13px;cursor:pointer;position:relative;perspective:600px;min-height:0}
.mem-card:active{transform:scale(.96)}
.mem-card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.4,0,.2,1);border-radius:13px}
.mem-card.flipped .mem-card-inner,.mem-card.matched .mem-card-inner{transform:rotateY(180deg)}
.mem-card-front,.mem-card-back{position:absolute;inset:0;border-radius:13px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mem-card-front{background:transparent;font-size:2rem;overflow:hidden}
.mem-card-back{transform:rotateY(180deg);font-weight:700;padding:0;text-align:center;line-height:1;font-size:1.5rem}
.mem-back-content{display:flex;flex-direction:row;align-items:center;justify-content:center;width:100%;white-space:nowrap}
.mem-ar{font-family:'Scheherazade New',serif;font-size:2.6rem;line-height:1.35;transform:translateY(-0.15em)}
.mem-sep{font-size:1rem;padding:0 3px;opacity:.8}
.mem-lat{font-size:.88rem;font-weight:800;letter-spacing:.03em;line-height:1}
.mem-card.matched .mem-card-front{opacity:.7}
.mem-card.matched .mem-card-back{opacity:.85;cursor:default}
.mem-result{text-align:center;padding:24px 16px}
/* Puzzle */
.puzzle-wrap{padding:16px 14px 80px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 62px)}
.puzzle-card{background:rgba(10,18,65,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.18);border-radius:22px;padding:22px 22px 18px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
body.profile-girl .puzzle-card{background:rgba(255,255,255,.93);border:1.5px solid rgba(233,30,140,.15);box-shadow:0 8px 32px rgba(233,30,140,.13)}
.puzzle-audio-btn{width:70px;height:70px;border-radius:50%;background:rgba(245,200,66,.15);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;margin:0 auto 14px;transition:all .2s}
.puzzle-audio-btn:active{transform:scale(.9)}

@keyframes bAnneau{to{transform:rotate(360deg)}}

@keyframes bBlink{0%,100%{opacity:1}50%{opacity:.25}}

@keyframes bFlotte1{0%{transform:translate(-30px,-22px)}25%{transform:translate(26px,-8px)}
