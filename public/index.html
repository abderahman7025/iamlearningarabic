const TX_FWD=['tx-zoom-in','tx-slide-r','tx-flip','tx-slide-up'];
const TX_BWD=['tx-zoom-out','tx-slide-l','tx-slide-down','tx-fade'];
let _txIdx=0;
function nextTx(fwd){const arr=fwd?TX_FWD:TX_BWD;const c=arr[_txIdx%arr.length];_txIdx++;return c;}
function animEl(el,cls){[...el.classList].filter(c=>c.startsWith('tx-')).forEach(c=>el.classList.remove(c));void el.offsetWidth;el.classList.add(cls);}

/* URL demandée avant la connexion (?suite=), pour y revenir ensuite. */
var _suite=null;
try{
  var _p=new URLSearchParams(window.location.search).get('suite');
  if(_p&&/^\/[A-Za-z0-9\/_-]*$/.test(_p))_suite=_p;
}catch(e){}

const _URL_ECRAN={'s-buy':'/','s-login':'/connexion','s-register':'/inscription','s-payment':'/paiement','s-reset-password':window.location.pathname};
function showS(id,fwd,noHistory){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  const el=document.getElementById(id);
  if(el){el.classList.add('on');animEl(el,nextTx(fwd!==false));}
  if(!noHistory){
    var url=_URL_ECRAN[id]||'/';
    if(_suite&&(id==='s-login'||id==='s-buy'))url+='?suite='+encodeURIComponent(_suite);
    window.history.pushState({screen:id},'',url);
  }
}
window.addEventListener('popstate',function(e){
  var path=window.location.pathname;
  var id=(e.state&&e.state.screen)||
    (path==='/connexion'?'s-login':path==='/inscription'?'s-register':path==='/paiement'?'s-payment':'s-buy');
  showS(id,false,true);
});

function buildLangDropdown(ddId){
  const dd=document.getElementById(ddId);if(!dd)return;
  dd.innerHTML='';
  LANGS.forEach(l=>{
    const d=document.createElement('div');
    d.className='lang-chip'+(l.c===st.lang?' on':'');
    d.textContent=l.l;
    d.onclick=e=>{
      e.stopPropagation();
      st.lang=l.c;
      try{localStorage.setItem('arab_lang',l.c);}catch(e){}
      dd.classList.remove('open');
      applyI18N();
    };
    dd.appendChild(d);
  });
}
function toggleLangDropdown(ddId,e){
  e.stopPropagation();
  const dd=document.getElementById(ddId);if(!dd)return;
  // close all other dropdowns
  document.querySelectorAll('.lang-dropdown').forEach(x=>{if(x.id!==ddId)x.classList.remove('open');});
  buildLangDropdown(ddId);
  dd.classList.toggle('open');
}
document.addEventListener('click',()=>{document.querySelectorAll('.lang-dropdown').forEach(x=>x.classList.remove('open'));});
function updateGlobeLabels(){
  const cur=LANGS.find(l=>l.c===st.lang);const lbl=cur?cur.l:'Français';
  const bg=document.getElementById('buy-globe-lbl');if(bg)bg.textContent=lbl;
  const lg=document.getElementById('login-globe-lbl');if(lg)lg.textContent=lbl;
  // rebuild open dropdowns
  document.querySelectorAll('.lang-dropdown.open').forEach(dd=>buildLangDropdown(dd.id));
}

let _stripe=null,_payCardElement=null;

async function initStripePayCard(){
  if(_stripe&&_payCardElement) return;
  try{
    if(!_stripe){
      const r=await fetch(`${API_URL}/api/config`);
      const d=await r.json();
      if(!d.pk) return;
      _stripe=Stripe(d.pk);
    }
    if(!_payCardElement){
      const elements=_stripe.elements();
      _payCardElement=elements.create('card',{
        style:{base:{color:'#fff',fontSize:'15px','::placeholder':{color:'rgba(255,255,255,0.45)'}},invalid:{color:'#ff6b6b'}},
        hidePostalCode:true
      });
      _payCardElement.mount('#pay-card-element');
    }
  }catch(e){console.error('Stripe init error',e);}
}

async function startCheckout(){
  const email=document.getElementById('buy-email').value.trim().toLowerCase();
  const errEl=document.getElementById('buy-err');
  const btn=document.getElementById('buy-btn');
  if(!email||!email.includes('@')){errEl.textContent='Veuillez saisir une adresse email valide.';return;}
  errEl.textContent='';
  btn.disabled=true;
  try{
    const r=await fetch(`${API_URL}/api/check-email`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json();
    if(d.exists){
      errEl.textContent='Cette adresse email a déjà un accès. Connectez-vous.';
      btn.disabled=false;
      return;
    }
  }catch(e){/* on laisse passer */}
  btn.disabled=false;
  document.getElementById('pay-email').value=email;
  showS('s-payment',true);
  await initStripePayCard();
}

// ── PWA : enregistrement du Service Worker ──
if ('serviceWorker' in navigator) {
  /* Un simple rechargement doit suffire à voir la dernière version.
     Trois verrous étaient nécessaires :
     1. updateViaCache:'none' — sinon le navigateur peut servir sw.js
        depuis son propre cache HTTP pendant des heures et ne jamais
        remarquer qu'une nouvelle version existe.
     2. reg.update() à chaque chargement — on va vérifier explicitement.
     3. rechargement automatique quand le nouveau Service Worker prend la
        main : sans lui la page affichée reste l'ancienne, et il fallait
        recharger une seconde fois (ou vider les données). */
  var _swRechargeFaite = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (_swRechargeFaite) return;      // garde-fou anti-boucle
    _swRechargeFaite = true;
    window.location.reload();
  });
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
      .then(function(reg) {
        console.log('SW enregistré:', reg.scope);
        try { reg.update(); } catch (e) {}
        /* on revérifie aussi quand l'onglet redevient visible */
        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) { try { reg.update(); } catch (e) {} }
        });
      })
      .catch(function(err) {
        console.log('SW erreur:', err);
      });
  });
}

<script>
// ══════════════════════════════════════════════
//  STARFIELD CANVAS — fond étoilé animé
// ══════════════════════════════════════════════
(function(){
  var canvas = document.getElementById('starfield');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H, stars = [], shooters = [];
  var dpr = window.devicePixelRatio || 1;

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildStars();
  }

  function rand(a, b){ return a + Math.random() * (b - a); }

  function buildStars(){
    stars = [];
    var count = Math.min(220, Math.floor(W * H / 5000));
    for(var i = 0; i < count; i++){
      stars.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(0.3, 2.2),
        base: rand(0.15, 0.9),
        speed: rand(0.4, 2.2),
        phase: rand(0, Math.PI * 2),
        color: Math.random() < 0.12 ? '#fde68a' : Math.random() < 0.08 ? '#c4b5fd' : '#ffffff'
      });
    }
  }

  function spawnShooter(){
    var sx = rand(W * 0.1, W * 0.8);
    var sy = rand(H * 0.02, H * 0.3);
    var angle = rand(20, 50) * Math.PI / 180;
    shooters.push({
      x: sx, y: sy,
      vx: Math.cos(angle) * rand(6, 14),
      vy: Math.sin(angle) * rand(3, 7),
      len: rand(60, 140),
      life: 1, decay: rand(0.012, 0.025)
    });
  }

  var t = 0;
  var nextShooter = rand(80, 200);

  function draw(){
    ctx.clearRect(0, 0, W, H);

    // ── Étoiles scintillantes ──
    for(var i = 0; i < stars.length; i++){
      var s = stars[i];
      var op = s.base * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      ctx.save();
      ctx.globalAlpha = op;
      // Halo doux pour les grandes étoiles
      if(s.r > 1.4){
        var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
        g.addColorStop(0, s.color);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ── Étoiles filantes ──
    nextShooter--;
    if(nextShooter <= 0){
      spawnShooter();
      nextShooter = rand(120, 400);
    }
    for(var j = shooters.length - 1; j >= 0; j--){
      var sh = shooters[j];
      if(sh.life <= 0){ shooters.splice(j, 1); continue; }
      ctx.save();
      ctx.globalAlpha = sh.life * 0.85;
      var grd = ctx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * sh.len / 8, sh.y - sh.vy * sh.len / 8);
      grd.addColorStop(0, '#ffffff');
      grd.addColorStop(0.4, 'rgba(245,200,66,.7)');
      grd.addColorStop(1, 'transparent');
      ctx.strokeStyle = grd;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sh.x, sh.y);
      ctx.lineTo(sh.x - sh.vx * sh.len / 8, sh.y - sh.vy * sh.len / 8);
      ctx.stroke();
      ctx.restore();
      sh.x += sh.vx;
      sh.y += sh.vy;
      sh.life -= sh.decay;
    }

    t += 0.016;
    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize', resize);
  draw();
})();

// ══════════════════════════════════════════════
//  TILT 3D MAGNÉTIQUE — cartes leçons
// ══════════════════════════════════════════════
(function(){
  var _cur = null;

  function applyTilt(card, cx, cy){
    var rect = card.getBoundingClientRect();
    var x = (cx - rect.left) / rect.width  - 0.5; // -0.5 → +0.5
    var y = (cy - rect.top)  / rect.height - 0.5;
    var rx = (-y * 14).toFixed(2);
    var ry = ( x * 14).toFixed(2);
    var sx = (-x * 12).toFixed(1);
    var sy = (-y * 10).toFixed(1);
    card.style.transform = 'perspective(700px) rotateX('+rx+'deg) rotateY('+ry+'deg) translateY(-7px) scale(1.04)';
    card.style.boxShadow = sx+'px '+sy+'px 40px rgba(0,0,0,.28), 0 20px 50px rgba(0,0,0,.18)';
    card.style.transition = 'none';
  }

  function resetTilt(card){
    card.style.transition = 'transform .4s cubic-bezier(.34,1.4,.64,1), box-shadow .4s';
    card.style.transform  = '';
    card.style.boxShadow  = '';
  }

  var TILT_SEL = '.sess-card, .prof-card, .nav-card, .pg-c';

  function findTiltTarget(el){
    return el ? el.closest(TILT_SEL) : null;
  }

  // Mouse
  document.addEventListener('mousemove', function(e){
    var card = findTiltTarget(e.target);
    if(_cur && _cur !== card){ resetTilt(_cur); _cur = null; }
    if(!card) return;
    _cur = card;
    // Intensité réduite pour les petites cartes progrès
    var intense = card.classList.contains('pg-c') ? 8 : 14;
    var rect = card.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width  - 0.5;
    var y = (e.clientY - rect.top)  / rect.height - 0.5;
    var rx = (-y * intense).toFixed(2);
    var ry = ( x * intense).toFixed(2);
    var lift = card.classList.contains('nav-card') ? '-5px' : '-7px';
    var sc   = card.classList.contains('pg-c') ? '1.05' : '1.04';
    card.style.transform = 'perspective(700px) rotateX('+rx+'deg) rotateY('+ry+'deg) translateY('+lift+') scale('+sc+')';
    card.style.boxShadow = ((-x*12).toFixed(0))+'px '+((-y*10).toFixed(0))+'px 40px rgba(0,0,0,.28), 0 20px 50px rgba(0,0,0,.18)';
    card.style.transition = 'none';
  });
  document.addEventListener('mouseleave', function(){
    if(_cur){ resetTilt(_cur); _cur = null; }
  });

  // Touch (tablet/phone)
  document.addEventListener('touchmove', function(e){
    var t = e.touches[0];
    var el = document.elementFromPoint(t.clientX, t.clientY);
    var card = findTiltTarget(el);
    if(_cur && _cur !== card){ resetTilt(_cur); _cur = null; }
    if(!card) return;
    _cur = card;
    applyTilt(card, t.clientX, t.clientY);
  }, {passive:true});
  document.addEventListener('touchend', function(){
    if(_cur){ resetTilt(_cur); _cur = null; }
  });
})();
</script>
</body>
</html>
