<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>لنتعلم العربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Tajawal:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --gold:#f5c842;--gold2:#fde68a;--gold-dim:rgba(245,200,66,.15);
  --glass:rgba(255,255,255,0.04);--glass2:rgba(255,255,255,0.08);
  --glass3:rgba(255,255,255,0.12);
  --border:rgba(255,255,255,0.08);--border2:rgba(245,200,66,0.35);
  --txt:#f0ece4;--txt2:rgba(240,236,228,0.5);--txt3:rgba(240,236,228,0.28);
  --green:#22d3a0;--red:#ff4d6d;--blue:#38bdf8;--orange:#fb923c;--vowel:#f97316;
  --r:20px;--r2:16px;
  --ff:'Outfit',sans-serif;--fa:'Scheherazade New',serif;
  --shadow-gold:0 0 40px rgba(245,200,66,.2);
  --shadow-card:0 8px 32px rgba(0,0,0,.4);
}

html,body{width:100%;height:100%;overflow:hidden;background:#04030a}

/* ── BACKGROUND ANIMÉ ── */
#root{
  position:fixed;inset:0;
  background:#04030a;
  font-family:var(--ff);color:var(--txt);
  display:flex;flex-direction:column;
  overflow:hidden;
}
#root::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 20%, rgba(120,40,200,.15) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 80%, rgba(20,80,160,.15) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(245,200,66,.03) 0%, transparent 70%);
  animation:bgPulse 8s ease-in-out infinite alternate;
}
#root::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.03) 1px, transparent 0);
  background-size:32px 32px;
}
@keyframes bgPulse{
  0%{opacity:1}
  50%{opacity:.7}
  100%{opacity:1}
}

/* ── ORBITING PARTICLES ── */
.particle{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  animation:floatParticle var(--dur,12s) ease-in-out infinite;
  opacity:var(--op,.15);
}
@keyframes floatParticle{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(var(--dx1,20px),var(--dy1,-30px)) scale(1.2)}
  66%{transform:translate(var(--dx2,-15px),var(--dy2,20px)) scale(0.8)}
}

/* ── SCREENS ── */
.scr{display:none;flex-direction:column;width:100%;height:100%;position:relative;z-index:1;overflow:hidden}
.scr.on{display:flex}

/* ── TRANSITIONS ── */
@keyframes zoomIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes zoomOut{from{opacity:0;transform:scale(1.08) translateY(-12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-50px)}to{opacity:1;transform:translateY(0)}}
@keyframes flipIn{from{opacity:0;transform:perspective(800px) rotateY(-20deg) scale(.95)}to{opacity:1;transform:perspective(800px) rotateY(0) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes morphIn{from{opacity:0;transform:scale(.85);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}

.tx-zoom-in{animation:zoomIn .4s cubic-bezier(.34,1.56,.64,1)}
.tx-zoom-out{animation:zoomOut .38s cubic-bezier(.4,0,.2,1)}
.tx-slide-r{animation:slideR .38s cubic-bezier(.34,1.2,.64,1)}
.tx-slide-l{animation:slideL .38s cubic-bezier(.34,1.2,.64,1)}
.tx-slide-up{animation:slideUp .38s cubic-bezier(.34,1.2,.64,1)}
.tx-slide-down{animation:slideDown .38s cubic-bezier(.4,0,.2,1)}
.tx-flip{animation:flipIn .42s cubic-bezier(.34,1.2,.64,1)}
.tx-fade{animation:fadeIn .3s ease}
.tx-morph{animation:morphIn .45s cubic-bezier(.34,1.2,.64,1)}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes rp{0%{box-shadow:0 0 0 0 rgba(245,200,66,.7)}100%{box-shadow:0 0 0 30px rgba(245,200,66,0)}}
@keyframes cfetti{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pring{0%{box-shadow:0 0 0 0 rgba(34,211,160,.6)}70%{box-shadow:0 0 0 16px rgba(34,211,160,0)}100%{box-shadow:0 0 0 0 rgba(34,211,160,0)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(245,200,66,.3)}50%{box-shadow:0 0 40px rgba(245,200,66,.6),0 0 80px rgba(245,200,66,.2)}}
@keyframes slideInStagger{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes borderRotate{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 100%);
  backdrop-filter:blur(4px);
  position:relative;z-index:10;
}
.tb-title{
  font-size:.95rem;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.5px;
}
.tb-back{
  display:flex;align-items:center;gap:6px;font-size:.82rem;color:#1a1a1a;
  cursor:pointer;padding:8px 14px;border-radius:50px;
  background:var(--glass2);border:1px solid var(--border);
  backdrop-filter:blur(16px);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.tb-back::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(245,200,66,.1),transparent);
  opacity:0;transition:opacity .25s;
}
.tb-back:active{transform:scale(.94);}
.tb-back:active::before{opacity:1;}

.sound-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--green);cursor:pointer;
  transition:all .3s;
  box-shadow:0 0 8px rgba(34,211,160,.6);
  animation:pulse 2s ease-in-out infinite;
}
.sound-dot.off{background:var(--txt3);box-shadow:none;animation:none;}

/* ── SCROLLABLE CONTENT ── */
.ca{
  flex:1;overflow-y:auto;padding:14px 18px 100px;
  scrollbar-width:thin;scrollbar-color:rgba(245,200,66,.3) transparent;
}
.ca::-webkit-scrollbar{width:3px}
.ca::-webkit-scrollbar-thumb{background:rgba(245,200,66,.3);border-radius:2px}

/* ── CARD BASE ── */
.card{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r);backdrop-filter:blur(20px);
  box-shadow:var(--shadow-card);
  transition:all .3s cubic-bezier(.34,1.2,.64,1);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 50%);
  pointer-events:none;
}

/* ── LOGIN / BUY ── */
#s-login{align-items:center;justify-content:center}
#s-buy{align-items:center;justify-content:center}
#s-register{align-items:center;justify-content:center}

.login-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.login-moon{
  position:absolute;top:6%;left:6%;font-size:4.5rem;
  opacity:.5;animation:float 6s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(245,200,66,.4));
}
.login-stars{
  position:absolute;top:5%;right:8%;font-size:1rem;
  opacity:.5;letter-spacing:16px;animation:pulse 3s ease-in-out infinite;
}
.mosque-svg{position:absolute;bottom:0;left:0;right:0;opacity:.06}

.login-box{
  position:relative;z-index:2;width:min(360px,92vw);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;padding:36px 28px;
  backdrop-filter:blur(32px);
  box-shadow:0 32px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  animation:morphIn .5s cubic-bezier(.34,1.2,.64,1);
}
.login-ar{
  font-family:'Tajawal',sans-serif;font-size:1.9rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;line-height:1.5;margin-bottom:24px;
  filter:drop-shadow(0 0 20px rgba(245,200,66,.3));
}

.linp{
  width:100%;padding:14px 18px;border-radius:14px;margin-bottom:12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  color:var(--txt);font-family:var(--ff);font-size:.9rem;outline:none;
  transition:all .25s;
  backdrop-filter:blur(8px);
}
.linp::placeholder{color:var(--txt3)}
.linp:focus{
  border-color:rgba(245,200,66,.5);
  background:rgba(255,255,255,.08);
  box-shadow:0 0 0 3px rgba(245,200,66,.1),0 4px 20px rgba(0,0,0,.3);
}

.lbtn{
  width:100%;padding:15px;border-radius:50px;border:none;margin-top:8px;
  background:linear-gradient(135deg,var(--gold) 0%,#e8a020 50%,var(--gold) 100%);
  background-size:200% auto;
  color:#0a0718;font-family:var(--ff);font-size:.95rem;font-weight:800;
  cursor:pointer;letter-spacing:.5px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 30px rgba(245,200,66,.35);
  animation:shimmer 3s linear infinite;
}
.lbtn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(245,200,66,.5);}
.lbtn:active{transform:scale(.96);}
.lbtn:disabled{opacity:.5;animation:none;}

.lerr{color:#ff6b6b;font-size:.74rem;text-align:center;margin-top:8px;min-height:18px}

/* ── GLOBE LANG ── */
.lang-globe-wrap{position:relative;display:inline-flex;justify-content:center;margin-top:16px}
.lang-globe-btn{
  display:flex;align-items:center;gap:8px;padding:9px 18px;
  border-radius:50px;border:1px solid var(--border2);
  background:var(--gold-dim);color:var(--gold);
  font-family:var(--ff);font-size:.83rem;font-weight:700;
  cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(12px);
  box-shadow:0 4px 16px rgba(245,200,66,.15);
}
.lang-globe-btn:active{transform:scale(.94)}
.lang-globe-btn .globe-icon{font-size:1.1rem}
.lang-dropdown{
  position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);
  background:rgba(8,6,20,.95);border:1px solid var(--border2);
  border-radius:20px;padding:12px;display:none;flex-wrap:wrap;
  gap:8px;justify-content:center;z-index:200;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  min-width:280px;max-width:340px;backdrop-filter:blur(24px);
}
.lang-dropdown.open{display:flex;animation:slideUp .25s cubic-bezier(.34,1.56,.64,1)}
.lang-chip{
  padding:7px 14px;border-radius:50px;font-size:.75rem;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,.18);color:var(--txt2);
  background:rgba(10,7,24,.75);transition:all .2s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;
}
.lang-chip:active{transform:scale(.94)}
.lang-chip.on{background:var(--gold-dim);color:var(--gold);border-color:var(--border2);box-shadow:0 0 12px rgba(245,200,66,.2);}

/* ── WELCOME ── */
#s-welcome{align-items:center;justify-content:center;gap:0;padding:30px 24px}
.w-ar{
  font-family:'Tajawal',sans-serif;font-size:2.6rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2),#fff8dc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;line-height:1.4;margin-bottom:10px;
  filter:drop-shadow(0 0 30px rgba(245,200,66,.4));
  animation:float 5s ease-in-out infinite;
}
.w-sub{font-size:.9rem;color:var(--txt2);margin-bottom:32px;text-align:center}
.prof-cards{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px}

.prof-card{
  display:flex;align-items:center;gap:18px;padding:20px 22px;
  border-radius:22px;cursor:pointer;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(10,7,24,.75);
  backdrop-filter:blur(20px);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-card);
}
.prof-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
  opacity:0;transition:opacity .3s;
}
.prof-card:hover{transform:translateX(8px) scale(1.02);box-shadow:0 16px 48px rgba(0,0,0,.5);}
.prof-card:hover::after{opacity:1;}
.prof-card:active{transform:scale(.97);}
.prof-card.girl:hover{border-color:rgba(255,100,200,.4);box-shadow:0 16px 48px rgba(255,100,200,.2);}
.prof-card.boy:hover{border-color:rgba(56,189,248,.4);box-shadow:0 16px 48px rgba(56,189,248,.2);}
.prof-card.adult:hover{border-color:rgba(245,200,66,.4);box-shadow:var(--shadow-gold);}

.prof-card:nth-child(1){animation:slideInStagger .4s .1s both cubic-bezier(.34,1.56,.64,1)}
.prof-card:nth-child(2){animation:slideInStagger .4s .2s both cubic-bezier(.34,1.56,.64,1)}
.prof-card:nth-child(3){animation:slideInStagger .4s .3s both cubic-bezier(.34,1.56,.64,1)}

.prof-emoji{font-size:2.2rem;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
.prof-info{flex:1}
.prof-name{font-size:1.05rem;font-weight:700;margin-bottom:3px}
.prof-desc{font-size:.77rem;color:var(--txt2)}
.prof-arrow{
  color:var(--txt3);font-size:1.1rem;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .3s;
}
.prof-card:hover .prof-arrow{transform:translateX(6px);color:var(--gold);}

/* ── MENU ── */
#s-menu{padding:0;overflow-y:auto}
.menu-header{
  padding:24px 20px 16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(4,3,10,.95) 0%,transparent 100%);
  backdrop-filter:blur(12px);position:sticky;top:0;z-index:10;
}
.menu-logo-ar{
  font-family:'Tajawal',sans-serif;font-size:1.5rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 12px rgba(245,200,66,.4));
}
.menu-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#b8860b);
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:800;color:#0a0718;
  box-shadow:0 4px 16px rgba(245,200,66,.4);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.menu-avatar:active{transform:scale(.9);}

.menu-nav{display:flex;flex-direction:column;gap:14px;padding:8px 18px 24px}

.nav-card{
  display:flex;align-items:center;gap:16px;padding:20px 22px;
  border-radius:22px;cursor:pointer;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(10,7,24,.65);
  backdrop-filter:blur(20px);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.35);
}
.nav-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:3px 0 0 3px;
  background:linear-gradient(180deg,var(--gold),transparent);
  opacity:0;transition:opacity .3s;
  box-shadow:0 0 12px rgba(245,200,66,.5);
}
.nav-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,transparent 60%);
  opacity:0;transition:opacity .3s;
}
.nav-card:hover{transform:translateX(8px);border-color:rgba(255,255,255,.15);}
.nav-card:hover::before,.nav-card:hover::after{opacity:1;}
.nav-card:active{transform:scale(.98);}

.nav-card:nth-child(1){animation:slideInStagger .4s .05s both cubic-bezier(.34,1.56,.64,1)}
.nav-card:nth-child(2){animation:slideInStagger .4s .12s both cubic-bezier(.34,1.56,.64,1)}
.nav-card:nth-child(3){animation:slideInStagger .4s .19s both cubic-bezier(.34,1.56,.64,1)}
.nav-card:nth-child(4){animation:slideInStagger .4s .26s both cubic-bezier(.34,1.56,.64,1)}

.nav-icon{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.nav-card:hover .nav-icon{transform:scale(1.15) rotate(-5deg);}
.nav-icon.gold{background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.2);}
.nav-icon.pink{background:rgba(255,100,200,.1);border:1px solid rgba(255,100,200,.18);}
.nav-icon.blue{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.18);}
.nav-icon.green{background:rgba(34,211,160,.1);border:1px solid rgba(34,211,160,.18);}

.nav-text{flex:1}
.nav-title{font-size:1.15rem;font-weight:700;margin-bottom:3px}
.nav-desc{font-size:.75rem;color:var(--txt2)}
.nav-arrow{color:var(--txt3);font-size:.9rem;transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .3s}
.nav-card:hover .nav-arrow{transform:translateX(6px);color:var(--gold);}

.menu-bottom{
  margin:0 18px 24px;padding:16px 20px;border-radius:20px;
  background:rgba(10,7,24,.65);border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 24px rgba(0,0,0,.35);
}
.mb-score{font-size:.82rem;color:var(--txt2)}
.mb-score span{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-weight:800;font-size:1.1rem;
}
.mb-actions{display:flex;gap:10px}
.mb-btn{
  padding:8px 16px;border-radius:50px;font-size:.75rem;font-weight:600;
  cursor:pointer;border:1px solid rgba(255,255,255,.18);color:var(--txt2);
  background:rgba(10,7,24,.75);backdrop-filter:blur(8px);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.mb-btn:active{transform:scale(.93);}

/* ── CONTENT SECTIONS ── */
.p-section{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r);padding:18px 20px;margin-bottom:14px;
  backdrop-filter:blur(20px);box-shadow:var(--shadow-card);
  transition:all .3s;position:relative;overflow:hidden;
}
.p-section::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 50%);
  pointer-events:none;
}
.p-section:hover{border-color:rgba(245,200,66,.2);}
.p-sec-title{
  font-size:.95rem;font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:10px;
}
.p-sec-body{font-size:.84rem;color:var(--txt2);line-height:1.85}

.dua-box{
  background:linear-gradient(135deg,rgba(245,200,66,.1) 0%,rgba(245,200,66,.03) 100%);
  border:1px solid rgba(245,200,66,.25);
  border-radius:var(--r);padding:22px;text-align:center;margin-bottom:16px;
  backdrop-filter:blur(20px);
  box-shadow:0 8px 32px rgba(245,200,66,.1),inset 0 1px 0 rgba(245,200,66,.1);

}
.dua-box::before{

}

}

.info-box{

}

/* ── SESSIONS ── */
.sess-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sess-card{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);

  backdrop-filter:blur(20px);box-shadow:var(--shadow-card);
}
.sess-card::before{

}
.sess-badge{display:inline-block;font-size:.56rem;padding:3px 8px;border-radius:50px;font-weight:700;margin-top:6px}
.bd-o{background:rgba(251,146,60,.12);color:var(--orange);border:1px solid rgba(251,146,60,.25);}
.bd-b{background:rgba(56,189,248,.1);color:var(--blue);border:1px solid rgba(56,189,248,.22);}

/* ── LESSON ── */
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;direction:rtl}
.ltab{

.lc-layout{display:flex;flex-direction:column;gap:14px}
.pos-row-wrap{display:flex;gap:12px;direction:rtl;flex-wrap:wrap}
.pos-c{

.badge-row{display:flex;gap:8px;flex-wrap:wrap}
.bd-big{font-size:.74rem;padding:5px 14px;border-radius:50px;font-weight:700}

.fab{
  display:flex;justify-content:center;margin-top:20px;margin-bottom:4px;
  background:linear-gradient(135deg,var(--gold) 0%,#e8a020 50%,var(--gold) 100%);

/* ── ORBITAL ── */
.orb-wrap{position:relative;width:270px;height:270px;margin:12px auto}
.orb-ctr{

  font-family:var(--fa);font-size:2.1rem;color:#0a0718;
  cursor:pointer;z-index:5;

  animation:glow 3s ease-in-out infinite;
}
.orb-ctr:active{transform:translate(-50%,-50%) scale(.88);}
.orb-ctr.rpl{animation:rp .5s ease}

/* Ring autour de l'orb-ctr */
.orb-wrap::before{
  content:'';position:absolute;top:50%;left:50%;

}

.orb-sat{

  cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);gap:2px;
  backdrop-filter:blur(12px);
}
.orb-sat:active{transform:scale(.82)!important}
.orb-sat:hover{border-color:rgba(245,200,66,.4);background:rgba(245,200,66,.08);}
.orb-sat.lit{
  background:rgba(245,200,66,.15);border-color:rgba(245,200,66,.5);
  box-shadow:0 0 16px rgba(245,200,66,.3);
}
.orb-sat.lit .orb-ar,.orb-sat.lit .orb-lat{color:var(--gold)}
.orb-ar{font-family:var(--fa);font-size:.95rem;color:var(--vowel);line-height:1}
.orb-lat{font-size:.44rem;color:var(--txt2)}

/* ── VOWEL ── */
.vline-section{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r2);padding:16px 10px;
  backdrop-filter:blur(16px);
}
.wline{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:2px}
.wline-lbl{font-size:.68rem;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0}

/* ── QUIZ ── */
.qz-layout{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.qz-q{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:22px;padding:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;flex:1;min-height:0;
  backdrop-filter:blur(20px);box-shadow:var(--shadow-card);
  position:relative;overflow:visible;
}
.qz-q::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(245,200,66,.06) 0%,transparent 70%);
  pointer-events:none;
}
.qz-a{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.qz-a-row{display:flex;gap:10px}.qz-a-row .ans-btn{flex:1}
.qz-a-center{display:flex;justify-content:center}.qz-a-center .ans-btn{width:60%;min-width:180px}

.q-lbl{font-size:.8rem;color:var(--txt2);margin-bottom:10px}
.q-big{
  font-family:var(--fa);font-size:clamp(1.3rem,5.5vw,2.8rem);
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.6;cursor:pointer;word-break:break-word;direction:rtl;
  padding:4px 8px;overflow:visible;
  filter:drop-shadow(0 4px 12px rgba(245,200,66,.3));
}
.q-big.noclick{cursor:default;pointer-events:none}
.q-big-vow{
  font-family:var(--fa);font-size:3.5rem;color:var(--vowel);line-height:1;cursor:pointer;
  filter:drop-shadow(0 4px 12px rgba(249,115,22,.3));
}
.q-big-vow.noclick{cursor:default;pointer-events:none}
.q-lbtn{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:50px;padding:8px 18px;color:var(--txt);cursor:pointer;
  font-size:.77rem;display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(12px);
}
.q-lbtn:active{transform:scale(.94);}

.ans-btn{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:14px;cursor:pointer;
  font-weight:600;font-size:.87rem;color:var(--txt);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);text-align:center;
  backdrop-filter:blur(16px);position:relative;overflow:hidden;
}
.ans-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
  opacity:0;transition:opacity .2s;
}
.ans-btn:hover{border-color:rgba(255,255,255,.2);transform:translateY(-2px);}
.ans-btn:hover::before{opacity:1;}
.ans-btn.ar-ans{font-family:var(--fa);font-size:1.6rem}
.ans-btn:active{transform:scale(.95);}
.ans-btn.correct{
  background:rgba(34,211,160,.15);border-color:var(--green);color:#7fffd4;
  animation:pring .5s ease;box-shadow:0 0 20px rgba(34,211,160,.3);
}
.ans-btn.wrong{
  background:rgba(255,77,109,.12);border-color:var(--red);color:#ffb3c0;
  animation:shake .4s ease;
}
.ans-btn.reveal{border-color:var(--green);opacity:.5}

.rf{
  padding:8px 14px;border-radius:12px;font-weight:700;font-size:.82rem;
  display:none;text-align:center;margin-top:8px;
}
.rf.on{display:block}
.rf.ok{background:rgba(34,211,160,.15);border:1px solid var(--green);color:#7fffd4}
.rf.bad{background:rgba(255,77,109,.12);border:1px solid var(--red);color:#ffb3c0}

.qz-prog{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-shrink:0}
.qpb{
  flex:1;height:5px;background:rgba(255,255,255,.06);
  border-radius:3px;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
}
.qpf{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));
  background-size:200% auto;
  transition:width .5s cubic-bezier(.34,1.2,.64,1);
  border-radius:3px;
  box-shadow:0 0 8px rgba(245,200,66,.5);
  animation:shimmer 2s linear infinite;
}
.qs-lbl{font-size:.75rem;color:var(--gold);font-weight:700;white-space:nowrap}

.res-w{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center}
.res-c{
  width:110px;height:110px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:2rem;font-weight:800;
  animation:zoomIn .5s cubic-bezier(.34,1.56,.64,1);
}
.rc-p{
  background:radial-gradient(circle,#22d3a0,#0a7f5c);
  box-shadow:0 0 40px rgba(34,211,160,.6),0 0 80px rgba(34,211,160,.2);
}
.rc-f{
  background:radial-gradient(circle,#ff4d6d,#cc0033);
  box-shadow:0 0 40px rgba(255,77,109,.5),0 0 80px rgba(255,77,109,.2);
}
.res-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rbtn{
  padding:12px 24px;border-radius:50px;border:none;
  font-family:var(--ff);font-size:.86rem;font-weight:700;
  cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);
}
.rbtn-m{
  background:linear-gradient(135deg,var(--gold),#e8a020);
  color:#0a0718;box-shadow:0 8px 24px rgba(245,200,66,.4);
}
.rbtn-m:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(245,200,66,.5);}
.rbtn-s{background:rgba(10,7,24,.75);color:var(--txt);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);}
.rbtn-s:hover{border-color:rgba(255,255,255,.2);}
.rbtn:active{transform:scale(.95);}

/* ── PROGRESS ── */
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg-c{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:12px 14px;
  backdrop-filter:blur(16px);transition:all .25s;
}
.pg-c:hover{border-color:rgba(245,200,66,.2);}
.pg-n{font-size:.73rem;font-weight:700;margin-bottom:6px}
.pg-bw{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.pg-bf{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width .8s cubic-bezier(.34,1.2,.64,1);
  border-radius:3px;box-shadow:0 0 6px rgba(245,200,66,.4);
}
.pg-p{font-size:.67rem;color:var(--gold);margin-top:4px;font-weight:700}
.pg-ov{
  grid-column:span 2;
  background:linear-gradient(135deg,var(--gold),#c87a00);
  border-radius:16px;padding:14px;text-align:center;
  color:#0a0718;font-weight:800;font-size:.95rem;
  box-shadow:var(--shadow-gold);
  animation:glow 3s ease-in-out infinite;
}

/* ── SETTINGS ── */
.set-row{
  background:rgba(10,7,24,.75);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;font-size:.84rem;
  backdrop-filter:blur(16px);
  transition:all .25s;
}
.set-row:hover{border-color:rgba(255,255,255,.14);}
.tog{
  width:42px;height:22px;background:rgba(255,255,255,.1);
  border-radius:11px;position:relative;cursor:pointer;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.tog.on{background:var(--gold);box-shadow:0 0 12px rgba(245,200,66,.4);}
.tog::after{
  content:'';position:absolute;width:16px;height:16px;border-radius:50%;
  background:white;top:3px;left:3px;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.tog.on::after{transform:translateX(20px)}

/* ── CONTACT ── */
.cform-input{
  width:100%;padding:14px 16px;border-radius:14px;margin-bottom:12px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  color:var(--txt);font-family:var(--ff);font-size:.86rem;outline:none;
  transition:all .25s;resize:vertical;backdrop-filter:blur(8px);
}
.cform-input::placeholder{color:var(--txt3)}
.cform-input:focus{border-color:rgba(245,200,66,.4);background:rgba(255,255,255,.07);box-shadow:0 0 0 3px rgba(245,200,66,.08);}
.cform-btn{
  width:100%;padding:14px;border-radius:50px;border:none;
  background:linear-gradient(135deg,var(--gold),#e8a020);
  color:#0a0718;font-family:var(--ff);font-size:.9rem;font-weight:800;
  cursor:pointer;transition:all .35s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 30px rgba(245,200,66,.35);
}
.cform-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(245,200,66,.5);}
.cform-btn:disabled{opacity:.5;cursor:not-allowed;}
.cform-btn:active{transform:scale(.97);}
.cform-success{
  background:rgba(34,211,160,.1);border:1px solid rgba(34,211,160,.3);
  border-radius:16px;padding:22px 18px;text-align:center;
  color:#7fffd4;font-size:.9rem;line-height:2;
}

@media(max-width:420px){
  .pg-grid{grid-template-columns:1fr}
  .pos-row-wrap{justify-content:center}
}


/* ── BOY MASCOT THUMBNAIL ── */
#boy-mascot{
  position:fixed;bottom:16px;left:16px;
  width:90px;height:90px;border-radius:0;
  overflow:visible;z-index:50;
  box-shadow:none;border:none;
  display:none;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer;
}
#boy-mascot:hover{transform:scale(1.15);}
#boy-mascot img{width:100%;height:100%;object-fit:contain;}

/* ── GIRL MASCOT THUMBNAIL ── */
#girl-mascot{
  position:fixed;bottom:16px;left:16px;
  width:90px;height:90px;border-radius:0;
  overflow:visible;z-index:50;
  box-shadow:none;
  border:none;
  display:none;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer;

as Verständnis schenkt, und denke vor allem daran, dass das Ziel nicht das Endergebnis ist (Arabisch zu lernen), sondern Allah zu gefallen (indem man sich für das Gute einsetzt).\n\nZögere nicht, uns über den Menüpunkt „Kontakt" zu kontaktieren, wenn du einen Wunsch hast.',err_fields:'Bitte alle Pflichtfelder ausfüllen.',err_pwd_match:'Passwörter stimmen nicht überein.',err_pwd_len:'Passwort muss mindestens 6 Zeichen haben.',err_connection:'Verbindungsfehler.',correct_lbl:'Richtig!',with_alif:'Mit ا',with_waw:'Mit و',with_ya:'Mit ى'},

oel niet het eindresultaat is (Arabisch leren), maar Allah behagen (door inspanningen voor het goede te leveren).\n\nAarzel niet om contact met ons op te nemen via de sectie "contact" in het hoofdmenu als je een verzoek hebt.',err_fields:'Vul alle verplichte velden in.',err_pwd_match:'Wachtwoorden komen niet overeen.',err_pwd_len:'Wachtwoord moet minimaal 6 tekens hebben.',err_connection:'Verbindingsfout.',correct_lbl:'Correct!',with_alif:'Met ا',with_waw:'Met و',with_ya:'Met ى'},

sbloccata.',fail:'Continua a ripassare. Servono 80% per proseguire.',global_score:'Punteggio globale',sound_on:'Audio attivo',reset:'🗑 Reimposta',intro_dua:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيم',intro_dua2:'رَبِّ زِدْنِي عِلْمًا',intro_dua_tr:'In nome di Allah, il Compassionevole.',intro_dua_tr2:'Signore, aumenta la mia conoscenza.',intro_s1_title:'L\'importanza dell\'intenzione (an-niyyah)',intro_s1:'L\'intenzione è una delle due condizioni essenziali affinché Allah ﷻ accetti un\'azione. Inoltre, due persone possono compiere esattamente la stessa azione, ma ricevere ricompense molto diverse, perché le loro intenzioni iniziali non erano le stesse.\n\nIl Profeta Muhammad ﷺ disse: "Le azioni valgono solo per le intenzioni, e ognuno sarà ricompensato in base alla propria intenzione."',intro_s2_title:'I frutti della ricerca della conoscenza',intro_s2:'La conoscenza è un dovere per ogni credente. In effetti, Allah non accetta l\'adorazione compiuta nell\'ignoranza.\n\nAllah ﷻ dice: "E sappi che non vi è altra divinità degna di essere adorata tranne Allah, e chiedi perdono per il tuo peccato e per i credenti e le credenti."\n\nInoltre, chi cerca la conoscenza beneficia di ricompense inestimabili.\n\nIl Profeta ﷺ disse: "Chi percorre una via per cercare la conoscenza, Allah gli facilita per questo una via verso il Paradiso. Gli angeli abbassano le loro ali per soddisfazione verso chi cerca la conoscenza. Certamente tutti coloro che sono nei cieli e sulla terra, anche i pesci nell\'acqua, chiedono perdono per il sapiente."',intro_s3_title:'Allah è l\'unico scopo del credente',intro_s3:'Allah ha creato gli esseri umani con diverse capacità di comprensione e memorizzazione.\n\nPer questo motivo, Allah ti interroga di più sugli sforzi fatti per imparare, piuttosto che sul risultato che non dipende sempre da te.\n\nQuindi, se incontri difficoltà, non abbatterti, riponi la tua fiducia in Allah, ricorda che è Lui a dare la comprensione, e ricorda soprattutto che lo scopo non è il risultato finale (imparare l\'arabo), ma piuttosto compiacere Allah (facendo sforzi per il bene).\n\nNon esitare a contattarci, tramite la sezione "contatto" del menu principale, se hai qualsiasi richiesta.',err_fields:'Compila tutti i campi obbligatori.',err_pwd_match:'Le password non corrispondono.',err_pwd_len:'La password deve avere almeno 6 caratteri.',err_connection:'Errore di connessione.',correct_lbl:'Corretto!',with_alif:'Con ا',with_waw:'Con و',with_ya:'Con ى'},

فَخَّمَة',vowels_name:'Гласные · الحَرَكَات',vowel_intro:'Гласная — маленький символ над или под буквой.',vowel_tip:'💡 При удвоении гласной добавляется "н".',prolong_name:'Продления · الْمُدُود',prolong_note:'* Буква ب (б) используется для примеров.',prolong_tip:'💡 Подсказка: гласная ُ продлевается буквой و, которая на неё похожа.\nГласная َ, которая пишется над буквой, продлевается буквой ا, расположенной над строкой.\nГласная ِ, расположенная под строкой, продлевается буквой ي.',buy_desc:'Учитесь читать арабский язык шаг за шагом.',buy_access_lbl:'Исключительная цена',buy_payment_lbl:'Полный курс · Пожизненный доступ',buy_price_old:'149,99 €',buy_price_new:'74,99 €',buy_features:'✓ Пожизненный доступ\n✓ 12 подробных уроков\n✓ Упражнения & Викторина — 200 вопросов\n✓ Поддержка 24/7\n✓ 13 языков доступно\n✓ Обновления включены',completion_title:'🎉 Поздравляем!',completion_msg:'Вы прошли 100% курса! Теперь вы владеете арабским алфавитом. Чтобы закрепить знания, проверьте себя с помощью полной викторины из 200 вопросов.',completion_btn:'Начать викторину из 200 вопросов ▶',completion_dismiss:'Закрыть',letter_tip_master:'Освоить изолированную и начальную форму обязательно.',letter_tip2:'В середине слова: как начальная форма + горизонтальная черта.',letter_tip3:'В конце слова: как изолированная форма + горизонтальная черта.',letter_tip4:'<em>Примечание: только ع и غ не следуют этим правилам.</em>',letter_tip5a:'<em>Средняя = Начальная + "—"</em>',letter_tip5b:'<em>Конечная = Изолированная + "—"</em>',ta_marbuta1:'Эта буква ВСЕГДА стоит в конце слова.',ta_marbuta2:'После одной из несоединяющихся букв → изолированная форма.',ta_marbuta3:'В остальных случаях → конечная форма.',hamza1:'Независимо от буквы, произносится ТОЛЬКО гласная.',hamza2:'Если ء стоит на ي, пишется без 2 точек.',q_read:'Как читается',q_write:'Как пишется звук',pass:'🎉 Отлично! Следующий урок открыт.',fail:'Продолжай учиться. Нужно 80% для продолжения.',global_score:'Общий счёт',sound_on:'Звук включён',reset:'🗑 Сбросить',intro_dua:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيم',intro_dua2:'رَبِّ زِدْنِي عِلْمًا',intro_dua_tr:'Во имя Аллаха, Милостивого.',intro_dua_tr2:'Господь мой, прибавь мне знания.',intro_s1_title:'Важность намерения (ан-ниййа)',intro_s1:'Намерение является одним из двух основных условий для того, чтобы Аллах ﷻ принял действие. Кроме того, два человека могут совершить абсолютно одинаковое действие, но получить совершенно разные награды, поскольку их первоначальные намерения были различны.\n\nПророк Мухаммад ﷺ сказал: "Поистине, дела оцениваются только по намерениям, и каждый человек получит лишь то, что он намеревался получить."',intro_s2_title:'Плоды поиска знаний',intro_s2:'Знание является обязанностью каждого верующего. Поистине, Аллах не принимает поклонение, совершённое по невежеству.\n\nАллах ﷻ говорит: "Знай же, что нет никакого божества, кроме Аллаха, и проси прощения за свой грех и за верующих мужчин и женщин."\n\nКроме того, тот, кто ищет знания, получает бесценные награды.\n\nПророк ﷺ сказал: "Кто встал на путь в поисках знания, тому Аллах облегчает путь в Рай. Поистине, ангелы складывают свои крылья в знак довольства ищущим знание. Поистине, за учёного просят прощения все, кто находится на небесах и на земле, даже рыбы в воде."',intro_s3_title:'Аллах — единственная цель верующего',intro_s3:'Аллах создал людей с различными способностями к пониманию и запоминанию.\n\nВот почему Аллах спрашивает тебя больше об усилиях, приложенных для обучения, чем о результате, который не всегда зависит от тебя.\n\nПоэтому, если ты столкнёшься с трудностями, не опускай руки, уповай на Аллаха, помни, что именно Он даёт понимание, и прежде всего помни, что цель — это не конечный результат (изучение арабского), а снискать довольство Аллаха (прилагая усилия во благо).\n\nНе стесняйся обращаться к нам через раздел "контакт" главного меню, если у тебя есть какие-либо пожелания.',err_fields:'Заполните все обязательные поля.',err_pwd_match:'Пароли не совпадают.',err_p res qualquer pedido.',err_fields:'Por favor, preencha os campos obrigatórios.',err_pwd_match:'As senhas não correspondem.',err_pwd_len:'A senha deve ter pelo menos 6 caracteres.',err_connection:'Erro de ligação.',correct_lbl:'Correto!',with_alif:'Com ا',with_waw:'Com و',with_ya:'Com ى'},

function nextTx(fwd){const arr=fwd?TX_FWD:TX_BWD;const c=arr[_txIdx%arr.length];_txIdx++;return c;}
function animEl(el,cls){[...el.classList].filter(c=>c.startsWith('tx-')).forEach(c=>el.classList.remove(c));void el.offsetWidth;el.classList.add(cls);}

function speak(txt,rate){rate=rate||0.82;if(!st.soundOn||!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='ar-SA';u.rate=rate;u.pitch=1.05;const vs=window.speechSynthesis.getVoices();const v=vs.find(x=>x.lang==='ar-SA')||vs.find(x=>x.lang==='ar-EG')||vs.find(x=>x.lang.startsWith('ar'));if(v)u.voice=v;window.speechSynthesis.speak(u);}

// LANG GLOBE DROPDOWN
function buildLangDropdown(ddId){
  const dd=document.getElementById(ddId);if(!dd)return;
  dd.innerHTML='';
  LANGS.forEach(l=>{
    const d=document.createElement('div');
    d.className='lang-chip'+(l.c===st.lang?' on':'');
    d.textContent=l.l;
    d.onclick=e=>{
      e.stopPropagation();
      st.lang=l.c;
      dd.classList.remove('open');
      applyI18N();
    };
    dd.appendChild(d);
  });
}
function toggleLangDropdown(ddId,e){
  e.stopPropagation();
  const dd=document.getElementById(ddId);if(!dd)return;
  // close all other dropdowns
  document.querySelectorAll('.lang-dropdown').forEach(x=>{if(x.id!==ddId)x.classList.remove('open');});
  buildLangDropdown(ddId);
  dd.classList.toggle('open');
}
document.addEventListener('click',()=>{document.querySelectorAll('.lang-dropdown').forEach(x=>x.classList.remove('open'));});
function updateGlobeLabels(){
  const cur=LANGS.find(l=>l.c===st.lang);const lbl=cur?cur.l:'Français';
  const bg=document.getElementById('buy-globe-lbl');if(bg)bg.textContent=lbl;
  const lg=document.getElementById('login-globe-lbl');if(lg)lg.textContent=lbl;
  // rebuild open dropdowns
  document.querySelectorAll('.lang-dropdown.open').forEach(dd=>buildLangDropdown(dd.id));
}

// AUTH
async function startCheckout(){
  const email=document.getElementById('buy-email').value.trim().toLowerCase();
  const errEl=document.getElementById('buy-err');const btn=document.getElementById('buy-btn');
  if(!email||!email.includes('@')){errEl.textContent=t('err_fields');return;}
  btn.disabled=true;btn.textContent=t('redirecting');errEl.textContent='';
  try{
    const res=await fetch(`${API_URL}/api/create-checkout`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const data=await res.json();
    if(data.url){window.location.href=data.url;}
    else{errEl.textContent=data.error||t('err_connection');btn.disabled=false;btn.textContent=t('buy_btn');}
  }catch(e){errEl.textContent=t('err_connection');btn.disabled=false;btn.textContent=t('buy_btn');}
}
async function doRegister(){
  const email=document.getElementById('reg-email').value.trim().toLowerCase();
  const pwd=document.getElementById('reg-pwd').value;
  const pwd2=document.getElementById('reg-pwd2').value;
  const errEl=document.getElementById('reg-err');const btn=document.getElementById('reg-btn');
  if(pwd!==pwd2){errEl.textContent=t('err_pwd_match');return;}
  if(pwd.length<6){errEl.textContent=t('err_pwd_len');return;}
  btn.disabled=true;btn.textContent=t('creating');errEl.textContent='';
  try{
    const res=await fetch(`${API_URL}/api/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
    const data=await res.json();
    if(data.success){document.getElementById('l-email').value=email;showS('s-login',true);}
    else{errEl.textContent=data.error||t('err_connection');btn.disabled=false;btn.textContent=t('create_account');}
  }catch(e){errEl.textContent=t('err_connection');btn.disabled=false;btn.textContent=t('create_account');}
}
function getDeviceId(){
  var d=localStorage.getItem('arab_device');
  if(!d){d='dev_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('arab_device',d);}
  return d;
}

  var msgEl=document.getElementById('forgot-msg');
  var btn=document.getElementById('forgot-send-btn');
  if(!em||!em.includes('@')){msgEl.style.color='#ff6b6b';msgEl.textContent='Email invalide.';return;}
  msgEl.style.color='rgba(255,255,255,.5)';msgEl.textContent=t('forgot_sending');
  btn.disabled=true;
  try{
    var res=await fetch(API_URL+'/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})});
    var data=await res.json();
    if(data.success){
      msgEl.style.color='var(--green)';msgEl.textContent=t('forgot_ok');
      btn.textContent='Envoyé !';
      setTimeout(function(){var m=document.getElementById('forgotmodal');if(m)m.remove();},3000);
    }else{msgEl.style.color='#ff6b6b';msgEl.textContent=t('reset_err');btn.disabled=false;}
  }catch(e){msgEl.style.color='#ff6b6b';msgEl.textContent='Erreur de connexion.';btn.disabled=false;}
}
async function doResetPassword(){
  var p1=document.getElementById('reset-pwd-input').value;
  var p2=document.getElementById('reset-pwd-confirm').value;
  var errEl=document.getElementById('reset-err');
  if(!p1||p1.length<6){errEl.textContent='Minimum 6 caracteres.';return;}
  if(p1!==p2){errEl.textContent='Mots de passe differents.';return;}
  var params=new URLSearchParams(window.location.search);
  var token=params.get('reset');var email=params.get('email');
  var btn=document.getElementById('reset-submit-btn');
  btn.disabled=true;btn.textContent='Modification...';
  try{
    var res=await fetch(API_URL+'/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,email:email,password:p1})});
    var data=await res.json();
    if(data.success){
      document.getElementById('reset-form-inner').innerHTML="<div style='text-align:center;color:var(--green);padding:20px;line-height:2'>Mot de passe modifie !<br><button class='lbtn' style='width:auto;padding:12px 28px;margin-top:10px' onclick='showS(String.fromCharCode(115,45,108,111,103,105,110),true)'>Se connecter</button></div>";
    }else{errEl.textContent=data.error||'Lien expire.';btn.disabled=false;btn.textContent='Modifier';}
  }catch(e){errEl.textContent='Erreur.';btn.disabled=false;btn.textContent='Modifier';}
}
async function doLogin(){
  const em=document.getElementById('l-email').value.trim().toLowerCase();
  const pw=document.getElementById('l-pwd').value;
  const errEl=document.getElementById('l-err');const btn=document.getElementById('l-btn');
  if(!em){errEl.textContent=t('err_fields');return;}
  btn.disabled=true;btn.textContent=t('connecting');errEl.textContent='';
  try{
    const res=await fetch(`${API_URL}/api/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw||'__check_pending__',device_id:getDeviceId()})});
    const data=await res.json();
    if(data.success){st.user={email:data.email,name:data.email.split('@')[0]};localStorage.setItem('arab_token',data.token);localStorage.setItem('arab_email',data.email);showS('s-welcome',true);}
    else if(data.error&&data.error.includes('non activé')){document.getElementById('reg-email').value=em;const rt=document.getElementById('reg-title');rt.textContent=t('payment_ok');rt.dataset.set='1';const rs=document.getElementById('reg-sub');rs.textContent=t('payment_sub');rs.dataset.set='1';document.getElementById('reg-btn').textContent=t('create_account');showS('s-register',true);}
    else{errEl.textContent=data.error||t('login_err')||t('err_connection');}
  }catch(e){errEl.textContent=t('err_connection');}
  finally{btn.disabled=false;btn.textContent=t('login_btn');}
}
function doLogout(){st.user=null;localStorage.removeItem('arab_token');localStorage.removeItem('arab_email');applyI18N();showS('s-buy',false);}
function checkStripeReturn(){
  const params=new URLSearchParams(window.location.search);
  if(params.get('payment')==='success'){const email=params.get('email')||'';document.getElementById('reg-email').value=decodeURIComponent(email);const rt=document.getElementById('reg-title');rt.textContent=t('payment_ok');rt.dataset.set='1';const rs=document.getElementById('reg-sub');rs.textContent=t('payment_sub');rs.dataset.set='1';document.getElementById('reg-btn').textContent=t('create_account');showS('s-register',true);window.history.replaceState({},'',window.location.pathname);}
  else if(params.get('payment')==='cancel'){showS('s-buy',false);window.history.replaceState({},'',window.location.pathname);}
}
async function tryAutoLogin(){
  const token=localStorage.getItem('arab_token');const email=localStorage.getItem('arab_email');
  if(token&&email){st.user={email,name:email.split('@')[0]};showS('s-welcome',true);}
}

function buildMenu(){
  const nav=document.getElementById('menu-nav');if(!nav)return;nav.innerHTML='';
  [{id:'intro',icon:'ℹ️',cls:'gold',title:t('intro'),desc:t('intro_desc')},
   {id:'sessions',icon:'📚',cls:'pink',title:t('sessions'),desc:t('sessions_desc')},
   {id:'exercises',icon:'✏️',cls:'blue',title:t('exercises'),desc:t('exercises_desc')},
   {id:'contact',icon:'✉️',cls:'green',title:'Contact',desc:t('contact_desc')}]
  .forEach(it=>{
    const el=document.createElement('div');el.className='nav-card';
    el.innerHTML=`<div class="nav-icon ${it.cls}">${it.icon}</div><div class="nav-text"><div class="nav-title">${it.title}</div><div class="nav-desc">${it.desc}</div></div><div class="nav-arrow">›</div>`;
    el.onclick=()=>navToPage(it.id);nav.appendChild(el);
  });
  updateAvgScore();
}

function navToPage(page){
  st._curPage=page;showS('s-main',true);
  document.getElementById('tb-back').style.display='flex';
  document.getElementById('back-lbl').textContent=t('back_menu');
  document.getElementById('tb-title').textContent={intro:t('intro'),sessions:t('sessions'),exercises:t('exercises'),contact:'Contact',progress:t('progress'),settings:t('settings')}[page]||'';
  st.backHistory=[{target:'menu'}];
  renderPage(page,true);
}
function renderPage(page,fwd){
  const ca=document.getElementById('ca');transitionCA(fwd!==false);ca.scrollTop=0;
  if(page==='intro')renderIntro(ca);
  else if(page==='sessions')renderSessions(ca);
  else if(page==='exercises')renderExPage(ca);
  else if(page==='contact')renderContact(ca);
  else if(page==='progress')renderProgress(ca);
  else if(page==='settings')renderSettings(ca);
}
function handleBack(){
  const prev=st.backHistory.pop();
  // Animation dézoom: la page actuelle rétrécit pour revenir à la taille d'un carré
  var mainEl=document.getElementById('s-main');
  if(mainEl&&prev&&prev.target==='sessions'){
    mainEl.style.transition='all .38s cubic-bezier(.4,0,.2,1)';
    mainEl.style.transformOrigin='center center';
    mainEl.style.transform='scale(.15)';
    mainEl.style.opacity='0.3';
    mainEl.style.borderRadius='20px';
    setTimeout(function(){
      mainEl.style.transition='';mainEl.style.transform='';
      mainEl.style.opacity='';mainEl.style.borderRadius='';
      st._curPage='sessions';
      document.getElementById('tb-title').textContent=t('sessions');
      document.getElementById('back-lbl').textContent=t('back_menu');
      renderPage('sessions',false);
    },350);
  } else {
    if(!prev||prev.target==='menu'){showS('s-menu',false);}
    else if(prev.target==='sessions'){st._curPage='sessions';document.getElementById('tb-title').textContent=t('sessions');document.getElementById('back-lbl').textContent=t('back_menu');renderPage('sessions',false);}
  }
}

function getLang(){const m={'fr':'fr-FR','en':'en-GB','es':'es-ES','de':'de-DE','nl':'nl-NL','it':'it-IT','zh':'zh-CN','ru':'ru-RU','pt':'pt-PT','tr':'tr-TR','id':'id-ID','ur':'ur-PK','hi':'hi-IN'};return m[st.lang]||'fr-FR';}

var _spkPaused=false;
var _spkChunks=[];
var _spkIdx=0;
var _spkLang='fr-FR';
var _spkEl=null;
var _spkLastClick=0;
var _spkCurrentChunkIdx=0;

function _cleanTxt(txt,lang){
  if(!txt)return '';
  // Supprimer ampoule, triangle rouge, tous emoji
  // Supprimer emoji ampoule et triangle
  txt=txt.replace(/💡/g,'').replace(/🔻/g,'').trim();
  if(!txt)return '';
  if(lang&&!lang.startsWith('ar')){
    txt=txt.replace(/Allah/g,'Alla');
    // ع et غ : supprimer completement
    txt=txt.replace(/:\s*ع\s*et\s*غ[^.]*/g,'.');
    txt=txt.replace(/ع/g,'').replace(/غ/g,'');
    txt=txt.replace(/ء/g,'hamza').replace(/ب/g,'ba');
    txt=txt.replace(/ا/g,'alif').replace(/و/g,'waw');
    txt=txt.replace(/ي/g,'ya').replace(/ْ/g,'soukoun');
    // tiret
    txt=txt.replace(/—/g,'tiret').replace(/«/g,'').replace(/»/g,'');
    txt=txt.replace('[n]',"n'")
    txt=txt.replace(/\(\u00B0\)/g,'').replace(/\(°\)/g,'');
    txt=txt.replace(/sukun\s*\(°\)/g,'sukun').replace(/\(°\)/g,'');
  }
  if(lang&&lang.startsWith('ar')){
    if(txt==='ع')txt='عين';
    if(txt==='غ')txt='غين';
  }
  return txt;
}
function _playFromIdx(idx){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  _spkIdx=idx;
  _spkPaused=false;
  if(_spkEl)_spkEl.style.opacity='0.6';
  function doSpeak(){
    if(_spkPaused||_spkIdx>=_spkChunks.length){
      if(!_spkPaused&&_spkEl){_spkEl.style.opacity='1';_spkEl=null;}
      return;
    }
    var currentIdx=_spkIdx;
    var chunk=_spkChunks[_spkIdx++];
    if(!chunk.trim()){doSpeak();return;}
    var u=new SpeechSynthesisUtterance(chunk);
    u.lang=_spkLang;u.rate=0.88;u.pitch=1.0;
    var vs=window.speechSynthesis.getVoices();
    if(vs&&vs.length){
      var v=vs.find(function(x){return x.lang===u.lang&&!x.localService;})||
            vs.find(function(x){return x.lang===u.lang;})||
            vs.find(function(x){return x.lang.startsWith(u.lang.split('-')[0])&&!x.localService;})||
            vs.find(function(x){return x.lang.startsWith(u.lang.split('-')[0]);});
      if(v)u.voice=v;
    }
    u.onstart=function(){_spkCurrentChunkIdx=currentIdx;};
    u.onend=function(){setTimeout(doSpeak,80);};
    u.onerror=function(){setTimeout(doSpeak,80);};
    window.speechSynthesis.speak(u);
  }
  // Sur Android, les voix se chargent parfois après un délai
  var vs=window.speechSynthesis.getVoices();
  if(vs&&vs.length){doSpeak();}
  else{window.speechSynthesis.onvoiceschanged=function(){doSpeak();window.speechSynthesis.onvoiceschanged=null;};setTimeout(doSpeak,500);}
}

function speakQueue(items,el){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  if(_spkEl&&_spkEl!==el)_spkEl.style.opacity='1';
  _spkEl=el||null;_spkPaused=false;
  if(el)el.style.opacity='0.6';
  var queue=[...items];
  function playNext(){
    if(!queue.length){if(el)el.style.opacity='1';if(_spkEl===el)_spkEl=null;return;}
    var item=queue.shift();
    var txt=_cleanTxt(item.txt,item.lang);
    if(!txt){playNext();return;}
    var u=new SpeechSynthesisUtterance(txt);
    u.lang=item.lang;u.rate=0.82;u.pitch=1.0;
    var vs=window.speechSynthesis.getVoices();
    var v=vs.find(function(x){return x.lang===u.lang&&!x.localService;})||
          vs.find(function(x){return x.lang===u.lang;})||
          vs.find(function(x){return x.lang.startsWith(u.lang.split('-')[0])&&!x.localService;})||
          vs.find(function(x){return x.lang.startsWith(u.lang.split('-')[0]);});
    if(v)u.voice=v;
    u.onend=function(){setTimeout(playNext,300);};
    window.speechSynthesis.speak(u);
  }
  playNext();
}

function speakText(txt,lang,el){
  if(!window.speechSynthesis)return;
  var now=Date.now();
  var dbl=(now-_spkLastClick)<350&&_spkEl===el;
  _spkLastClick=now;
  var cleaned=_cleanTxt(txt,lang);
  if(!cleaned)return;
  if(dbl){_playFromIdx(0);return;}
  if(_spkEl===el){
    if(window.speechSynthesis.speaking&&!_spkPaused){
      window.speechSynthesis.cancel();
      _spkPaused=true;
      if(el)el.style.opacity='0.8';
      return;
    }
    if(_spkPaused){_playFromIdx(_spkCurrentChunkIdx);return;}
  }
  window.speechSynthesis.cancel();
  if(_spkEl&&_spkEl!==el)_spkEl.style.opacity='1';
  _spkEl=el||null;
  _spkLang=lang||'fr-FR';
  _spkChunks=cleaned.split(/[.!?]+\s+/).filter(function(c){return c.trim();});
  if(!_spkChunks.length)_spkChunks=[cleaned];
  _playFromIdx(0);
}

function stopSpeech(){
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  if(_spkEl)_spkEl.style.opacity='1';
  _spkEl=null;_spkPaused=false;_spkChunks=[];_spkIdx=0;
}

        btn.appendChild(arr);btn.appendChild(document.createTextNode(' '+t('rappel')));
        const content=document.createElement('div');content.style.cssText='display:none;margin-top:8px;font-size:.76rem;color:var(--txt2);line-height:1.7;cursor:pointer';content.title='🔊';content.innerHTML=fullTip;content.onclick=function(e){if(e.target===btn||e.target===arr)return;speakText(this.textContent,getLang(),this);};
        let open=false;btn.onclick=()=>{open=!open;content.style.display=open?'block':'none';arr.style.transform=open?'rotate(90deg)':'';};
        tipBox.appendChild(btn);tipBox.appendChild(content);layout.appendChild(tipBox);
      }
    }
  }
  let orbOrder=[{ar:letter.ar+'َ',lat:'a'},{ar:letter.ar+'َا',lat:'ā'},{ar:letter.ar+'ً',lat:'an'},{ar:letter.ar+'ِ',lat:'i'},{ar:letter.ar+'ِي',lat:'ī'},{ar:letter.ar+'ٍ',lat:'in'},{ar:letter.ar+'ُ',lat:'u'},{ar:letter.ar+'ُو',lat:'ū'},{ar:letter.ar+'ٌ',lat:'un'},{ar:letter.ar+'ْ',lat:'∅'}];
  if(isTaMarbuta)orbOrder=orbOrder.filter(h=>!['∅','ā','ī','ū'].includes(h.lat));
  const orbWrap=document.createElement('div');orbWrap.className='orb-wrap';
  const ctr=document.createElement('div');ctr.className='orb-ctr';ctr.textContent=letter.ar;
  ctr.onclick=()=>{speak(letter.name,.72);ctr.classList.add('rpl');setTimeout(()=>ctr.classList.remove('rpl'),500);};
  orbWrap.appendChild(ctr);
  orbOrder.forEach((hk,i)=>{
    const angle=(i/orbOrder.length)*2*Math.PI-Math.PI/2;const x=130+95*Math.cos(angle);const y=130+95*Math.sin(angle);
    const orb=document.createElement('div');orb.className='orb-sat';orb.style.left=(x-23)+'px';orb.style.top=(y-23)+'px';
    orb.innerHTML=`<span class="orb-ar">${hk.ar}</span><span class="orb-lat">${hk.lat}</span>`;
    orb.onclick=function(){document.querySelectorAll('.orb-sat').forEach(o=>o.classList.remove('lit'));this.classList.add('lit');speak(hk.ar,.78);};
    orbWrap.appendChild(orb);
  });
  layout.appendChild(orbWrap);ca.appendChild(layout);ca.appendChild(mkFAB(s));
}
function mkFAB(s){const b=document.createElement('button');b.className='fab';b.textContent=t('exercice');b.onclick=()=>startExercise(s);return b;}

// QUIZ
function buildQs(session){
  let qs=[];
  if(session.type==='vowels'){
    const pool=[
      {ar:'بَ',lat:'ba'},{ar:'بُ',lat:'bu'},{ar:'بِ',lat:'bi'},
      {ar:'بً',lat:'ban'},{ar:'بٌ',lat:'bun'},{ar:'بٍ',lat:'bin'},
      {ar:'بَا',lat:'bā'},{ar:'بُو',lat:'bū'},{ar:'بِي',lat:'bī'},
      {ar:'بْ',lat:'b (soukoun)'}
    ];
    qs=pool.sort(()=>Math.random()-.5);
  } else if(session.type==='prolong'){
    session.cards.forEach(c=>{qs.push({ar:c.long,lat:c.longLat});});
    qs=qs.sort(()=>Math.random()-.5);
  } else {
    const seenLetters=session.id===1?session.letters:LS.filter(s=>s.id<=session.id).flatMap(s=>s.letters);
    const pool=[];
    seenLetters.forEach(letter=>{
      letter.harakat.forEach(hk=>{
        const lat=letter.lat+(hk.lat==='∅'?'':hk.lat);
        pool.push({ar:hk.ar,lat:lat});
      });
    });
    const shuffled=pool.sort(()=>Math.random()-.5);
    qs=shuffled.slice(0,20);
  }
  return qs;
}
function startExercise(session){
  st.curLesson=session;document.getElementById('tb-title').textContent=session.emoji+' '+t('exercice').replace(' ▶','');
  document.getElementById('back-lbl').textContent=t('back_menu');st.backHistory.push({target:'sessions'});
  const qs=buildQs(session);
  const ca=document.getElementById('ca');transitionCA(true);ca.scrollTop=0;ca.innerHTML='';
  renderAudioExercise(ca,qs,session);
}
function renderAudioExercise(ca,qs,session){
  const total=qs.length;
  const ex={idx:0};
  const hdr=document.createElement('div');
  hdr.style.cssText='background:linear-gradient(135deg,var(--gold),#b8860b);border-radius:16px;padding:14px 18px;margin-bottom:14px;color:#000;text-align:center;font-weight:800;font-size:1rem';
  hdr.textContent=session.emoji+' '+t('exercice').replace(' ▶','');
  function renderQ(){
    ca.innerHTML='';ca.appendChild(hdr.cloneNode(true));
    if(ex.idx>=total){
      const rw=document.createElement('div');rw.className='res-w';
      rw.innerHTML=`<div style="font-size:2.5rem">🎉</div><div style="font-weight:700;font-size:1.1rem;margin-top:8px">${t('ex200_finish')}</div>`;
      const rb=document.createElement('div');rb.className='res-btns';
      const retry=document.createElement('button');retry.className='rbtn rbtn-m';retry.textContent=t('retry');
      retry.onclick=()=>startExercise(session);rb.appendChild(retry);
      const back=document.createElement('button');back.className='rbtn rbtn-s';back.textContent=t('back_s');
      back.onclick=()=>{st._curPage='sessions';renderPage('sessions',false);};rb.appendChild(back);
      rw.appendChild(rb);ca.appendChild(rw);return;
    }
    const q=qs[ex.idx];
    const pg=document.createElement('div');pg.className='qz-prog';
    pg.innerHTML=`<div class="qpb"><div class="qpf" style="width:${(ex.idx/total)*100}%"></div></div><div class="qs-lbl">${ex.idx+1}/${total}</div>`;
    ca.appendChild(pg);
    const qbox=document.createElement('div');qbox.className='qz-q';qbox.style.cssText='margin-bottom:16px;min-height:160px';
    qbox.innerHTML=`<div class="q-lbl">${t('ex200_desc')}</div><div class="q-big" style="font-size:clamp(1.3rem,5.5vw,2.8rem);margin:12px 4px;direction:rtl;line-height:1.6;padding:4px 8px">${q.ar}</div>`;
    ca.appendChild(qbox);
    const audioWrap=document.createElement('div');audioWrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px';
    const audioBtn=document.createElement('button');audioBtn.className='fab';audioBtn.style.cssText='font-size:1rem;padding:14px 36px;';
    audioBtn.textContent=t('ex200_listen');
    const nextWrap=document.createElement('div');nextWrap.style.cssText='display:none;flex-direction:column;align-items:center;gap:10px;width:100%';
    audioBtn.onclick=()=>{speak(q.ar,.78);audioBtn.style.opacity='.7';nextWrap.style.display='flex';};
    const nextBtn=document.createElement('button');nextBtn.className='rbtn rbtn-m';nextBtn.style.marginTop='4px';
    nextBtn.textContent=ex.idx<total-1?t('ex200_next'):t('ex200_finish');
    nextBtn.onclick=()=>{ex.idx++;animEl(ca,'tx-fade');renderQ();};
    nextWrap.appendChild(nextBtn);
    audioWrap.appendChild(audioBtn);audioWrap.appendChild(nextWrap);ca.appendChild(audioWrap);
  }
  renderQ();
}

// EXERCISE PAGE — 200 questions audio
function renderExPage(ca){
  ca.innerHTML='';
  const hdr=document.createElement('div');
  hdr.style.cssText='background:linear-gradient(135deg,var(--gold),#b8860b);border-radius:16px;padding:16px 18px;margin-bottom:14px;color:#000;text-align:center';
  hdr.innerHTML=`<div style="font-weight:800;font-size:1.1rem;margin-bottom:4px">${t('ex200_title')}</div>`;
  ca.appendChild(hdr);
  const allWords=[];ALL_LETTERS.forEach(l=>{(l.words||[]).forEach(w=>{if(w.ar&&w.lat)allWords.push({ar:w.ar,lat:w.lat});});});
  if(!allWords.length){ca.innerHTML+='<div class="info-box">Les mots seront disponibles dès les premières leçons.</div>';return;}
  const pool=[];const sh=[...allWords].sort(()=>Math.random()-.5);while(pool.length<200)pool.push(...sh);
  const qs=pool.slice(0,200);
  const ex={idx:0};
  function renderQ(){
    ca.innerHTML='';ca.appendChild(hdr.cloneNode(true));
    if(ex.idx>=200){
      const rw=document.createElement('div');rw.className='res-w';
      rw.innerHTML=`<div style="font-size:2rem">🎉</div><div style="font-weight:700;font-size:1rem">${t('ex200_finish')}</div>`;
      const rb=document.createElement('div');rb.className='res-btns';const r=document.createElement('button');r.className='rbtn rbtn-m';r.textContent=t('retry');r.onclick=()=>navToPage('exercises');rb.appendChild(r);rw.appendChild(rb);ca.appendChild(rw);return;
    }
    const q=qs[ex.idx];
    const pg=document.createElement('div');pg.className='qz-prog';pg.innerHTML=`<div class="qpb"><div class="qpf" style="width:${(ex.idx/200)*100}%"></div></div><div class="qs-lbl">${ex.idx}/200</div>`;ca.appendChild(pg);
    const qbox=document.createElement('div');qbox.className='qz-q';qbox.style.cssText='margin-bottom:16px;min-height:160px';
    qbox.innerHTML=`<div class="q-lbl">${t('ex200_desc')}</div><div class="q-big" style="font-size:clamp(1.3rem,5.5vw,2.8rem);margin:12px 4px;direction:rtl;line-height:1.6;padding:4px 8px">${q.ar}</div>`;ca.appendChild(qbox);
    const audioWrap=document.createElement('div');audioWrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px';
    const audioBtn=document.createElement('button');audioBtn.className='fab';audioBtn.style.cssText='font-size:1rem;padding:14px 36px;';audioBtn.textContent=t('ex200_listen');
    const nextWrap=document.createElement('div');nextWrap.style.cssText='display:none;flex-direction:column;align-items:center;gap:10px;width:100%';
    audioBtn.onclick=()=>{speak(q.ar,.78);audioBtn.style.opacity='.7';nextWrap.style.display='flex';};
    const nextBtn=document.createElement('button');nextBtn.className='rbtn rbtn-m';nextBtn.style.marginTop='4px';
    nextBtn.textContent=ex.idx<199?t('ex200_next'):t('ex200_finish');
    nextBtn.onclick=()=>{ex.idx++;animEl(ca,'tx-fade');renderQ();};
    nextWrap.appendChild(nextBtn);
    audioWrap.appendChild(audioBtn);audioWrap.appendChild(nextWrap);ca.appendChild(audioWrap);
  }renderQ();
}

// PROGRESS
function renderProgress(ca){
  ca.innerHTML='';const g=document.createElement('div');g.className='pg-grid';
  ALL_S.forEach((s,idx)=>{
    const sc=st.scores[s.id]||0;const c=document.createElement('div');c.className='pg-c';
    let name='';if(s.type==='vowels')name=t('vowels_name');else if(s.type==='prolong')name=t('prolong_name');else name=t('lesson_num')+' '+(idx+1);
    c.innerHTML=`<div class="pg-n">${s.emoji} ${name}</div><div class="pg-bw"><div class="pg-bf" style="width:${sc}%"></div></div><div class="pg-p">${sc}%</div>`;g.appendChild(c);
  });
  const vals=Object.values(st.scores);const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
  const ov=document.createElement('div');ov.className='pg-ov';ov.textContent=t('global_score')+' : '+avg+'%';g.appendChild(ov);ca.appendChild(g);
}

// COMPLETION CHECK — 100% toutes les leçons
function checkCompletion(){
  const allPassed=ALL_S.every(s=>(st.scores[s.id]||0)>=80);
  if(!allPassed)return;
  if(st._completionShown)return;
  st._completionShown=true;
  setTimeout(()=>showCompletionModal(),800);
}
function showCompletionModal(){
  let modal=document.getElementById('completion-modal');
  if(!modal){
    modal=document.createElement('div');modal.id='completion-modal';
    modal.style.cssText='position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;';
    document.body.appendChild(modal);
  }
  // Confetti
  for(let i=0;i<50;i++){const c=document.createElement('div');const cols=['var(--gold)','#4caf50','#4fc3f7','#ff6ec7','#ffd700','#ff5252'];c.style.cssText=`position:fixed;top:-10px;left:${Math.random()*100}vw;width:${5+Math.random()*9}px;height:${5+Math.random()*9}px;background:${cols[i%cols.length]};border-radius:${Math.random()>.5?'50%':'2px'};animation:cfetti ${2+Math.random()*2.5}s ease-in ${Math.random()*1.2}s forwards;pointer-events:none;z-index:999;`;document.body.appendChild(c);setTimeout(()=>c.remove(),6000);}
  modal.innerHTML=`

      <div style="font-size:1.2rem;font-weight:800;color:var(--gold);margin-bottom:12px">${t('completion_title')}</div>
      <div style="font-size:.84rem;color:var(--txt2);line-height:1.7;margin-bottom:24px">${t('completion_msg')}</div>
      <button onclick="navToPage('exercises');document.getElementById('completion-modal').style.display='none';" style="width:100%;padding:14px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--gold),#b8860b);color:#000;font-family:var(--ff);font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:10px;">${t('completion_btn')}</button>
      <button onclick="document.getElementById('completion-modal').style.display='none';" style="width:100%;padding:11px;border-radius:50px;border:1px solid rgba(255,255,255,.18);background:rgba(10,7,24,.75);color:var(--txt2);font-family:var(--ff);font-size:.84rem;cursor:pointer;">${t('completion_dismiss')}</button>
