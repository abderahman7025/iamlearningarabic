<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <style>
    .anim{transform-box:fill-box;transform-origin:center}
    .bat    {animation:bat 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    .respire{animation:respire 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
    .flotte {animation:flotte 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
    .derive {animation:derive 16s linear infinite;animation-delay:var(--d,0s)}
    .aileG  {animation:aileG 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:right center}
    .aileD  {animation:aileD 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left center}
    .queue  {animation:queue 1.3s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left bottom}
    .dodeline{animation:dodeline 2.8s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:center bottom}
    .brille {animation:brille 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    @keyframes bat     {0%,100%{transform:scale(1)}18%{transform:scale(1.16)}30%{transform:scale(1.02)}45%{transform:scale(1.10)}}
    @keyframes respire {0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes flotte  {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes derive  {0%{transform:translateX(-26px)}50%{transform:translateX(26px)}100%{transform:translateX(-26px)}}
    @keyframes aileG   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes aileD   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes queue   {0%,100%{transform:rotate(-13deg)}50%{transform:rotate(15deg)}}
    @keyframes dodeline{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
    @keyframes brille  {0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
  </style>
  <defs>
    <radialGradient id="c-nuages" cx="36%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#f2fbff"/>
      <stop offset="54%" stop-color="#c5e9ff"/>
      <stop offset="100%" stop-color="#79b8e8"/>
    </radialGradient>
    <radialGradient id="h-nuages" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#a8dcff" stop-opacity="0"/>
      <stop offset="80%" stop-color="#a8dcff" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#a8dcff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="d-nuages"><circle cx="200" cy="200" r="128"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="172" fill="url(#h-nuages)"/>
  <circle cx="200" cy="200" r="128" fill="url(#c-nuages)"/>
  <g clip-path="url(#d-nuages)"><g class="anim derive" opacity="0.95" style="--d:0s"><rect x="106" y="145.8" width="108" height="32.4" rx="16.2" fill="#ffffff"/><circle cx="141.64" cy="144.72" r="27" fill="#ffffff"/><circle cx="177.28" cy="152.28" r="19.439999999999998" fill="#ffffff"/></g><g class="anim derive" opacity="0.9" style="--d:4s"><rect x="218" y="210.8" width="88" height="26.4" rx="13.2" fill="#ffffff"/><circle cx="247.04" cy="209.92" r="22" fill="#ffffff"/><circle cx="276.08" cy="216.08" r="15.84" fill="#ffffff"/></g><g class="anim derive" opacity="0.85" style="--d:8s"><rect x="92" y="256" width="120" height="36" rx="18" fill="#ffffff"/><circle cx="131.6" cy="254.8" r="30" fill="#ffffff"/><circle cx="171.2" cy="263.2" r="21.599999999999998" fill="#ffffff"/></g><g class="anim derive" opacity="0.8" style="--d:12s"><rect x="242" y="121" width="60" height="18" rx="9" fill="#ffffff"/><circle cx="261.8" cy="120.4" r="15" fill="#ffffff"/><circle cx="281.6" cy="124.6" r="10.799999999999999" fill="#ffffff"/></g><g class="anim derive" opacity="0.7" style="--d:6s"><rect x="172" y="189.8" width="68" height="20.4" rx="10.2" fill="#ffffff"/><circle cx="194.44" cy="189.12" r="17" fill="#ffffff"/><circle cx="216.88" cy="193.88" r="12.24" fill="#ffffff"/></g></g>
  <circle cx="200" cy="200" r="128" fill="none" stroke="#5f9fd0" stroke-opacity=".38" stroke-width="3"/>
  <ellipse cx="153.92000000000002" cy="143.68" rx="33.28" ry="20.48" fill="#ffffff" opacity=".30" transform="rotate(-28 153.92000000000002 143.68)"/>
  <path class="anim brille" style="--d:0.0s" d="M 92 108 Q 92 120 104 120 Q 92 120 92 132 Q 92 120 80 120 Q 92 120 92 108 Z" fill="#ffffff" opacity=".85"/><path class="anim brille" style="--d:0.7s" d="M 318 284 Q 318 296 330 296 Q 318 296 318 308 Q 318 296 306 296 Q 318 296 318 284 Z" fill="#ffffff" opacity=".85"/><path class="anim brille" style="--d:1.4s" d="M 110 306 Q 110 316 120 316 Q 110 316 110 326 Q 110 316 100 316 Q 110 316 110 306 Z" fill="#ffffff" opacity=".85"/>
</svg>
