<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" preserveAspectRatio="xMidYMid slice">

  <style>
    .anim{transform-box:fill-box;transform-origin:center}
    .bat    {animation:bat 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    .respire{animation:respire 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
    .flotte {animation:flotte 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
    .derive {animation:derive 16s linear infinite;animation-delay:var(--d,0s)}
    .aileG  {animation:aileG 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:right center}
    .aileD  {animation:aileD 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left center}
    .queue  {animation:queue 1.3s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left bottom}
    .dodeline{animation:dodeline 2.8s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:center bottom}
    .brille {animation:brille 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un cœur ne fait pas que battre : il paraît, il grossit, il s'efface,
       et un autre prend sa place. */
    .vitcoeur{animation:vitcoeur 6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un nuage TRAVERSE son monde et revient par l'autre bord. Le disque
       découpe l'image : il disparaît donc tout seul en sortant. */
    .traverse{animation:traverse var(--t,22s) linear infinite;animation-delay:var(--d,0s)}
    @keyframes vitcoeur{
      0%   {opacity:0;transform:scale(.35)}
      12%  {opacity:1;transform:scale(1.12)}
      20%  {transform:scale(.96)}
      30%  {transform:scale(1.08)}
      40%  {transform:scale(.98)}
      52%  {opacity:1;transform:scale(1.14)}
      70%  {opacity:.85;transform:scale(1)}
      88%  {opacity:0;transform:scale(.45)}
      100% {opacity:0;transform:scale(.35)}
    }
    @keyframes traverse{
      0%  {transform:translateX(-330px)}
      100%{transform:translateX(330px)}
    }
    @keyframes bat     {0%,100%{transform:scale(1)}18%{transform:scale(1.16)}30%{transform:scale(1.02)}45%{transform:scale(1.10)}}
    @keyframes respire {0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes flotte  {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes derive  {0%{transform:translateX(-26px)}50%{transform:translateX(26px)}100%{transform:translateX(-26px)}}
    @keyframes aileG   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes aileD   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes queue   {0%,100%{transform:rotate(-13deg)}50%{transform:rotate(15deg)}}
    @keyframes dodeline{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
    @keyframes brille  {0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
  </style>
  <defs><linearGradient id="ciel-couronne" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff8e8"/><stop offset="52%" stop-color="#ffeccc"/><stop offset="100%" stop-color="#f7d5a0"/></linearGradient></defs>
  <rect width="1400" height="900" fill="url(#ciel-couronne)"/>
  <path d="M 0 688 Q 350 608 700 648 T 1400 668 L 1400 900 L 0 900 Z" fill="#e8b06a"/>
<path d="M 470 900 L 620 620 L 780 620 L 930 900 Z" fill="#e8628f" opacity=".55"/><g class="anim flotte"><path d="M 560 610 q 140 -52 280 0 q 12 46 -28 62 q -112 30 -224 0 q -40 -16 -28 -62 Z" fill="#e86a9c"/><path d="M 560 610 q 140 -52 280 0 q -140 52 -280 0 Z" fill="#ff9ec4"/></g><path class="anim vitcoeur" style="--d:0s" d="M 240 324.48 C 200.9 294.9 222.32 267.7 240 290.48 C 257.68 267.7 279.1 294.9 240 324.48 Z" fill="#ff9ec4" opacity=".8"/><path class="anim vitcoeur" style="--d:2.4s" d="M 1160 281.6 C 1125.5 255.5 1144.4 231.5 1160 251.6 C 1175.6 231.5 1194.5 255.5 1160 281.6 Z" fill="#ff9ec4" opacity=".8"/>  <g transform="translate(50 470) scale(1)" opacity=".9"><ellipse cx="200" cy="214" rx="96" ry="90" fill="#ffffff" opacity=".34"/><g class="anim flotte"><path d="M 128 268 q 72 -26 144 0 q 6 24 -14 32 q -58 16 -116 0 q -20 -8 -14 -32 Z" fill="#e86a9c"/><path d="M 128 268 q 72 -26 144 0 q -72 26 -144 0 Z" fill="#ff9ec4"/><circle cx="132" cy="296" r="9" fill="#ffd34e"/><circle cx="268" cy="296" r="9" fill="#ffd34e"/></g><path class="anim bat" style="--d:0.2s" d="M 112 207.52 C 93.6 193.6 103.68 180.8 112 191.52 C 120.32 180.8 130.4 193.6 112 207.52 Z" fill="#ff9ec4"/><path class="anim bat" style="--d:0.9s" d="M 292 200.08 C 275.9 187.9 284.72 176.7 292 186.08 C 299.28 176.7 308.1 187.9 292 200.08 Z" fill="#ff9ec4"/></g>
  <g transform="translate(1010 506) scale(0.8)" opacity=".8"><ellipse cx="200" cy="214" rx="96" ry="90" fill="#ffffff" opacity=".34"/><g class="anim flotte"><path d="M 128 268 q 72 -26 144 0 q 6 24 -14 32 q -58 16 -116 0 q -20 -8 -14 -32 Z" fill="#e86a9c"/><path d="M 128 268 q 72 -26 144 0 q -72 26 -144 0 Z" fill="#ff9ec4"/><circle cx="132" cy="296" r="9" fill="#ffd34e"/><circle cx="268" cy="296" r="9" fill="#ffd34e"/></g><path class="anim bat" style="--d:0.2s" d="M 112 207.52 C 93.6 193.6 103.68 180.8 112 191.52 C 120.32 180.8 130.4 193.6 112 207.52 Z" fill="#ff9ec4"/><path class="anim bat" style="--d:0.9s" d="M 292 200.08 C 275.9 187.9 284.72 176.7 292 186.08 C 299.28 176.7 308.1 187.9 292 200.08 Z" fill="#ff9ec4"/></g>
  <g transform="translate(480 527) scale(1.1)" opacity=".85"><ellipse cx="200" cy="214" rx="96" ry="90" fill="#ffffff" opacity=".34"/><g class="anim flotte"><path d="M 128 268 q 72 -26 144 0 q 6 24 -14 32 q -58 16 -116 0 q -20 -8 -14 -32 Z" fill="#e86a9c"/><path d="M 128 268 q 72 -26 144 0 q -72 26 -144 0 Z" fill="#ff9ec4"/><circle cx="132" cy="296" r="9" fill="#ffd34e"/><circle cx="268" cy="296" r="9" fill="#ffd34e"/></g><path class="anim bat" style="--d:0.2s" d="M 112 207.52 C 93.6 193.6 103.68 180.8 112 191.52 C 120.32 180.8 130.4 193.6 112 207.52 Z" fill="#ff9ec4"/><path class="anim bat" style="--d:0.9s" d="M 292 200.08 C 275.9 187.9 284.72 176.7 292 186.08 C 299.28 176.7 308.1 187.9 292 200.08 Z" fill="#ff9ec4"/></g>
</svg>
