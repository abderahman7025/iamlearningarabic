<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <style>
    .anim{transform-box:fill-box;transform-origin:center}
    .bat    {animation:bat 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    .respire{animation:respire 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
    .flotte {animation:flotte 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
    .derive {animation:derive 16s linear infinite;animation-delay:var(--d,0s)}
    .aileG  {animation:aileG 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:right center}
    .aileD  {animation:aileD 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left center}
    .queue  {animation:queue 1.3s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left bottom}
    .dodeline{animation:dodeline 2.8s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:center bottom}
    .brille {animation:brille 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un cœur ne fait pas que battre : il paraît, il grossit, il s'efface,
       et un autre prend sa place. */
    .vitcoeur{animation:vitcoeur 6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un nuage TRAVERSE son monde et revient par l'autre bord. Le disque
       découpe l'image : il disparaît donc tout seul en sortant. */
    .traverse{animation:traverse var(--t,22s) linear infinite;animation-delay:var(--d,0s)}
    @keyframes vitcoeur{
      0%   {opacity:0;transform:scale(.35)}
      12%  {opacity:1;transform:scale(1.12)}
      20%  {transform:scale(.96)}
      30%  {transform:scale(1.08)}
      40%  {transform:scale(.98)}
      52%  {opacity:1;transform:scale(1.14)}
      70%  {opacity:.85;transform:scale(1)}
      88%  {opacity:0;transform:scale(.45)}
      100% {opacity:0;transform:scale(.35)}
    }
    @keyframes traverse{
      0%  {transform:translateX(-330px)}
      100%{transform:translateX(330px)}
    }
    @keyframes bat     {0%,100%{transform:scale(1)}18%{transform:scale(1.16)}30%{transform:scale(1.02)}45%{transform:scale(1.10)}}
    @keyframes respire {0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes flotte  {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes derive  {0%{transform:translateX(-26px)}50%{transform:translateX(26px)}100%{transform:translateX(-26px)}}
    @keyframes aileG   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes aileD   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes queue   {0%,100%{transform:rotate(-13deg)}50%{transform:rotate(15deg)}}
    @keyframes dodeline{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
    @keyframes brille  {0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
  </style>
  <defs>
    <radialGradient id="c-coeurs" cx="36%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#fff2f7"/>
      <stop offset="54%" stop-color="#ffd0e4"/>
      <stop offset="100%" stop-color="#f07aae"/>
    </radialGradient>
    <radialGradient id="h-coeurs" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ff9ecf" stop-opacity="0"/>
      <stop offset="80%" stop-color="#ff9ecf" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#ff9ecf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="d-coeurs"><circle cx="200" cy="200" r="128"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="172" fill="url(#h-coeurs)"/>
  <circle cx="200" cy="200" r="128" fill="url(#c-coeurs)"/>
  <g clip-path="url(#d-coeurs)"><path class="anim bat" style="--d:0s" d="M 196 248.64 C 124.7 194.7 163.76 145.1 196 186.64 C 228.24 145.1 267.3 194.7 196 248.64 Z" fill="#ff5f8f"/><path class="anim vitcoeur" style="--d:0s" d="M 126 196.48 C 86.9 166.9 108.32 139.7 126 162.48 C 143.68 139.7 165.1 166.9 126 196.48 Z" fill="#ff9ec4"/><path class="anim vitcoeur" style="--d:0.9s" d="M 272 195.6 C 237.5 169.5 256.4 145.5 272 165.6 C 287.6 145.5 306.5 169.5 272 195.6 Z" fill="#ffb3d1"/><path class="anim vitcoeur" style="--d:1.8s" d="M 140 309.04 C 103.2 281.2 123.36 255.6 140 277.04 C 156.64 255.6 176.8 281.2 140 309.04 Z" fill="#ff85b5"/><path class="anim vitcoeur" style="--d:2.7s" d="M 266 309.36 C 222.3 276.3 246.24 245.9 266 271.36 C 285.76 245.9 309.7 276.3 266 309.36 Z" fill="#ff2e6b" opacity=".9"/><path class="anim vitcoeur" style="--d:3.6s" d="M 206 317.84 C 180.7 298.7 194.56 281.1 206 295.84 C 217.44 281.1 231.3 298.7 206 317.84 Z" fill="#ffc9df"/><path class="anim vitcoeur" style="--d:4.5s" d="M 200 130.96 C 179.3 115.3 190.64 100.9 200 112.96 C 209.36 100.9 220.7 115.3 200 130.96 Z" fill="#ffffff" opacity=".9"/><path class="anim vitcoeur" style="--d:5.4s" d="M 158 246.4 C 135 229 147.6 213 158 226.4 C 168.4 213 181 229 158 246.4 Z" fill="#ffffff" opacity=".8"/><path class="anim vitcoeur" style="--d:1.35s" d="M 246 253.28 C 218.4 232.4 233.52 213.2 246 229.28 C 258.48 213.2 273.6 232.4 246 253.28 Z" fill="#ff85b5"/><path class="anim vitcoeur" style="--d:3.15s" d="M 304 238.96 C 283.3 223.3 294.64 208.9 304 220.96 C 313.36 208.9 324.7 223.3 304 238.96 Z" fill="#ffc9df"/></g>
  <circle cx="200" cy="200" r="128" fill="none" stroke="#d4568f" stroke-opacity=".38" stroke-width="3"/>
  <ellipse cx="153.92000000000002" cy="143.68" rx="33.28" ry="20.48" fill="#ffffff" opacity=".30" transform="rotate(-28 153.92000000000002 143.68)"/>
  <path class="anim brille" style="--d:0.0s" d="M 92 220 Q 92 232 104 232 Q 92 232 92 244 Q 92 232 80 232 Q 92 232 92 220 Z" fill="#ffffff" opacity=".85"/><path class="anim brille" style="--d:0.7s" d="M 306 223 Q 306 234 317 234 Q 306 234 306 245 Q 306 234 295 234 Q 306 234 306 223 Z" fill="#ffffff" opacity=".85"/><path class="anim brille" style="--d:1.4s" d="M 150 108 Q 150 120 162 120 Q 150 120 150 132 Q 150 120 138 120 Q 150 120 150 108 Z" fill="#ffffff" opacity=".85"/>
</svg>
