<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">

  <style>
    .anim{transform-box:fill-box;transform-origin:center}
    .bat    {animation:bat 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    .respire{animation:respire 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
    .flotte {animation:flotte 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
    .derive {animation:derive 16s linear infinite;animation-delay:var(--d,0s)}
    .aileG  {animation:aileG 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:right center}
    .aileD  {animation:aileD 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left center}
    .queue  {animation:queue 1.3s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left bottom}
    .dodeline{animation:dodeline 2.8s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:center bottom}
    .brille {animation:brille 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un cœur ne fait pas que battre : il paraît, il grossit, il s'efface,
       et un autre prend sa place. */
    .vitcoeur{animation:vitcoeur 6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un nuage TRAVERSE son monde et revient par l'autre bord. Le disque
       découpe l'image : il disparaît donc tout seul en sortant. */
    .traverse{animation:traverse var(--t,22s) linear infinite;animation-delay:var(--d,0s)}
    @keyframes vitcoeur{
      0%   {opacity:0;transform:scale(.35)}
      12%  {opacity:1;transform:scale(1.12)}
      20%  {transform:scale(.96)}
      30%  {transform:scale(1.08)}
      40%  {transform:scale(.98)}
      52%  {opacity:1;transform:scale(1.14)}
      70%  {opacity:.85;transform:scale(1)}
      88%  {opacity:0;transform:scale(.45)}
      100% {opacity:0;transform:scale(.35)}
    }
    @keyframes traverse{
      0%  {transform:translateX(-330px)}
      100%{transform:translateX(330px)}
    }
    @keyframes bat     {0%,100%{transform:scale(1)}18%{transform:scale(1.16)}30%{transform:scale(1.02)}45%{transform:scale(1.10)}}
    @keyframes respire {0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes flotte  {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes derive  {0%{transform:translateX(-26px)}50%{transform:translateX(26px)}100%{transform:translateX(-26px)}}
    @keyframes aileG   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes aileD   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes queue   {0%,100%{transform:rotate(-13deg)}50%{transform:rotate(15deg)}}
    @keyframes dodeline{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
    @keyframes brille  {0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
  </style>
  <g transform="translate(16 4) scale(0.72)" opacity=".85"><g class="anim traverse" opacity="0.8" style="--d:0s;--t:24s"><rect x="150" y="131" width="60" height="18" rx="9" fill="#ffffff"/><circle cx="169.8" cy="130.4" r="15" fill="#ffffff"/><circle cx="189.6" cy="134.6" r="10.799999999999999" fill="#ffffff"/></g><g class="anim traverse" opacity="0.7" style="--d:-8s;--t:18s"><rect x="206" y="178.8" width="48" height="14.399999999999999" rx="7.199999999999999" fill="#ffffff"/><circle cx="221.84" cy="178.32" r="12" fill="#ffffff"/><circle cx="237.68" cy="181.68" r="8.64" fill="#ffffff"/></g><path d="M 96 306 q 30 -20 58 -2 t 58 -2 t 58 4" stroke="#b49ae0" stroke-width="6" fill="none" opacity=".55"/><path d="M 120 316 v -16 M 168 320 v -20 M 224 318 v -18 M 276 312 v -16" stroke="#9a7fd0" stroke-width="5" stroke-linecap="round" opacity=".5"/></g>
  <g transform="translate(524 -3) scale(0.58)" opacity=".7"><g class="anim traverse" opacity="0.8" style="--d:0s;--t:24s"><rect x="150" y="131" width="60" height="18" rx="9" fill="#ffffff"/><circle cx="169.8" cy="130.4" r="15" fill="#ffffff"/><circle cx="189.6" cy="134.6" r="10.799999999999999" fill="#ffffff"/></g><g class="anim traverse" opacity="0.7" style="--d:-8s;--t:18s"><rect x="206" y="178.8" width="48" height="14.399999999999999" rx="7.199999999999999" fill="#ffffff"/><circle cx="221.84" cy="178.32" r="12" fill="#ffffff"/><circle cx="237.68" cy="181.68" r="8.64" fill="#ffffff"/></g><path d="M 96 306 q 30 -20 58 -2 t 58 -2 t 58 4" stroke="#b49ae0" stroke-width="6" fill="none" opacity=".55"/><path d="M 120 316 v -16 M 168 320 v -20 M 224 318 v -18 M 276 312 v -16" stroke="#9a7fd0" stroke-width="5" stroke-linecap="round" opacity=".5"/></g>
  <g transform="translate(204 218) scale(0.88)" opacity=".75"><g class="anim traverse" opacity="0.8" style="--d:0s;--t:24s"><rect x="150" y="131" width="60" height="18" rx="9" fill="#ffffff"/><circle cx="169.8" cy="130.4" r="15" fill="#ffffff"/><circle cx="189.6" cy="134.6" r="10.799999999999999" fill="#ffffff"/></g><g class="anim traverse" opacity="0.7" style="--d:-8s;--t:18s"><rect x="206" y="178.8" width="48" height="14.399999999999999" rx="7.199999999999999" fill="#ffffff"/><circle cx="221.84" cy="178.32" r="12" fill="#ffffff"/><circle cx="237.68" cy="181.68" r="8.64" fill="#ffffff"/></g><path d="M 96 306 q 30 -20 58 -2 t 58 -2 t 58 4" stroke="#b49ae0" stroke-width="6" fill="none" opacity=".55"/><path d="M 120 316 v -16 M 168 320 v -20 M 224 318 v -18 M 276 312 v -16" stroke="#9a7fd0" stroke-width="5" stroke-linecap="round" opacity=".5"/></g>
  <g transform="translate(686 320) scale(0.52)" opacity=".6"><g class="anim traverse" opacity="0.8" style="--d:0s;--t:24s"><rect x="150" y="131" width="60" height="18" rx="9" fill="#ffffff"/><circle cx="169.8" cy="130.4" r="15" fill="#ffffff"/><circle cx="189.6" cy="134.6" r="10.799999999999999" fill="#ffffff"/></g><g class="anim traverse" opacity="0.7" style="--d:-8s;--t:18s"><rect x="206" y="178.8" width="48" height="14.399999999999999" rx="7.199999999999999" fill="#ffffff"/><circle cx="221.84" cy="178.32" r="12" fill="#ffffff"/><circle cx="237.68" cy="181.68" r="8.64" fill="#ffffff"/></g><path d="M 96 306 q 30 -20 58 -2 t 58 -2 t 58 4" stroke="#b49ae0" stroke-width="6" fill="none" opacity=".55"/><path d="M 120 316 v -16 M 168 320 v -20 M 224 318 v -18 M 276 312 v -16" stroke="#9a7fd0" stroke-width="5" stroke-linecap="round" opacity=".5"/></g>
</svg>
