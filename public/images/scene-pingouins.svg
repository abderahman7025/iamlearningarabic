  <g transform="translate(204 218) scale(0.88)" opacity=".75"><path d="M 84 302 L 128 252 L 172 302 Z" fill="#ffffff" opacity=".9"/><path d="M 232 298 L 286 240 L 336 298 Z" fill="#f2fbff" opacity=".9"/><ellipse cx="200" cy="316" rx="86" ry="16" fill="#ffffff" opacity=".75"/><g class="anim traverse" opacity="0.85" style="--d:0s;--t:26s"><rect x="116" y="135.8" width="68" height="20.4" rx="10.2" fill="#ffffff"/><circle cx="138.44" cy="135.12" r="17" fill="#ffffff"/><circle cx="160.88" cy="139.88" r="12.24" fill="#ffffff"/></g><g class="anim traverse" opacity="0.8" style="--d:-9s;--t:20s"><rect x="234" y="168.2" width="52" height="15.6" rx="7.8" fill="#ffffff"/><circle cx="251.16" cy="167.68" r="13" fill="#ffffff"/><circle cx="268.32" cy="171.32" r="9.36" fill="#ffffff"/></g></g>
  <g transform="translate(686 320) scale(0.52)" opacity=".6"><path d="M 84 302 L 128 252 L 172 302 Z" fill="#ffffff" opacity=".9"/><path d="M 232 298 L 286 240 L 336 298 Z" fill="#f2fbff" opacity=".9"/><ellipse cx="200" cy="316" rx="86" ry="16" fill="#ffffff" opacity=".75"/><g class="anim traverse" opacity="0.85" style="--d:0s;--t:26s"><rect x="116" y="135.8" width="68" height="20.4" rx="10.2" fill="#ffffff"/><circle cx="138.44" cy="135.12" r="17" fill="#ffffff"/><circle cx="160.88" cy="139.88" r="12.24" fill="#ffffff"/></g><g class="anim traverse" opacity="0.8" style="--d:-9s;--t:20s"><rect x="234" y="168.2" width="52" height="15.6" rx="7.8" fill="#ffffff"/><circle cx="251.16" cy="167.68" r="13" fill="#ffffff"/><circle cx="268.32" cy="171.32" r="9.36" fill="#ffffff"/></g></g>
</svg>
