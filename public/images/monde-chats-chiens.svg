      <stop offset="80%" stop-color="#ffcf9e" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#ffcf9e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="d-chats-chiens"><circle cx="200" cy="200" r="128"/></clipPath>
  </defs>
