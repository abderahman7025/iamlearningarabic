tate(240 527.8 666.6)"/><ellipse cx="527.8" cy="629.4" rx="26.0" ry="34.7" fill="url(#p-pp1)" stroke="#e86ab0" stroke-opacity=".35" stroke-width="2" transform="rotate(300 527.8 629.4)"/><circle cx="560" cy="648" r="22.32" fill="url(#m-pp1)"/><circle cx="553.8" cy="640.56" r="6.2" fill="#ffffff" opacity=".55"/></g><defs><radialGradient id="p-pp2" cx="38%" cy="30%" r="72%"><stop offset="0%" stop-color="#d8e8ff"/><stop offset="100%" stop-color="#6a8ad8"/></radialGradient><radialGradient id="m-pp2" cx="36%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff6c4"/><stop offset="100%" stop-color="#ffcf4e"/></radialGradient></defs><g class="anim dodeline" style="--d:1.6s"><ellipse cx="880.0" cy="645.6" rx="22.7" ry="30.2" fill="url(#p-pp2)" stroke="#6a8ad8" stroke-opacity=".35" stroke-width="2" transform="rotate(0 880.0 645.6)"/><ellipse cx="908.1" cy="661.8" rx="22.7" ry="30.2" fill="url(#p-pp2)" stroke="#6a8ad8" stroke-opacity=".35" stroke-width="2" transform="rotate(60 908.1 661.8)"/><ellipse cx="908.1" cy="694.2" rx="22.7" ry="30.2" fill="url(#p-pp2)" stroke="#6a8ad8" stroke-opacity=".35" stroke-width="2" transform="rotate(120 908.1 694.2)"/><ellipse cx="880.0" cy="710.4" rx="22.7" ry="30.2" fill="url(#p-pp2)" stroke="#6a8ad8" stroke-opacity=".35" stroke-width="2" transform="rotate(180 880.0 710.4)"/><ellipse cx="851.9" cy="694.2" rx="22.7" ry="30.2" fill="url(#p-pp2)" stroke="#6a8ad8" stroke-opacity=".35" stroke-width="2" transform="rotate(240 851.9 694.2)"/><ellipse cx="851.9" cy="661.8" rx="22.7" ry="30.2" fill="url(#p-pp2)" stroke="#6a8ad8" stroke-opacity=".35" stroke-width="2" transform="rotate(300 851.9 661.8)"/><circle cx="880" cy="678" r="19.439999999999998" fill="url(#m-pp2)"/><circle cx="874.6" cy="671.52" r="5.4" fill="#ffffff" opacity=".55"/></g><g class="anim traverse" opacity="0.75" style="--d:0s;--t:46s"><rect x="286" y="183.8" width="108" height="32.4" rx="16.2" fill="#ffffff"/><circle cx="321.64" cy="182.72" r="27" fill="#ffffff"/><circle cx="357.28" cy="190.28" r="19.439999999999998" fill="#ffffff"/></g></svg>
