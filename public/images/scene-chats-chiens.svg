<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">

  <style>
    .anim{transform-box:fill-box;transform-origin:center}
    .bat    {animation:bat 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    .respire{animation:respire 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
    .flotte {animation:flotte 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
    .derive {animation:derive 16s linear infinite;animation-delay:var(--d,0s)}
    .aileG  {animation:aileG 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:right center}
    .aileD  {animation:aileD 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left center}
    .queue  {animation:queue 1.3s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left bottom}
    .dodeline{animation:dodeline 2.8s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:center bottom}
    .brille {animation:brille 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un cœur ne fait pas que battre : il paraît, il grossit, il s'efface,
       et un autre prend sa place. */
    .vitcoeur{animation:vitcoeur 6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un nuage TRAVERSE son monde et revient par l'autre bord. Le disque
       découpe l'image : il disparaît donc tout seul en sortant. */
    .traverse{animation:traverse var(--t,22s) linear infinite;animation-delay:var(--d,0s)}
    @keyframes vitcoeur{
      0%   {opacity:0;transform:scale(.35)}
      12%  {opacity:1;transform:scale(1.12)}
      20%  {transform:scale(.96)}
      30%  {transform:scale(1.08)}
      40%  {transform:scale(.98)}
      52%  {opacity:1;transform:scale(1.14)}
      70%  {opacity:.85;transform:scale(1)}
      88%  {opacity:0;transform:scale(.45)}
      100% {opacity:0;transform:scale(.35)}
    }
    @keyframes traverse{
      0%  {transform:translateX(-330px)}
      100%{transform:translateX(330px)}
    }
    @keyframes bat     {0%,100%{transform:scale(1)}18%{transform:scale(1.16)}30%{transform:scale(1.02)}45%{transform:scale(1.10)}}
    @keyframes respire {0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes flotte  {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes derive  {0%{transform:translateX(-26px)}50%{transform:translateX(26px)}100%{transform:translateX(-26px)}}
    @keyframes aileG   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes aileD   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes queue   {0%,100%{transform:rotate(-13deg)}50%{transform:rotate(15deg)}}
    @keyframes dodeline{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
    @keyframes brille  {0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
  </style>
  <g transform="translate(16 4) scale(0.72)" opacity=".85"><circle cx="300" cy="306" r="16" fill="#ff9ec4"/><path d="M 286 300 q 14 -8 28 2 M 288 312 q 14 6 26 -4" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M 96 312 q 12 -20 24 0 M 130 318 q 10 -16 20 0" stroke="#5f9e4c" stroke-width="6" fill="none" stroke-linecap="round"/><path class="anim vitcoeur" style="--d:0s" d="M 206 155.84 C 180.7 136.7 194.56 119.1 206 133.84 C 217.44 119.1 231.3 136.7 206 155.84 Z" fill="#ff9ec4" opacity=".85"/><path class="anim vitcoeur" style="--d:2.2s" d="M 128 189.52 C 109.6 175.6 119.68 162.8 128 173.52 C 136.32 162.8 146.4 175.6 128 189.52 Z" fill="#ffb3d1" opacity=".8"/></g>
  <g transform="translate(524 -3) scale(0.58)" opacity=".7"><circle cx="300" cy="306" r="16" fill="#ff9ec4"/><path d="M 286 300 q 14 -8 28 2 M 288 312 q 14 6 26 -4" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M 96 312 q 12 -20 24 0 M 130 318 q 10 -16 20 0" stroke="#5f9e4c" stroke-width="6" fill="none" stroke-linecap="round"/><path class="anim vitcoeur" style="--d:0s" d="M 206 155.84 C 180.7 136.7 194.56 119.1 206 133.84 C 217.44 119.1 231.3 136.7 206 155.84 Z" fill="#ff9ec4" opacity=".85"/><path class="anim vitcoeur" style="--d:2.2s" d="M 128 189.52 C 109.6 175.6 119.68 162.8 128 173.52 C 136.32 162.8 146.4 175.6 128 189.52 Z" fill="#ffb3d1" opacity=".8"/></g>
  <g transform="translate(204 218) scale(0.88)" opacity=".75"><circle cx="300" cy="306" r="16" fill="#ff9ec4"/><path d="M 286 300 q 14 -8 28 2 M 288 312 q 14 6 26 -4" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M 96 312 q 12 -20 24 0 M 130 318 q 10 -16 20 0" stroke="#5f9e4c" stroke-width="6" fill="none" stroke-linecap="round"/><path class="anim vitcoeur" style="--d:0s" d="M 206 155.84 C 180.7 136.7 194.56 119.1 206 133.84 C 217.44 119.1 231.3 136.7 206 155.84 Z" fill="#ff9ec4" opacity=".85"/><path class="anim vitcoeur" style="--d:2.2s" d="M 128 189.52 C 109.6 175.6 119.68 162.8 128 173.52 C 136.32 162.8 146.4 175.6 128 189.52 Z" fill="#ffb3d1" opacity=".8"/></g>
  <g transform="translate(686 320) scale(0.52)" opacity=".6"><circle cx="300" cy="306" r="16" fill="#ff9ec4"/><path d="M 286 300 q 14 -8 28 2 M 288 312 q 14 6 26 -4" stroke="#ffffff" stroke-width="4" fill="none"/><path d="M 96 312 q 12 -20 24 0 M 130 318 q 10 -16 20 0" stroke="#5f9e4c" stroke-width="6" fill="none" stroke-linecap="round"/><path class="anim vitcoeur" style="--d:0s" d="M 206 155.84 C 180.7 136.7 194.56 119.1 206 133.84 C 217.44 119.1 231.3 136.7 206 155.84 Z" fill="#ff9ec4" opacity=".85"/><path class="anim vitcoeur" style="--d:2.2s" d="M 128 189.52 C 109.6 175.6 119.68 162.8 128 173.52 C 136.32 162.8 146.4 175.6 128 189.52 Z" fill="#ffb3d1" opacity=".8"/></g>
</svg>
