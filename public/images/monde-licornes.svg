<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <style>
    .anim{transform-box:fill-box;transform-origin:center}
    .bat    {animation:bat 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    .respire{animation:respire 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
    .flotte {animation:flotte 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
    .derive {animation:derive 16s linear infinite;animation-delay:var(--d,0s)}
    .aileG  {animation:aileG 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:right center}
    .aileD  {animation:aileD 0.5s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left center}
    .queue  {animation:queue 1.3s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:left bottom}
    .dodeline{animation:dodeline 2.8s ease-in-out infinite;animation-delay:var(--d,0s);
             transform-box:fill-box;transform-origin:center bottom}
    .brille {animation:brille 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un cœur ne fait pas que battre : il paraît, il grossit, il s'efface,
       et un autre prend sa place. */
    .vitcoeur{animation:vitcoeur 6s ease-in-out infinite;animation-delay:var(--d,0s)}
    /* Un nuage TRAVERSE son monde et revient par l'autre bord. Le disque
       découpe l'image : il disparaît donc tout seul en sortant. */
    .traverse{animation:traverse var(--t,22s) linear infinite;animation-delay:var(--d,0s)}
    @keyframes vitcoeur{
      0%   {opacity:0;transform:scale(.35)}
      12%  {opacity:1;transform:scale(1.12)}
      20%  {transform:scale(.96)}
      30%  {transform:scale(1.08)}
      40%  {transform:scale(.98)}
      52%  {opacity:1;transform:scale(1.14)}
      70%  {opacity:.85;transform:scale(1)}
      88%  {opacity:0;transform:scale(.45)}
      100% {opacity:0;transform:scale(.35)}
    }
    @keyframes traverse{
      0%  {transform:translateX(-330px)}
      100%{transform:translateX(330px)}
    }
    @keyframes bat     {0%,100%{transform:scale(1)}18%{transform:scale(1.16)}30%{transform:scale(1.02)}45%{transform:scale(1.10)}}
    @keyframes respire {0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    @keyframes flotte  {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes derive  {0%{transform:translateX(-26px)}50%{transform:translateX(26px)}100%{transform:translateX(-26px)}}
    @keyframes aileG   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes aileD   {0%,100%{transform:scaleX(1)}50%{transform:scaleX(.42) }}
    @keyframes queue   {0%,100%{transform:rotate(-13deg)}50%{transform:rotate(15deg)}}
    @keyframes dodeline{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
    @keyframes brille  {0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
  </style>
  <defs>
    <radialGradient id="c-licornes" cx="36%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#fdeaff"/>
      <stop offset="54%" stop-color="#e8c0fa"/>
      <stop offset="100%" stop-color="#b478d8"/>
    </radialGradient>
    <radialGradient id="h-licornes" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#e0a8ff" stop-opacity="0"/>
      <stop offset="80%" stop-color="#e0a8ff" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#e0a8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="d-licornes"><circle cx="200" cy="200" r="128"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="172" fill="url(#h-licornes)"/>
  <circle cx="200" cy="200" r="128" fill="url(#c-licornes)"/>
  <g clip-path="url(#d-licornes)"><ellipse cx="200" cy="338" rx="190" ry="93" fill="#dcaef2"/><ellipse cx="200" cy="365.9" rx="190" ry="68.2" fill="#ecc8ff"/><path d="M 84 214 a 116 116 0 0 1 232 0" fill="none" stroke="#ff9ec4" stroke-width="11"/><path d="M 95 214 a 105 105 0 0 1 210 0" fill="none" stroke="#ffc48a" stroke-width="11"/><path d="M 106 214 a 94 94 0 0 1 188 0" fill="none" stroke="#fff2a8" stroke-width="11"/><path d="M 117 214 a 83 83 0 0 1 166 0" fill="none" stroke="#bfe8b0" stroke-width="11"/><path d="M 128 214 a 72 72 0 0 1 144 0" fill="none" stroke="#a8d8ff" stroke-width="11"/><path d="M 139 214 a 61 61 0 0 1 122 0" fill="none" stroke="#c9b6ff" stroke-width="11"/><g class="anim derive" opacity="0.92" style="--d:0s"><rect x="86" y="136" width="80" height="24" rx="12" fill="#ffffff"/><circle cx="112.4" cy="135.2" r="20" fill="#ffffff"/><circle cx="138.8" cy="140.8" r="14.399999999999999" fill="#ffffff"/></g><g class="anim derive" opacity="0.85" style="--d:3s"><rect x="246" y="165.8" width="68" height="20.4" rx="10.2" fill="#ffffff"/><circle cx="268.44" cy="165.12" r="17" fill="#ffffff"/><circle cx="290.88" cy="169.88" r="12.24" fill="#ffffff"/></g><g class="anim derive" opacity="0.8" style="--d:6s"><rect x="150" y="282.2" width="92" height="27.599999999999998" rx="13.799999999999999" fill="#ffffff"/><circle cx="180.36" cy="281.28" r="23" fill="#ffffff"/><circle cx="210.72" cy="287.72" r="16.56" fill="#ffffff"/></g><path class="anim bat" style="--d:0.4s" d="M 96 247.52 C 77.6 233.6 87.68 220.8 96 231.52 C 104.32 220.8 114.4 233.6 96 247.52 Z" fill="#ffffff" opacity=".75"/><path class="anim bat" style="--d:1.1s" d="M 306 260.08 C 289.9 247.9 298.72 236.7 306 246.08 C 313.28 236.7 322.1 247.9 306 260.08 Z" fill="#ffffff" opacity=".75"/></g>
  <circle cx="200" cy="200" r="128" fill="none" stroke="#9a5cbc" stroke-opacity=".38" stroke-width="3"/>
  <ellipse cx="153.92000000000002" cy="143.68" rx="33.28" ry="20.48" fill="#ffffff" opacity=".30" transform="rotate(-28 153.92000000000002 143.68)"/>
  <path class="anim brille" style="--d:0.0s" d="M 86 105 Q 86 118 99 118 Q 86 118 86 131 Q 86 118 73 118 Q 86 118 86 105 Z" fill="#ffffff" opacity=".85"/><path class="anim brille" style="--d:0.7s" d="M 318 119 Q 318 130 329 130 Q 318 130 318 141 Q 318 130 307 130 Q 318 130 318 119 Z" fill="#ffffff" opacity=".85"/><path class="anim brille" style="--d:1.4s" d="M 96 290 Q 96 300 106 300 Q 96 300 96 310 Q 96 300 86 300 Q 96 300 96 290 Z" fill="#ffffff" opacity=".85"/>
</svg>
