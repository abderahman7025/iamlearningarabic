<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cr&eacute;er votre compte &mdash; I Am Learning Arabic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gd:#0a2e1e;--gold:#d4a017;--goldc:#f5c842}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(155deg,var(--gd) 0%,#103d25 60%,#0d4a2f 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff}
.card{background:rgba(255,255,255,.05);border:1.5px solid rgba(212,160,23,.22);border-radius:22px;padding:44px 36px;max-width:420px;width:100%}
.logo{font-family:'Scheherazade New',serif;font-size:1.6rem;color:var(--goldc);text-align:center;display:block;margin-bottom:4px;text-decoration:none}
.icon{font-size:3rem;text-align:center;display:block;margin-bottom:8px}
h1{font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:6px}
.sub{text-align:center;font-size:.85rem;color:rgba(255,255,255,.5);margin-bottom:28px;line-height:1.5}
label{display:block;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
input[type=email],input[type=password]{width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(212,160,23,.25);border-radius:12px;padding:13px 18px;font-size:.93rem;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;outline:none;margin-bottom:18px;transition:border-color .2s}
input::placeholder{color:rgba(255,255,255,.3)}
input:focus{border-color:var(--gold)}
input[readonly]{opacity:.6;cursor:default}
.submit{width:100%;background:var(--gold);color:var(--gd);border:none;border-radius:12px;padding:14px;font-size:.97rem;font-weight:800;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .2s}
.submit:hover{background:var(--goldc)}
.submit:disabled{opacity:.5;cursor:default}
.errmsg{color:#ff8a8a;font-size:.8rem;margin:-10px 0 14px;display:none}
.success-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:12px;padding:16px;text-align:center;color:#86efac;display:none}
.success-box h2{font-size:1.2rem;margin-bottom:8px}
.success-box p{font-size:.85rem;opacity:.8;line-height:1.5}
.success-box .go{display:inline-block;margin-top:16px;background:var(--gold);color:var(--gd);font-weight:800;font-size:.95rem;padding:12px 28px;border-radius:50px;text-decoration:none;transition:background .2s}
.success-box .go:hover{background:var(--goldc)}
.pw-hint{font-size:.75rem;color:rgba(255,255,255,.35);margin:-12px 0 16px}
  </style>
</head>
<body>

<div class="card">
  <a href="/" class="logo">&#x644;&#x650;&#x646;&#x064E;&#x062A;&#x064E;&#x639;&#x064E;&#x644;&#x064E;&#x651;&#x0645;&#x650; &#x0627;&#x0644;&#x0652;&#x0639;&#x064E;&#x0631;&#x064E;&#x0628;&#x0650;&#x064A;&#x064E;&#x651;&#x0629;</a>

  <div id="main-form">
    <span class="icon">&#x1F31F;</span>
    <h1>Bienvenue !</h1>
    <p class="sub">Votre paiement a &eacute;t&eacute; valid&eacute;. Cr&eacute;ez maintenant votre mot de passe pour acc&eacute;der &agrave; l&rsquo;application.</p>

    <p class="errmsg" id="reg-err"></p>

    <label>Email</label>
    <input type="email" id="reg-email" placeholder="votre@email.com" autocomplete="email" readonly>

    <label>Mot de passe</label>
    <input type="password" id="reg-pw" placeholder="Au moins 6 caract&egrave;res" autocomplete="new-password">
    <p class="pw-hint">Minimum 6 caract&egrave;res</p>

    <label>Confirmer le mot de passe</label>
    <input type="password" id="reg-pw2" placeholder="R&eacute;p&eacute;tez le mot de passe" autocomplete="new-password">

    <button class="submit" id="reg-btn" onclick="doRegister()">Cr&eacute;er mon compte &rarr;</button>
  </div>

  <div class="success-box" id="success-box">
    <h2>&#x1F389; Compte cr&eacute;&eacute; !</h2>
    <p>Votre compte est actif. Bonne chance dans votre apprentissage !</p>
    <a href="/app" class="go">Acc&eacute;der &agrave; l&rsquo;application &rarr;</a>
  </div>
</div>

<script>
/* Pre-fill email from URL param */
(function(){
  var p = new URLSearchParams(location.search);
  var email = p.get('email');
  if(email){
    document.getElementById('reg-email').value = decodeURIComponent(email);
  }
  /* If already logged in, go to app */
  if(localStorage.getItem('arab_token')) window.location.replace('/app');
  /* session_id param = retour depuis embedded checkout Stripe (paiement ok) */
  /* Le webhook Stripe a déjà enregistré le user, on peut juste créer le mot de passe */
})();

async function doRegister(){
  var email = document.getElementById('reg-email').value.trim();
  var pw    = document.getElementById('reg-pw').value;
  var pw2   = document.getElementById('reg-pw2').value;
  var errEl = document.getElementById('reg-err');
  var btn   = document.getElementById('reg-btn');
  errEl.style.display='none';
  if(!email){ errEl.textContent='Email manquant. Utilisez le lien reçu par email.'; errEl.style.display='block'; return; }
  if(pw.length < 6){ errEl.textContent='Le mot de passe doit contenir au moins 6 caractères.'; errEl.style.display='block'; return; }
  if(pw !== pw2){ errEl.textContent='Les mots de passe ne correspondent pas.'; errEl.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Création...';
  try{
    var r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})});
    var d = await r.json();
    if(d.success){
      /* Auto-login */
      var lr = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})});
      var ld = await lr.json();
      if(ld.success){
        localStorage.setItem('arab_token',ld.token);
        localStorage.setItem('arab_email',ld.email);
      }
      document.getElementById('main-form').style.display='none';
      document.getElementById('success-box').style.display='block';
    }else{
      errEl.textContent = d.error||'Erreur. Contactez le support.'; errEl.style.display='block';
      btn.disabled=false; btn.textContent='Créer mon compte →';
    }
  }catch(err){
    errEl.textContent='Erreur réseau. Réessayez.'; errEl.style.display='block';
    btn.disabled=false; btn.textContent='Créer mon compte →';
  }
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter') doRegister();
});
</script>
</body>
</html>
