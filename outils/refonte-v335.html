<!-- ════════════════════════════════════════════════════════════════════
     v3.3.5 (18 octobre) — source : outils/refonte-v335.html, copiée TELLE
     QUELLE dans app/app.html juste après le bloc v3.3.4.
     ESSAI (adulte) : dans chaque rubrique, tout ce qui est DORÉ (boutons,
     médaillons, titres, barres, bordures, lueurs) prend la couleur de la
     rubrique — bleu (Introduction), vert (Exercices), violet (Bonus),
     rose-rouge (Contact) ; Leçons reste or.
     Comment : les styles calculés des éléments de la page (et de la barre du
     haut) sont lus ; chaque couleur « or » (teinte 28-56°, assez saturée, ni
     crème très clair ni brun très foncé) est tournée vers la teinte de la
     rubrique, luminosité et transparence gardées, et posée en style en
     ligne. Refait à chaque changement du contenu ; tout est rendu en
     quittant la rubrique. Les ::before/::after (médaillons, étoiles des
     coins) : une règle par élément dans une feuille dédiée ; les couleurs
     écrites en hexadécimal dans les dessins SVG intégrés sont tournées aussi.
     ════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  var TEINTE={intro:213,exercises:160,bonus:272,contact:350};
  var PROPS=['color','background-color','border-top-color','border-right-color','border-bottom-color','border-left-color',
    'background-image','box-shadow','text-shadow','fill','stroke','-webkit-text-fill-color','outline-color'];
  var faits=[];   /* [el, prop, ancienne valeur en ligne, ancienne priorité] */
  function hsl(r,g,b){r/=255;g/=255;b/=255;var M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,h=0,s=0,d=M-m;
    if(d){s=l>.5?d/(2-M-m):d/(M+m);h=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s,l];}
  function rgb(h,s,l){function f(n){var k=(n+h/30)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));}
    return [f(0),f(8),f(4)];}
  function tourneHex(h6,cible){
    var r=parseInt(h6.slice(0,2),16),g=parseInt(h6.slice(2,4),16),b=parseInt(h6.slice(4,6),16),x=hsl(r,g,b);
    if(x[0]<28||x[0]>56||x[1]<.35||x[2]<.16||x[2]>.86)return null;
    return rgb(cible,Math.min(1,x[1]*.92),x[2]).map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');
  }
  function tourne(val,cible){
    var change=false;
    val=val.replace(/(%23|#)([0-9a-fA-F]{6})(?![0-9a-fA-F])/g,function(t,pre,h){var n=tourneHex(h,cible);if(!n)return t;change=true;return pre+n;});
    var out=val.replace(/rgba?\(([^)]+)\)/g,function(t,c){
      var p=c.split(/[\s,\/]+/).filter(Boolean).map(parseFloat);if(p.length<3)return t;
      var x=hsl(p[0],p[1],p[2]);
      if(x[0]<28||x[0]>56||x[1]<.35||x[2]<.16||x[2]>.86)return t;
      change=true;
      var n=rgb(cible,Math.min(1,x[1]*.92),x[2]);
      return p.length>3?'rgba('+n.join(',')+','+p[3]+')':'rgb('+n.join(',')+')';
    });
    return change?out:null;
  }
  var feuille=null,regles=[],nPseudo=0;
  function pseudos(el,cible){
    ['::before','::after'].forEach(function(ps){
      var cs=getComputedStyle(el,ps);if(!cs||cs.content==='none'||cs.content==='normal')return;
      var r=[];
      PROPS.forEach(function(p){var v=cs.getPropertyValue(p);if(!v||v==='none'||(v.indexOf('rgb')<0&&v.indexOf('%23')<0&&v.indexOf('#')<0))return;
        var n=tourne(v,cible);if(n)r.push(p+':'+n+'!important');});
      if(!r.length)return;
      if(!el.dataset.tz){el.dataset.tz='z'+(++nPseudo);faits.push([el,'data-tz',null,null]);}
      regles.push('[data-tz="'+el.dataset.tz+'"]'+ps+'{'+r.join(';')+'}');
    });
  }
  function rends(){
    regles=[];if(feuille)feuille.textContent='';
    for(var i=faits.length-1;i>=0;i--){var f=faits[i];if(f[1]==='data-tz'){try{delete f[0].dataset.tz;}catch(e){}continue;}try{f[0].style.setProperty(f[1],f[2],f[3]);if(!f[2])f[0].style.removeProperty(f[1]);}catch(e){}}
    faits=[];
  }
  function peint(el,cible){
    if(el._teinte===cible)return;
    var cs=getComputedStyle(el);
    PROPS.forEach(function(p){
      var v=cs.getPropertyValue(p);if(!v||v==='none'||(v.indexOf('rgb')<0&&v.indexOf('%23')<0))return;
      var n=tourne(v,cible);if(!n)return;
      faits.push([el,p,el.style.getPropertyValue(p),el.style.getPropertyPriority(p)]);
      el.style.setProperty(p,n,'important');
    });
    pseudos(el,cible);
    el._teinte=cible;
  }
  var page=null,tm=null;
  function passe(){
    tm=null;
    var root=document.getElementById('root'),ca=document.getElementById('ca');
    var p=(root&&root.classList.contains('profile-adult')&&ca&&!ca.closest('[hidden]'))?ca.dataset.page:null;
    var cible=TEINTE[p];
    if(p!==page){rends();[].forEach.call(document.querySelectorAll('#ca *,#topbar *'),function(e){e._teinte=null;});page=p;}
    if(cible==null)return;
    var L=[].slice.call(document.querySelectorAll('#ca *,#topbar *'));
    obs.disconnect();
    var avant=regles.length;
    L.forEach(function(e){try{peint(e,cible);}catch(x){}});
    if(regles.length!==avant){
      if(!feuille){feuille=document.createElement('style');feuille.id='teinte-rubrique';document.head.appendChild(feuille);}
      feuille.textContent=regles.join('\n');
    }
    branche();
  }
  function plusTard(){if(!tm)tm=setTimeout(passe,80);}
  var obs=new MutationObserver(plusTard);
  function branche(){
    var ca=document.getElementById('ca'),tb=document.getElementById('topbar');
    if(ca)obs.observe(ca,{childList:true,subtree:true,attributes:true,attributeFilter:['data-page','class']});
    if(tb)obs.observe(tb,{childList:true,subtree:true});
    var r=document.getElementById('root');if(r)obs.observe(r,{attributes:true,attributeFilter:['class']});
  }
  function demarre(){if(!document.getElementById('ca')){setTimeout(demarre,300);return;}branche();plusTard();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',demarre);else demarre();
})();
</script>
