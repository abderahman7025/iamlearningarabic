<!-- ════════════════════════════════════════════════════════════════════
     v3.2.3 (18 octobre) — source : outils/refonte-v323.html, copiée TELLE
     QUELLE dans app/app.html juste après le bloc v3.2.2.
     1. « Changer d'interface » : le texte centré dans le bouton.
     2. La suite d'une lettre (« Lettre suivante » / « Cours suivant ») ne
        paraît qu'à la FIN de l'entraînement.
     3. L'arabe glissé dans une phrase française (ou d'une autre langue) :
        plus gros, et détaché du mot d'avant.
     4. LECTURE AUTOMATIQUE (ados/adultes) : le Narrateur lit les textes de
        la page l'un après l'autre. Même règle qu'au clic : toucher le texte
        en cours = pause, retoucher = reprise au début de la phrase entamée ;
        changer de page arrête tout. Couper le son = lire seul.
     5. Le bouton « Alerter » en bas à droite : capture d'écran + message,
        envoyés au propriétaire (POST /api/audio {alerte}, voir api/_alerte.js).
     ════════════════════════════════════════════════════════════════════ -->
<style>
/* 1 — le texte au milieu du bouton, l'icône calée à gauche */

   comme « Déconnexion » */

/* 2 — la suite, après l'entraînement */
.fin-lettre{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px auto 4px;max-width:520px}
.fin-lettre:empty{display:none}

.liste-lecons{width:100%;max-width:520px;border-radius:99px;padding:12px 20px;cursor:pointer;
  font:700 .95rem Outfit,system-ui,sans-serif;color:#7a4a00;background:#fffaf0;
  border:1.5px solid rgba(184,134,11,.45);box-shadow:0 4px 0 rgba(184,134,11,.25);transition:translate .12s,box-shadow .12s}
.liste-lecons:active{translate:0 3px;box-shadow:0 1px 0 rgba(184,134,11,.25)}
.liste-lecons:focus-visible{outline:2px solid #b8860b;outline-offset:3px}

/* 3 — l'arabe dans une phrase */
.ar-in{font-family:'Scheherazade New','Amiri',serif;font-size:1.75em;line-height:.9;vertical-align:-.12em;
  unicode-bidi:isolate;margin:0 .12em;font-weight:700;letter-spacing:0}
.ar-in.ar-colle{margin-left:.32em}
/* le signe réel est caché (taille 0) : le cercle ET le signe sont dessinés
   ensemble par ::before, pour que le signe se pose bien sur le cercle */
.ar-in.ar-signe{font-size:0!important;margin:0 .25em}
/* v3.2.7 — la ligne d'écriture : un trait FIN dessiné par ::after, posé sur
   la ligne de base du texte français (un bloc vide aligné sur la ligne de
   base y pose son bord bas), un peu plus large que le signe. La voyelle, en
   gras, est écrite sur un tatwîl (ـ) — c'est lui qui la place au-dessus ou
   au-dessous, comme sur une lettre — mais le tatwîl est EFFACÉ par un masque
   (bande transparente à sa hauteur) : on ne voit que la voyelle et le trait. */
.ar-in.ar-signe{position:relative;margin:0 2px}
.ar-in.ar-signe::after{content:'';display:inline-block;width:18px;height:1.3px;background:currentColor;opacity:.7;vertical-align:baseline}
.ar-in.ar-signe::before{content:'\0640' attr(data-s);position:absolute;left:50%;bottom:-16px;translate:-50% 0;padding:10px 0;
  font-family:'Scheherazade New',serif;font-weight:700;font-size:26px;line-height:1;white-space:nowrap;
  -webkit-mask-image:linear-gradient(#000 0 27px,transparent 27px 32.5px,#000 32.5px);mask-image:linear-gradient(#000 0 27px,transparent 27px 32.5px,#000 32.5px)}
/* les mots longs (4 lettres et plus) un peu moins grands */
.ar-in.ar-long{font-size:1.4em}

/* 4 — le texte que le Narrateur est en train de lire */

  border-radius:14px;transition:box-shadow .3s}

  font:800 .85rem Outfit,system-ui,sans-serif;color:#fff;
  background:linear-gradient(160deg,#ff7a59,#d9343f);box-shadow:0 5px 0 #8f1f28,0 12px 24px rgba(160,30,40,.35),inset 0 2px 0 rgba(255,255,255,.35);
  transition:translate .12s,box-shadow .12s,opacity .3s}

  border:1.5px solid rgba(184,134,11,.4);background:#fff;color:#3a2600;font:500 .95rem Outfit,system-ui,sans-serif;resize:vertical}

.alerte-btns{display:flex;gap:10px;margin-top:12px}

  font:700 .85rem Outfit,system-ui,sans-serif;color:#7a4a00;background:#fff;border:1.5px solid rgba(184,134,11,.35);transition:all .15s}
.alerte-canaux button.on{color:#fff;background:linear-gradient(160deg,#e8a020,#b8860b);border-color:#b8860b;box-shadow:0 3px 0 #8a5c00}

  background:#fff;color:#3a2600;font:500 .95rem Outfit,system-ui,sans-serif}

.alerte-btns button:disabled{opacity:.6;cursor:default}
.alerte-msg{position:fixed;left:50%;bottom:90px;translate:-50% 0;z-index:10060;max-width:88vw;padding:12px 18px;border-radius:16px;
  background:#2a1a00;color:#fff;font:700 .9rem Outfit,system-ui,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.3);text-align:center}
</style>
<script>
(function(){
  function adulte(){try{return st.profile!=='girl'&&st.profile!=='boy';}catch(e){return false;}}
  function langue(){try{return st.lang||'fr';}catch(e){return 'fr';}}

  /* ── 3. L'ARABE DANS UNE PHRASE ──────────────────────────────────────
     On ENVELOPPE, on ne change pas le texte : `textContent` reste le même
     (c'est la clé de l'enregistrement, voir `_clesSon`). L'espace avec le
     mot d'avant est donc une marge, pas un caractère. */
  var AR='[\\u0600-\\u06FF\\u0750-\\u077F\\u08A0-\\u08FF\\uFB50-\\uFDFF\\uFE70-\\uFEFF]';
  var reAr=new RegExp(AR), reRun=new RegExp(AR+'+(?:[\\s\\u00A0]+'+AR+'+)*','g');
  var reAutre=/[A-Za-zÀ-ɏЀ-ӿऀ-ॿ぀-ヿ一-鿿]/;
  var POLICE_AR=/scheherazade|amiri|naskh|kufi|arab|lateef|reem|cairo|tajawal/i;
  var EXCLU='.ar-in,script,style,textarea,input,select,svg,canvas,[contenteditable],.no-ar-in,.fleur3d,.pos-c';
  /* v3.2.6 — « اللَّه » s'affiche « الله » : la police dessine elle-même la
     chadda et le petit alif ; écrites en plus, elles faisaient doublon. La
     clé des voix n'en souffre pas (`_clesSon` cherche les deux). */
  var reAllah=/([\u0627\u0671])\u0644\u0644(?:\u064e\u0651|\u0651\u064e)\u0647/g;
  function allah(root){
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n;
    while((n=w.nextNode())){if(reAllah.test(n.nodeValue)){reAllah.lastIndex=0;n.nodeValue=n.nodeValue.replace(reAllah,'$1\u0644\u0644\u0647');}reAllah.lastIndex=0;}
  }
  function arabeDansPhrases(root){
    try{if(root&&adulte())allah(root);}catch(e){}
    if(!root||!adulte()||langue()==='ur')return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),L=[];
    while(w.nextNode()){
      var n=w.currentNode,v=n.nodeValue;
      if(!v||!reAr.test(v))continue;
      var p=n.parentElement;if(!p||p.closest(EXCLU))continue;
      var cs=getComputedStyle(p);
      if(POLICE_AR.test(cs.fontFamily))continue;          // déjà en police arabe : voulu
      if(parseFloat(cs.fontSize)>26)continue;              // déjà grand
      if(reAutre.test(v)){L.push(n);continue;}
      /* Arabe seul dans un <b>/<span> au milieu d'une phrase : « le ل » */
      if(v.trim().length<=14&&/^(B|STRONG|EM|I|SPAN|U)$/.test(p.tagName)){
        var bloc=p.parentElement;
        if(bloc&&reAutre.test(bloc.textContent||''))L.push(n);
      }
    }
    L.forEach(function(n){
      var v=n.nodeValue,frag=document.createDocumentFragment(),last=0,m;
      reRun.lastIndex=0;
      while((m=reRun.exec(v))){
        if(m.index>last)frag.appendChild(document.createTextNode(v.slice(last,m.index)));
        var s=document.createElement('span');
        var avant=m.index>0?v[m.index-1]:(n.previousSibling&&n.previousSibling.textContent||'').slice(-1);
        s.className='ar-in'+(avant&&!/[\s(«"'’ ]/.test(avant)?' ar-colle':'');
        /* un signe seul (ّ, ْ…) : posé sur un cercle pointillé, ajouté par le
           CSS — le texte, lui, ne change pas. */
        if(/^[\u064B-\u0652\u0670\s]+$/.test(m[0])){s.className+=' ar-signe';s.setAttribute('data-s',m[0].trim());}
        else if((m[0].match(/[\u0621-\u064A]/g)||[]).length>=4)s.className+=' ar-long';
        s.textContent=m[0];frag.appendChild(s);last=m.index+m[0].length;
      }
      if(last<v.length)frag.appendChild(document.createTextNode(v.slice(last)));
      if(n.parentNode)n.parentNode.replaceChild(frag,n);
    });
  }
  window._arabeDansPhrases=arabeDansPhrases;

  /* ── 4. LECTURE AUTOMATIQUE ──────────────────────────────────────────
     Les textes lisibles d'une page sont ceux dont le clic appelle
     `speakText`. Pour savoir CE qu'ils diraient sans rien jouer, on appelle
     leur `onclick` une fois, voix coupées (`capt`), et on ne garde que ce
     qui a un enregistrement : jamais la voix du navigateur en lecture
     automatique. */
  var AL={q:[],i:-1,cur:null,auto:false,attente:0,page:''};
  window._lectureAuto=AL;
  var capt=null;
  /* Ce bloc est lu AVANT le script principal : on se branche une fois la
     page chargée, sinon la déclaration de `speakText` nous écraserait. */
  function crochets(){
    if(window.speakText&&window.speakText._v323)return;
    var _vraiSpeakText=window.speakText,_vraiSpeak=window.speak,_vraiToggle=window.toggleSound;
    if(typeof _vraiSpeakText!=='function'){setTimeout(crochets,300);return;}
    window.speakText=function(txt,lang,el){
      if(capt){capt.push(String(txt));return;}
      if(AL.auto&&!el)el=AL.cur;
      return _vraiSpeakText.call(this,txt,lang,el);
    };
    window.speakText._v323=1;
    if(typeof _vraiSpeak==='function')window.speak=function(){if(capt)return;return _vraiSpeak.apply(this,arguments);};
    /* Le son remis : on reprend la lecture de la page. */
    if(typeof _vraiToggle==='function')window.toggleSound=function(){
      var r=_vraiToggle.apply(this,arguments);
      if(!st.soundOn)arret();else setTimeout(function(){try{construit();}catch(e){}},600);
      return r;
    };
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',crochets);else crochets();
  var NAV=/navToPage|openLesson|startExercise|showS\(|renderPage|location|handleBack|_showFinish|renderSessions|logout/;
  var faux={preventDefault:function(){},stopPropagation:function(){},stopImmediatePropagation:function(){}};
  function ceQuIlDit(e){
    var f=e.onclick;if(typeof f!=='function')return null;
    var src=String(f);if(src.indexOf('speakText')<0||NAV.test(src))return null;
    capt=[];
    var _jo=window._joueSon,_pc=window.playChildSound;
    window._joueSon=function(){return null;};window.playChildSound=function(){};
    try{f.call(e,Object.assign({currentTarget:e,target:e},faux));}catch(x){}
    window._joueSon=_jo;window.playChildSound=_pc;
    var c=capt;capt=null;
    try{if(e.style.opacity==='0.6'||e.style.opacity==='0.4')e.style.opacity='1';}catch(x){}
    return c.length?c[0]:null;
  }
  function visible(e){return !!(e.offsetWidth||e.offsetHeight||e.getClientRects().length);}
  function surligne(e){
    document.querySelectorAll('.lecture-en-cours').forEach(function(x){if(x!==e)x.classList.remove('lecture-en-cours');});
    if(e)e.classList.add('lecture-en-cours');
  }
  function arret(){AL.q=[];AL.i=-1;AL.cur=null;surligne(null);}
  window._lectureAutoArret=arret;
  function pageExclue(){
    var ca=document.getElementById('ca');var p=(ca&&ca.dataset.page)||'';
    try{if(st._curPage==='exercise'||p==='exercises'||st._curPage==='exercises')return true;}catch(e){}
    return false;
  }
  function construit(){
    arret();
    var ca=document.getElementById('ca'),scr=document.getElementById('s-main');
    if(!ca||!scr||!scr.classList.contains('on'))return;
    if(!adulte()||!st.soundOn||pageExclue())return;
    if(document.querySelector('.alerte-voile,.nav-voile'))return;
    var vus={},q=[];
    ca.querySelectorAll('*').forEach(function(e){
      if(!e.onclick||!visible(e))return;
      var t=ceQuIlDit(e);if(!t)return;
      var k=t.replace(/\s+/g,' ').trim();if(!k||vus[k])return;
      try{if(!_sonEnregistre(t))return;}catch(x){return;}
      /* un texte DANS un autre déjà retenu : le parent suffit */
      if(q.some(function(p){return p.contains(e);}))return;
      vus[k]=1;q.push(e);
    });
    AL.q=q;AL.i=-1;AL.page=cle();
    if(q.length)suivant();
  }
  /* v3.3.7 — en quittant la page (menu, retour, autre rubrique), la
     lecture automatique continuait : les textes de l'ancienne page restent
     dans le document (écran caché), la surveillance passait au suivant et
     le son repartait. On note la page au départ et l'on s'arrête dès
     qu'elle change ou que l'écran est caché. */
  function cle(){
    var ca=document.getElementById('ca'),s='';
    try{s=((ca&&ca.dataset.page)||'')+'|'+(st._curPage||'')+'|'+((st.curLesson&&st.curLesson.id)||'');}catch(e){}
    return s;
  }
  function horsPage(){
    var scr=document.getElementById('s-main');
    return !scr||!scr.classList.contains('on')||AL.page!==cle();
  }
  function coupe(){
    var jouait=false;try{jouait=!!(_rec&&_rec.el&&AL.q.indexOf(_rec.el)>=0);}catch(e){}
    arret();
    if(jouait)try{stopSpeech();}catch(e){}
  }
  function suivant(){
    if(horsPage()){coupe();return;}
    var k=AL.i+1;
    while(k<AL.q.length&&!AL.q[k].isConnected)k++;
    if(k>=AL.q.length){arret();return;}
    AL.i=k;var e=AL.q[k];AL.cur=e;
    var r=e.getBoundingClientRect();
    if(r.bottom<60||r.top>innerHeight-60)try{e.scrollIntoView({behavior:'smooth',block:'center'});}catch(x){}
    AL.auto=true;
    try{e.onclick.call(e,Object.assign({currentTarget:e,target:e},faux));}catch(x){}
    AL.auto=false;
    surligne(e);AL.attente=Date.now();
  }
  /* La surveillance : fin d'un texte → le suivant ; un clic sur un autre
     texte de la liste → on continue À PARTIR de lui ; pause → on attend. */
  setInterval(function(){
    if(!AL.q.length)return;
    if(horsPage()){coupe();return;}
    var e=AL.q[AL.i];
    if(!e||!e.isConnected||!st.soundOn||!adulte()){arret();return;}
    if(typeof _rec==='undefined')return;
    if(_rec.el===e){surligne(e);return;}                 // en cours, ou en pause
    if(_rec.el){var j=AL.q.indexOf(_rec.el);
      if(j>=0){AL.i=j;AL.cur=_rec.el;surligne(_rec.el);}
      return;}                                           // l'élève écoute autre chose
    if(Date.now()-AL.attente<700)return;                 // le son démarre
    if(!AL.pause){AL.pause=Date.now();return;}           // un souffle entre deux textes
    if(Date.now()-AL.pause<450)return;
    AL.pause=0;suivant();
  },250);

  /* Le déclencheur : un nouveau contenu dans #ca. On attend que la page
     soit posée (les apparitions durent environ une seconde). */
  var tLect=null,tAr=null;
  function surChangement(muts){
    clearTimeout(tAr);tAr=setTimeout(function(){try{arabeDansPhrases(document.getElementById('ca'));}catch(e){}},90);
    var neuf=muts.some(function(m){return m.type==='childList'&&m.target.id==='ca'&&m.addedNodes.length;})
          ||muts.some(function(m){return m.type==='attributes';});
    if(!neuf)return;
    /* la lettre suivante, les onglets… : si le texte lu a disparu, on
       repart de la nouvelle page. */
    if(AL.cur&&AL.cur.isConnected)return;
    clearTimeout(tLect);tLect=setTimeout(function(){try{construit();}catch(e){}},1400);
  }
  function branche(){
    var ca=document.getElementById('ca');if(!ca){setTimeout(branche,400);return;}
    new MutationObserver(surChangement).observe(ca,{childList:true,subtree:true,attributes:true,attributeFilter:['data-page']});
  }
  branche();

  /* ── 5. ALERTER ──────────────────────────────────────────────────────── */
  var ICONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.5L4.5 15.5h15L18 12.5V9a6 6 0 0 0-6-6z" fill="rgba(255,255,255,.22)"/><path d="M9.8 18.5a2.3 2.3 0 0 0 4.4 0"/><path d="M12 7.2v3.6"/><circle cx="12" cy="13" r=".6" fill="currentColor"/></svg>';
  var btn=document.createElement('button');btn.type='button';btn.className='alerte-btn';
  function libelle(){btn.innerHTML=ICONE+'<span>'+te('Alerter')+'</span>';btn.setAttribute('aria-label',te("Tu n'as pas compris quelque chose ?"));}
  function place(){
    if(!document.body.contains(btn))document.body.appendChild(btn);
    var scr=document.getElementById('s-main');
    var ok=!!(scr&&scr.classList.contains('on')&&adulte()&&!document.querySelector('.alerte-voile'));
    document.body.classList.toggle('alerte-ok',ok);
    var ca=document.getElementById('ca');
    document.body.classList.toggle('alerte-haut',!!(ca&&ca.dataset.page==='contact'));
    if(btn._lang!==langue()){btn._lang=langue();libelle();}
  }
  setInterval(place,700);
  function toast(t){var d=document.createElement('div');d.className='alerte-msg';d.textContent=t;document.body.appendChild(d);
    setTimeout(function(){d.style.transition='opacity .4s';d.style.opacity='0';setTimeout(function(){d.remove();},450);},3200);}
  /* La capture : html-to-image, qui fait dessiner la page PAR LE
     NAVIGATEUR (une image SVG) — html2canvas, lui, refait le rendu et
     échoue sur les couleurs modernes (color-mix) de nos styles. */
  var _hti=null;
  function outilCapture(){
    if(window.htmlToImage)return Promise.resolve(window.htmlToImage);
    if(_hti)return _hti;
    /* v3.3.1 — sur le téléphone du client le CDN ne se chargeait pas
       (« outil : non chargé ») : copie servie par le site d'abord, le CDN
       en secours. */
    function charge(src){return new Promise(function(ok,ko){var s=document.createElement('script');s.src=src;
      s.onload=function(){window.htmlToImage?ok(window.htmlToImage):ko(new Error('vide'));};
      s.onerror=function(){s.remove();ko(new Error('non chargé : '+src));};document.head.appendChild(s);});}
    _hti=charge('/html-to-image.js?v=1.11.11')
      .catch(function(){return charge('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js');})
      .catch(function(e){_hti=null;throw e;});
    return _hti;
  }
  function capture(){
    var k=Math.min(window.devicePixelRatio||1,1100/Math.max(1,innerWidth),1.5);
    return outilCapture().then(function(h){
      var o={pixelRatio:k,quality:.72,cacheBust:false,width:innerWidth,height:innerHeight,skipFonts:false,
        style:{width:innerWidth+'px',height:innerHeight+'px',overflow:'hidden'},
        backgroundColor:getComputedStyle(document.body).backgroundColor||'#fff8ec',
        filter:function(n){return !(n.classList&&(n.classList.contains('alerte-btn')||n.classList.contains('alerte-msg')||n.classList.contains('alerte-voile')||n.id==='bandeau-consentement'));}};
      /* Le contenu défilé (#ca) : la copie repartirait du haut. On le
         décale le temps de la capture, pour montrer ce que l'élève voit. */
      var ca=document.getElementById('ca'),y=ca?ca.scrollTop:0,av=ca&&ca.style.cssText;
      if(ca&&y){ca.style.overflow='hidden';ca.scrollTop=0;
        [].forEach.call(ca.children,function(c){c.style.translate='0 '+(-y)+'px';});}
      function remet(){if(ca&&y){[].forEach.call(ca.children,function(c){c.style.translate='';});
        ca.style.cssText=av;ca.scrollTop=y;}}
      /* v3.3.1 — sur le téléphone du client la capture revenait VIDE
         (« Pas de capture »). Deuxième essai sans les polices (le plus
         lourd à copier), et la raison de l'échec part avec l'alerte. */
      var o2=Object.assign({},o,{skipFonts:true,pixelRatio:1,imagePlaceholder:'data:image/gif;base64,R0lGODlhAQABAAAAACw='});
      function essai(opt){return Promise.race([h.toJpeg(document.body,opt),
        new Promise(function(_,ko){setTimeout(function(){ko(new Error('trop long'));},12000);})])
        .then(function(u){if(!/^data:image\/jpeg;base64,./.test(u||''))throw new Error('image vide ('+String(u||'').slice(0,20)+')');return u;});}
      return essai(o).catch(function(e){_capErr='1: '+((e&&(e.message||e.type))||e);return essai(o2);})
        .then(function(u){remet();return u;},function(e){remet();_capErr+=' | 2: '+((e&&(e.message||e.type))||e);return '';});
    }).catch(function(e){_capErr='outil: '+((e&&(e.message||e.type))||e||'non chargé');return '';});
  }
  var _capErr='';
  function ouLonEst(){
    var ca=document.getElementById('ca'),tt=document.getElementById('tb-title');
    var s='';try{s=(st._curPage||'')+(ca&&ca.dataset.page?' · '+ca.dataset.page:'');}catch(e){}
    try{if(st.curLesson&&(st._curPage==='lesson'||(ca&&ca.dataset.page==='lesson')))s+=' · '+(st.curLesson.title||st.curLesson.name||('cours '+st.curLesson.id));}catch(e){}
    var t=tt&&tt.textContent.trim();if(t)s+=' · « '+t+' »';
    var lt=document.querySelector('#ca .ltab.on');if(lt)s+=' · '+lt.textContent.trim();
    return s;
  }
  btn.onclick=function(){
    try{stopSpeech();}catch(e){}arret();
    btn.disabled=true;_capErr='';
    capture().then(function(img){
      btn.disabled=false;
      var v=document.createElement('div');v.className='alerte-voile';
      v.innerHTML='<div class="alerte-boite" role="dialog" aria-modal="true">'
        +'<h3>'+te("Tu n'as pas compris quelque chose ?")+'</h3>'
        +'<p>'+te("Dis-nous ce qui te bloque (facultatif). Une capture de l'écran est jointe.")+'</p>'
        +(img?'<img alt="" src="'+img+'">':'')
        +'<textarea maxlength="1500"></textarea>'
        /* v3.2.8 — l'élève choisit OÙ on lui répond ; l'alerte part sur ce
           seul canal (plus de triple envoi). Choix gardé pour la fois suivante. */
        +'<div class="alerte-canal-t">'+te("Comment veux-tu qu'on te réponde ?")+'</div>'
        +'<div class="alerte-canaux" role="radiogroup">'
        +[['email',te('E-mail'),'✉️'],['whatsapp','WhatsApp','🟢'],['telegram','Telegram','✈️']].map(function(c){
          return '<button type="button" role="radio" data-c="'+c[0]+'"><span aria-hidden="true">'+c[2]+'</span>'+c[1]+'</button>';}).join('')
        +'</div>'
        +'<input class="alerte-contact" type="text" maxlength="60" autocomplete="off">'
        +'<div class="alerte-aide"></div>'
        +'<div class="alerte-btns"><button type="button" class="alerte-annule">'+te('Annuler')+'</button>'
        +'<button type="button" class="alerte-envoi">'+te('Envoyer')+'</button></div></div>';
      document.body.appendChild(v);place();
      var ta=v.querySelector('textarea'),env=v.querySelector('.alerte-envoi');
      var champ=v.querySelector('.alerte-contact'),aide=v.querySelector('.alerte-aide'),canal='email',contacts={};
      try{canal=localStorage.getItem('alerte_canal')||'email';contacts=JSON.parse(localStorage.getItem('alerte_contacts')||'{}');}catch(e){}
      function choisit(c){
        if(champ.value.trim())contacts[canal]=champ.value.trim();
        canal=c;
        [].forEach.call(v.querySelectorAll('.alerte-canaux button'),function(b){var on=b.dataset.c===c;b.classList.toggle('on',on);b.setAttribute('aria-checked',on?'true':'false');});
        champ.style.display=c==='email'?'none':'block';
        champ.placeholder=c==='whatsapp'?te('Ton numéro WhatsApp (ex. +33 6 12 34 56 78)'):te('Ton pseudo Telegram (ex. @prenom)');
        champ.inputMode=c==='whatsapp'?'tel':'text';
        champ.value=contacts[c]||'';champ.classList.remove('manque');
        aide.textContent=c==='email'?te("On te répondra à l'adresse e-mail de ton compte."):'';
      }
      [].forEach.call(v.querySelectorAll('.alerte-canaux button'),function(b){b.onclick=function(){choisit(b.dataset.c);};});
      choisit(canal);
      setTimeout(function(){try{ta.focus();}catch(e){}},80);
      function ferme(){v.remove();place();}
      v.querySelector('.alerte-annule').onclick=ferme;
      v.addEventListener('click',function(e){if(e.target===v)ferme();});
      env.onclick=function(){
        var contact=champ.value.trim();
        if(canal!=='email'&&!contact){champ.classList.add('manque');try{champ.focus();}catch(e){}return;}
        if(contact)contacts[canal]=contact;
        try{localStorage.setItem('alerte_canal',canal);localStorage.setItem('alerte_contacts',JSON.stringify(contacts));}catch(e){}
        env.disabled=true;env.textContent=te('Envoi…');
        var tok='';try{tok=localStorage.getItem('arab_token')||'';}catch(e){}
        fetch(API_URL+'/api/audio',{method:'POST',credentials:'same-origin',
          headers:Object.assign({'Content-Type':'application/json'},tok?{Authorization:'Bearer '+tok}:{}),
          body:JSON.stringify({alerte:{canal:canal,contact:contact,message:ta.value.trim(),page:ouLonEst(),profil:String(st.profile||''),
            langue:langue(),appareil:navigator.userAgent+' · '+innerWidth+'×'+innerHeight+(_capErr?' · capture : '+_capErr:''),capture:img}})})
        .then(function(r){if(!r.ok)throw 0;ferme();toast(te('Message envoyé ! Tu auras une réponse très vite.'));})
        .catch(function(){env.disabled=false;env.textContent=te('Envoyer');toast(te("L'envoi n'a pas marché. Réessaie dans un instant."));});
      };
    });
  };
})();
</script>
