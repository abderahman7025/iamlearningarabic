<!-- ════════════════════════════════════════════════════════════════════
     v3.4.7 (18 octobre) — source : outils/refonte-v347.html, copiée TELLE
     QUELLE dans app/app.html juste après le bloc v3.4.4.
     3-5 ANS : LES FONDS DES JEUX EN MOTION. Le client n'aimait pas les
     décors plats (images fond-*.svg). Chaque aire de jeu (.mj-aire) devient
     un petit paysage vivant, à la couleur de l'habitat de l'animal du cours
     (savane, banquise, mare, nuit…, posé en data-hab sur la manche) :
       – ciel en dégradé, collines en trois plans qui ondulent doucement
         (parallaxe : chaque plan à sa vitesse) ;
       – un soleil (une lune la nuit) qui rayonne en tournant ;
       – des nuages qui passent et des particules de l'habitat (pollen,
         sable, neige, pétales, bulles, lucioles) qui montent ou tombent.
     Tout en CSS ; rien ne capte le doigt (pointer-events:none) ; arrêté
     pour « réduire les animations ».
     ════════════════════════════════════════════════════════════════════ -->
