<!-- ════════════════════════════════════════════════════════
     MOTION — décor animé et entrées sonores (v3.1.3)
     Le client (17 oct.) : « fais un effort et fais qqch de pro ».
     1. LE DÉCOR « NUIT D'ORIENT » (canvas) remplace `.login-deco` sur
        s-buy et s-login : ciel, étoiles, étoiles filantes, lune, deux plans
        de ville avec mosquée et fenêtres qui vacillent, lanternes qui
        tombent puis se balancent, lettres arabes et poussière d'or qui
        montent. Parallaxe à la souris. Un seul canvas, déplacé d'un écran à
        l'autre : passer de l'accueil à la connexion ne rejoue pas le décor.
        Il s'arrête dès que son écran est caché ou l'onglet en arrière-plan.
     2. LES ENTRÉES, une fois par chargement et par écran :
        s-buy (accueil : titre qui s'écrit, mots un à un, prix qui compte,
        chaque « ✓ » qui arrive et se coche, bouton qui brille), s-login,
        s-welcome / s-age (cartes d'interface), s-menu (cartes en 3D).
     - Web Animations API sur translate/scale/rotate (jamais `transform`,
       réservé aux animations CSS existantes), fill:'backwards' : une fois
       finie, l'animation s'efface et le :hover d'origine revient.
     - Sons synthétisés (Web Audio, aucun fichier) ; muets avant le premier
       geste (règle des navigateurs) et si st.soundOn est faux.
     - prefers-reduced-motion : décor fixe, aucune entrée.
     - Un toucher pendant une entrée la termine d'un coup.
     Aucun texte ajouté : rien à traduire.
     Bloc identique dans public/index.html et app/app.html
     (source : outils/motion-bloc.html — modifier ici, puis remplacer
     le bloc tel quel dans les deux fichiers).
     ════════════════════════════════════════════════════════ -->
<style>

  box-shadow:0 0 12px rgba(245,200,66,.25)}
.mo-check svg{width:12px;height:12px;display:block}
.mo-check path{fill:none;stroke:#f5c842;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mo-etincelle{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
  border-radius:50%;background:#ffe39a;box-shadow:0 0 8px #f5c842;pointer-events:none;z-index:4}
</style>

  /* ════════ SON ════════ */
  function ouvreAudio(){

  };

  /* ════════ LE DÉCOR « NUIT D'ORIENT » ════════ */

      minaret(g,cx-185*s,base,22*s,265*s);minaret(g,cx+185*s,base,22*s,265*s);
      for(var a=-2;a<=2;a++)arche(fenetres,cx+a*48*s-11*s,base-90*s,22*s,40*s);
      fenetres.push({x:cx-17*s,y:base-58*s,w:34*s,h:58*s,ph:0,v:0.5,on:true,porte:true});
      g.fillStyle='#0a0822';g.fillRect(0,base-3,W,3);
    }
    function lance(){if(!tourne&&hote&&!document.hidden){tourne=true;requestAnimationFrame(image);}}
    /* Appareil lent : au-delà de ~34 ms par image en moyenne, une image
       sur deux seulement (30 i/s), pour laisser respirer la page. */
    var dernier=0,moy=16,saute=false,impair=false;
    function image(now){
      if(!hote||!hote.classList.contains('on')||document.hidden){tourne=false;dernier=0;return;}
      if(dernier){moy=moy*0.95+(now-dernier)*0.05;if((now-t0)>3000)saute=saute?moy>24:moy>34;}
      dernier=now;impair=!impair;
      if(!saute||impair)dessine((now-t0)/1000);
      if(reduit){tourne=false;return;}
      requestAnimationFrame(image);
    }
    function lanterne(L,t,ti){
      var arr=eOut(ent(ti,L.d,L.d+0.8));if(arr<=0)return;
      var lt=Math.max(0,ti-L.d);
      var ang=0.42*Math.exp(-1.2*lt)*Math.cos(4.4*lt)+0.05*Math.sin(t*1.1+L.ph);
      var s=L.s,len=L.len*arr;
      c.save();c.translate(L.x*W+par.x*W*0.02,0);c.rotate(ang);
      c.strokeStyle='rgba(201,162,74,.8)';c.lineWidth=Math.max(1,s*0.25);
      c.beginPath();c.moveTo(0,0);c.lineTo(0,len);c.stroke();
      c.translate(0,len);
      var fl=0.85+0.15*Math.sin(t*13+L.ph)*Math.sin(t*7.3);
      var Z=s*22;c.globalAlpha=fl;c.drawImage(lueur,-Z,s*6-Z,Z*2,Z*2);c.globalAlpha=1;
      c.fillStyle='#c9a24a';
      c.beginPath();c.moveTo(-s*2,0);c.lineTo(s*2,0);c.lineTo(s*4,s*3);c.lineTo(-s*4,s*3);c.fill();
      c.beginPath();c.moveTo(-s*4,s*3);c.quadraticCurveTo(-s*6.5,s*7,-s*3.5,s*11.5);c.lineTo(s*3.5,s*11.5);c.quadraticCurveTo(s*6.5,s*7,s*4,s*3);c.closePath();
      c.fillStyle='rgba(255,212,120,'+fl+')';c.fill();c.strokeStyle='#b8902f';c.lineWidth=s*0.55;c.stroke();
      c.beginPath();c.moveTo(0,s*3);c.lineTo(0,s*11.5);c.moveTo(-s*4.6,s*7.2);c.lineTo(s*4.6,s*7.2);c.stroke();
      c.fillStyle='#c9a24a';c.fillRect(-s*3,s*11.5,s*6,s*1.6);
      c.beginPath();c.moveTo(-s,s*13.1);c.lineTo(s,s*13.1);c.lineTo(0,s*15.5);c.fill();
      c.restore();
    }
    function dessine(t){
      var ti=t-tIntro;
      par.x+=(parCible.x-par.x)*0.05;par.y+=(parCible.y-par.y)*0.05;
      c.setTransform(dpr,0,0,dpr,0,0);
      /* ciel */
      c.drawImage(ciel,0,0,W,H);
      /* étoiles */
      for(var i=0;i<etoiles.length;i++){
        var e=etoiles[i],a=ent(ti,e.d*0.9,e.d*0.9+0.4);if(!a)continue;
        a*=0.45+0.55*Math.abs(Math.sin(t*e.v*0.5+e.ph));
        var ex=e.x*W+par.x*W*0.012,ey=e.y*H+par.y*H*0.012;
        c.globalAlpha=a;c.fillStyle='#fff7dd';c.beginPath();c.arc(ex,ey,e.r,0,7);c.fill();
        if(e.glint){c.strokeStyle='rgba(255,247,221,.6)';c.lineWidth=0.7;c.beginPath();
          c.moveTo(ex-e.r*5,ey);c.lineTo(ex+e.r*5,ey);c.moveTo(ex,ey-e.r*5);c.lineTo(ex,ey+e.r*5);c.stroke();}
      }
      c.globalAlpha=1;
      /* étoile filante */
      if(!reduit&&ti>2){
        if(!filante&&t>prochFilante){filante={x:0.15+Math.random()*0.6,y:0.05+Math.random()*0.25,t:t,ang:0.35+Math.random()*0.3};}
        if(filante){
          var k=(t-filante.t)/0.9;
          if(k>=1){filante=null;prochFilante=t+5+Math.random()*6;}
          else{
            var L=u*28,fx=filante.x*W+Math.cos(filante.ang)*k*W*0.35,fy=filante.y*H+Math.sin(filante.ang)*k*W*0.35;
            var gg=c.createLinearGradient(fx,fy,fx-Math.cos(filante.ang)*L,fy-Math.sin(filante.ang)*L);
            gg.addColorStop(0,'rgba(255,248,220,'+(1-k)+')');gg.addColorStop(1,'rgba(255,248,220,0)');
            c.strokeStyle=gg;c.lineWidth=1.6;c.beginPath();c.moveTo(fx,fy);c.lineTo(fx-Math.cos(filante.ang)*L,fy-Math.sin(filante.ang)*L);c.stroke();
          }
        }
      }
      /* lune */
      var la=eOut(ent(ti,0.15,1.2));
      if(la){
        var R=lune.R,mx=W*(W<600?0.8:0.82)+par.x*W*0.025,my=H*0.16+(1-la)*H*0.12+par.y*H*0.02;
        var resp=1+0.06*Math.sin(t*0.8);
        c.globalAlpha=la*0.95;c.drawImage(halo,mx-R*4*resp,my-R*4*resp,R*8*resp,R*8*resp);
        c.globalAlpha=la;c.drawImage(lune.c,mx-R*1.1,my-R*1.1,R*2.2,R*2.2);c.globalAlpha=1;
      }
      /* lettres arabes qui montent */
      var lla=ent(ti,1.0,2.2);
      if(lla){
        for(i=0;i<lettres.length;i++){
          var l=lettres[i];
          var ly=((l.y-t*l.vy)%1+1)%1;
          var fade=Math.min(1,ly*5,(1-ly)*4);
          c.save();c.translate(l.x*W+par.x*W*0.035,ly*H*1.1-H*0.05);c.rotate(l.rot+Math.sin(t*l.vr*3)*0.2);
          c.globalAlpha=l.a*fade*lla;var gy=glyphes[l.ch+'|'+Math.round(l.s)];
          if(gy)c.drawImage(gy,-gy.z/2,-gy.z/2,gy.z,gy.z);
          c.restore();
        }
        c.globalAlpha=1;
      }
      /* ville lointaine puis proche */
      var va=eOut(ent(ti,0.3,1.25));
      if(va)c.drawImage(loin.c,par.x*W*0.03-W*0.015,H-loin.h-H*0.08+(1-va)*H*0.25,W*1.03,loin.h);
      var vb=eOut(ent(ti,0.45,1.4));
      if(vb){
        var ox=par.x*W*0.05-W*0.025,oy=H-pres.h+(1-vb)*H*0.3;
        c.drawImage(pres.c,ox,oy,W*1.05,pres.h);
        var fa=ent(ti,1.2,1.9),sx=1.05;
        for(i=0;i<fenetres.length;i++){
          var f=fenetres[i];if(!f.on||!fa)continue;
          var al=fa*(f.porte?0.55:(0.55+0.3*Math.sin(t*f.v+f.ph)*Math.sin(t*f.v*1.7)));
          c.fillStyle='rgba(255,196,96,'+al+')';
          var x0=ox+f.x*sx,y0=oy+f.y,w=f.w*sx;
          c.beginPath();c.moveTo(x0,y0+f.h);c.lineTo(x0,y0+w/2);c.arc(x0+w/2,y0+w/2,w/2,Math.PI,0);c.lineTo(x0+w,y0+f.h);c.fill();
        }
      }
      /* poussière d'or */
      var pa=ent(ti,0.8,1.8);
      if(pa){
        c.fillStyle='#ffd77a';
        for(i=0;i<poussiere.length;i++){
          var p=poussiere[i],py=((p.y-t*p.vy)%1+1)%1;
          c.globalAlpha=pa*(0.25+0.45*Math.abs(Math.sin(t*1.5+p.ph)))*Math.min(1,py*4);
          c.beginPath();c.arc(p.x*W+Math.sin(t*0.7+p.ph)*u*1.5,py*H,p.r,0,7);c.fill();
        }
        c.globalAlpha=1;
      }
      /* lanternes */
      for(i=0;i<lanternes.length;i++)lanterne(lanternes[i],t,ti);
    }
    return {
      /* Place le décor dans l'écran `scr` ; joue l'intro la 1re fois. */
      montre:function(scr){
        if(!scr.querySelector('.login-deco'))return false;
        if(!cv)cree();
        var premier=!hote;
        if(cv.parentNode!==scr){scr.insertBefore(cv,scr.firstChild);}
        if(hote&&hote!==scr)hote.classList.remove('mo-scene-on');
        hote=scr;scr.classList.add('mo-scene-on');
        taille();
        if(premier){
          t0=performance.now();tIntro=0;
          if(reduit)tIntro=-10;
          else{
            for(var i=0;i<7;i++)son('etoile',i,80+i*110);
            son('gong',0,150);son('souffle',0,380);
            lanternes.forEach(function(L,i){son('clochette',i,L.d*1000+350);});
          }
        }
        lance();
        return premier;
      },
      passeIntro:function(){if(hote)tIntro=(performance.now()-t0)/1000-10;}
    };
  })();

  /* ════════ LES ENTRÉES ════════ */
  function entreeBoite(box,d0){
    depuis(box,{opacity:0,translate:'0 60px',scale:'.92',filter:'blur(8px)'},{duration:900,delay:d0,easing:SPRING});
    son('souffle',0,d0);
    var titre=box&&box.querySelector('.login-ar');
    depuis(titre,{opacity:0,clipPath:'inset(0 0 0 100%)'},{duration:1000,delay:d0+150});
    depuis(titre,{filter:'drop-shadow(0 0 18px rgba(245,200,66,.95))'},{duration:1400,delay:d0+1100,easing:'ease-out'});
    son('note',5,d0+150);son('note',7,d0+700);
  }

  function entreeAccueil(scr,premier){
    var d=premier?650:80;
    depuis(scr.querySelector('.lang-globe-wrap'),{opacity:0,translate:'0 -20px'},{duration:700,delay:d+300});
    var box=scr.querySelector('.login-box');entreeBoite(box,d);
    enMots(document.getElementById('buy-desc')).forEach(function(m,i){
      depuis(m,{opacity:0,translate:'0 14px',filter:'blur(6px)'},{duration:550,delay:d+450+i*45});
    });
    var prix=document.getElementById('buy-price-new'),bloc=prix&&prix.parentNode&&prix.parentNode.parentNode;
    depuis(bloc,{opacity:0,scale:'.8'},{duration:800,delay:d+650,easing:SPRING});
    depuis(document.getElementById('buy-access-lbl'),{opacity:0,translate:'0 -8px'},{duration:500,delay:d+800});
    depuis(document.getElementById('buy-price-old'),{opacity:0,translate:'-24px 0'},{duration:600,delay:d+850,easing:SPRING});
    depuis(prix,{opacity:0,scale:'.5'},{duration:500,delay:d+900,easing:SPRING});
    compteur(prix,d+900,1100);
    depuis(document.getElementById('buy-payment-lbl'),{opacity:0},{duration:500,delay:d+1200});
    var feats=document.getElementById('buy-features');surveilleLignes(feats);
    var lignes=enLignes(feats);
    lignes.forEach(function(l,i){
      var dl=d+1000+i*150;
      depuis(l,{opacity:0,translate:'-40px 0'},{duration:650,delay:dl,easing:SPRING});
      var ck=l.querySelector('.mo-check');
      depuis(ck,{scale:'0',rotate:'-90deg'},{duration:600,delay:dl+120,easing:SPRING});
      var p=l.querySelector('path');
      if(p&&p.animate){p.style.strokeDasharray='14';
        actives.push(p.animate([{strokeDashoffset:14,offset:0},{strokeDashoffset:0}],{duration:400,delay:dl+300,fill:'backwards',easing:'ease-out'}));}
      son('note',i+1,dl+120);
    });
    var fin=d+1000+lignes.length*150;
    depuis(document.getElementById('buy-email'),{opacity:0,translate:'0 16px'},{duration:550,delay:fin});
    var btn=document.getElementById('buy-btn');
    depuis(btn,{opacity:0,scale:'.75'},{duration:700,delay:fin+120,easing:SPRING});
    brille(btn,fin+700);
    [].forEach.call(box?box.querySelectorAll('#buy-already-lbl,#buy-login-link'):[],function(e){
      depuis(e,{opacity:0},{duration:500,delay:fin+300});
    });
    /* Le bouton d'achat reluit toutes les 5 s tant que l'accueil est affiché. */
    if(btn&&!btn._moLuit){btn._moLuit=setInterval(function(){
      if(scr.classList.contains('on')&&!document.hidden)brille(btn,0);},5000);}
    toucherPourPasser(scr,fin+800);
  }

  function entreeConnexion(scr,premier){
    var d=premier?650:60;
    var box=scr.querySelector('.login-box');entreeBoite(box,d);
    if(box)[].forEach.call(box.children,function(ch,i){
      if(ch.classList.contains('login-ar'))return;
      depuis(ch,{opacity:0,translate:(i%2?'30px':'-30px')+' 0'},{duration:600,delay:d+300+i*80,easing:SPRING});
      if(ch.tagName==='INPUT')son('tic',i*3,d+300+i*80);
    });
    var b=document.getElementById('l-btn');brille(b,d+1100);
    toucherPourPasser(scr,d+1400);
  }

  function entreeCartes(scr){
    var titre=scr.querySelector('.w-ar');
    depuis(titre,{opacity:0,scale:'.6',filter:'blur(12px)'},{duration:900,delay:100,easing:SPRING});
    depuis(titre,{filter:'drop-shadow(0 0 22px rgba(245,200,66,.95))'},{duration:1400,delay:1000,easing:'ease-out'});
    son('gong',0,100);
    depuis(scr.querySelector('.w-sub'),{opacity:0,translate:'0 12px'},{duration:600,delay:600});
    var cartes=scr.querySelectorAll('.prof-card');
    cartes.forEach(function(c,i){
      var d=800+i*260;
      c.style.animation='none';
      depuis(c,{opacity:0,translate:'0 70px',scale:'.7',rotate:(i%2?'4deg':'-4deg')},{duration:750,delay:d,easing:SPRING});
      depuis(c.querySelector('.prof-emoji'),{scale:'0',rotate:'-30deg'},{duration:650,delay:d+200,easing:SPRING});
      son('note',i*2,d);
      brille(c,d+550);
      if(!c._moSon){
        c._moSon=1;
        c.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')son('tic',6);});
        c.addEventListener('pointerdown',function(){son('valide');});
      }
    });
    toucherPourPasser(scr,800+cartes.length*260+600);
  }

  function entreeMenu(scr){
    depuis(scr.querySelector('.menu-header'),{opacity:0,translate:'0 -30px'},{duration:600});
    depuis(scr.querySelector('.menu-logo-ar'),{opacity:0,clipPath:'inset(0 0 0 100%)'},{duration:900,delay:200});
    son('gong',0,150);
    /* Les cartes : attendre que buildMenu les ait posées. */
    plus(function(){
      var nav=document.getElementById('menu-nav');if(!nav)return;
      nav.classList.remove('menu-anim-done');window._menuAnimDone=false;
      var cartes=[].slice.call(nav.querySelectorAll('.nav-card'));
      nav.style.perspective='900px';
      cartes.forEach(function(el,i){
        /* opacity:1 en ligne : la feuille de style met les cartes à 0 en
           attendant son ancienne animation CSS, qu'on coupe ici. */
        el.style.cssText='';el.style.animation='none';el.style.opacity='1';el.style.transform='none';
        var d=250+i*160;
        depuis(el,{opacity:0,rotate:'x -80deg',translate:'0 40px',scale:'.9'},{duration:850,delay:d,easing:SPRING});
        depuis(el.firstElementChild,{scale:'0',rotate:'-25deg'},{duration:650,delay:d+180,easing:SPRING});
        son('note',i+1,d);
        brille(el,d+600);
      });
      var fin=250+cartes.length*160;
      var sb=document.getElementById('streak-bar-wrap');
      depuis(sb,{opacity:0,scale:'.6'},{duration:700,delay:fin+100,easing:SPRING});
      depuis(sb&&sb.querySelector('.streak-fire'),{scale:'0',rotate:'-40deg'},{duration:800,delay:fin+250,easing:SPRING});
      depuis(document.getElementById('global-prog-wrap'),{opacity:0,translate:'0 20px'},{duration:600,delay:fin+250});
      var fill=document.getElementById('global-prog-fill');
      if(fill){fill.style.transformOrigin='left center';depuis(fill,{scale:'0 1'},{duration:1100,delay:fin+450});}
      depuis(scr.querySelector('.menu-bottom'),{opacity:0,translate:'0 20px'},{duration:600,delay:fin+400});
      toucherPourPasser(scr,fin+1200);
    },60);
  }

  window.MOTION={
    /* Appelé par showS() juste après l'affichage d'un écran. */
    ecran:function(id){
      var scr=document.getElementById(id);if(!scr)return;
      var premier=false;
      try{ if(id==='s-buy'||id==='s-login')premier=SCENE.montre(scr); }catch(e){}
      /* Le menu rejoue son entrée à CHAQUE affichage ; les autres écrans,
         une fois par chargement. */
      if(reduit||(vu[id]&&id!=='s-menu'))return;
      vu[id]=1;
      try{
        if(id==='s-buy')entreeAccueil(scr,premier);
        else if(id==='s-login')entreeConnexion(scr,premier);
        else if(id==='s-welcome'||id==='s-age')entreeCartes(scr);
        else if(id==='s-menu')entreeMenu(scr);
      }catch(e){}
    },
    /* Appelé par buildMenu() : rend les cartes visibles ; l'entrée animée
       est jouée par ecran('s-menu') au moment où le menu s'AFFICHE (avant,
       elle se jouait parfois menu caché — « rien ne se passe »). */
    cartesMenu:function(els){
      /* SURTOUT ne pas poser _menuAnimDone : buildMenu ajoute alors
         `.menu-anim-done`, dont le `opacity:1 !important` écrase toute
         animation — c'est pourquoi le menu « s'affichait en une traite ». */
      var nav=document.getElementById('menu-nav');if(nav)nav.classList.remove('menu-anim-done');
      els.forEach(function(el){el.style.cssText='';el.style.animation='none';el.style.opacity='1';el.style.transform='none';});
    },
    son:son
  };
  /* Le premier écran est affiché avant ce bloc parfois : on le rattrape. */
  function auDemarrage(){
    if(document.getElementById('s-welcome'))return; /* app.html : l'accueil n'y sert pas */
    var on=document.querySelector('.scr.on');
    if(on&&!vu[on.id]&&/^s-(buy|login)$/.test(on.id))window.MOTION.ecran(on.id);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',auDemarrage);
  else auDemarrage();
})();
</script>
