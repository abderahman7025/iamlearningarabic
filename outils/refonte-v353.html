<style id="refonte-v353">
/* v3.5.3 — « Les voyelles » (3-5 ans) : le client, « les ronds réponses
   doivent être beaucoup plus gros ». Toute la largeur du cadre ; debout sur
   un téléphone, les trois ronds se rangent l'un sous l'autre pour être
   grands. */
body.age-petit .mj.mj-voyelles{max-width:none!important;container:voy/inline-size}
body.age-petit .mj-voyelles .mj-rangee{gap:5cqw;flex-wrap:nowrap}
body.age-petit .mj-voyelles .mj-bulleV{--d:min(200px,28cqw);width:var(--d)!important;height:var(--d)!important;font-size:calc(var(--d) * .5)!important}
@container voy (max-width:480px){
  body.age-petit .mj-voyelles .mj-rangee{flex-direction:column;gap:16px}
  body.age-petit .mj-voyelles .mj-bulleV{--d:min(150px,46cqw,19vh)}
}
/* ── v3.5.3 — 3-5 ANS : AUCUN DÉFILEMENT ──
   Le client : « on ne doit jamais pouvoir scroller pour cette interface ».
   Chaque page est mise à la mesure de l'écran (`ajusteEcran` pour les
   manches, `poseLeRepere` pour la carte) ; on ferme donc le défilement. */
html:has(body.age-petit),body.age-petit{overflow:hidden!important;overscroll-behavior:none}
/* v3.5.5 — seulement PENDANT les manches : la carte, elle, défile de haut en bas. */
body.age-petit #ca:has(>.boy-wrap){overflow:hidden!important;overscroll-behavior:none;touch-action:manipulation}
body.age-petit #ca{overflow-x:hidden!important;overscroll-behavior-x:none}
body.age-petit .carte-monde{margin-bottom:8px!important}
/* Choix de la lettre, téléphone couché : les vignettes côte à côte, à la
   hauteur de l'écran, au lieu de s'empiler sous l'écran. */
@media (orientation:landscape) and (max-height:560px){
  body.age-petit .choix-lettre>.sess-map-title{font-size:1.3rem!important;margin:0 0 6px!important;padding:2px 0!important}
  body.age-petit .choix-lettre .tuiles-large{display:grid!important;grid-auto-flow:column;grid-auto-columns:1fr;gap:16px!important;max-width:none!important}
  body.age-petit .choix-lettre .tuile-lettre{height:calc(100vh - 200px)!important;min-height:0!important;margin:0!important;padding:8px!important}
  body.age-petit .choix-lettre .tuile-duo{height:100%;justify-content:center}
  body.age-petit .choix-lettre .jeu-retour{margin-top:10px!important;padding:6px 20px!important}
}
/* Ballons et bulles : aucun geste du doigt n'y fait défiler ou zoomer. */
body.age-petit .mj-bulles .mj-aire,body.age-petit .mj-attrape .mj-aire,body.age-petit .boy-panel.panneau-jeu{touch-action:none;-webkit-user-select:none;user-select:none}
/* ── v3.5.3 — LES TEXTES DES 3-5 ANS ──
   Le client : « l'écriture doit être de la même couleur que celle des
   interfaces 6/11 ans (rose foncé pour fille, bleu turquoise pour garçon) ;
   aucun mot en noir ». Et « Choisis ta lettre » : « on ne voit pas bien les
   mots, l'écriture est trop carrée — ce sont des enfants ». Les titres
   passent dans une police ronde (Fredoka), en couleur pleine cernée de
   blanc, au lieu du blanc sur blanc en capitales. */
body.age-petit.profile-boy{--sk-txt:#0396c8;--sk-txt-f:#015f86}
body.age-petit.profile-girl{--sk-txt:#c2185b;--sk-txt-f:#7b1747}
body.age-petit #root #tb-title,body.age-petit #root .sess-gp-lbl,body.age-petit #root .sess-gp-lbl span,body.age-petit .alb-vig-nom,body.age-petit .carte-nom,
body.age-petit .carte-etat,body.age-petit .tuile-etat,body.age-petit .alb-cadenas{color:var(--sk-txt)!important;-webkit-text-fill-color:var(--sk-txt)!important}
body.age-petit #tb-title{font-family:'Fredoka','Nunito',sans-serif!important;font-weight:600!important;font-size:1.15rem!important}
body.age-petit .sess-gp-lbl,body.age-petit .alb-vig-nom{font-family:'Fredoka','Nunito',sans-serif!important;font-weight:600!important}
body.age-petit .sess-gp-lbl{font-size:.95rem!important}
body.fond-prairie.age-petit #root .sess-map-title,body.age-petit #root .sess-map-title,body.age-petit .alb-boite .sess-map-title{
  font-family:'Fredoka','Nunito',sans-serif!important;font-weight:700!important;text-transform:none!important;
  letter-spacing:.01em!important;font-size:min(1.75rem,6.4vw)!important;line-height:1.15!important;text-wrap:balance;
  color:var(--sk-txt)!important;-webkit-text-fill-color:var(--sk-txt)!important;-webkit-text-stroke:0!important;
  text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff,
    0 4px 0 #fff,0 6px 12px rgba(var(--sk-rgb-f),.28)!important}
/* ── v3.5.3 — LE COMPTE SUR CHAQUE PAGE DES 3-5 ANS ──
   Le client : « ajoute le bouton pour se déconnecter, changer d'interface
   et de langue sur chaque page, comme les 6/11 ans ». C'est le même menu
   que celui de l'avatar du menu principal, posé dans la barre du haut. */
#tb-compte{display:none}
body.age-petit #root #tb-compte{display:flex;width:38px!important;height:38px!important;margin-left:10px;position:relative;cursor:pointer;flex:none;font-size:.95rem}
body.age-petit #root #tb-compte:active{scale:.92}
#tb-compte .cp-drap{position:absolute;right:-5px;bottom:-4px;width:18px;height:12px;border-radius:3px;overflow:hidden;
  box-shadow:0 0 0 2px #fff,0 2px 5px rgba(0,0,0,.3);pointer-events:none}
body.age-petit #topbar #sound-dot2{margin-left:auto}
/* ── v3.5.5 — LES LETTRES AUX COULEURS DU PROFIL ──
   Le client : « les lettres sont toujours en orange sur l'interface fille
   (asad au début, la lettre dans les ronds, le contour qui se remplit en
   4 quarts…) : il faut mettre rose et bleu ». Toute la couleur d'une manche
   vient de --mc ; chez les 3-5 ans, elle devient celle du profil. (Les
   bulles et ballons gardent chacun leur couleur, posée sur eux-mêmes.) */
body.age-petit.profile-girl .mj,body.age-petit.profile-girl .boy-panel{--mc:#e8457f!important}
body.age-petit.profile-boy .mj,body.age-petit.profile-boy .boy-panel{--mc:#1e88e5!important}
/* v3.5.5 — « Trouve la lettre », téléphone couché : le client, « le ya est
   trop bas, on ne voit même pas les points ». La ligne (1,35) était plus
   courte que le dessin des lettres qui descendent (ي, ج, ع, ر…) : leurs
   points sortaient du cadre, et la mise à l'échelle ne les voyait pas. Une
   ligne assez haute pour tout le dessin, et une taille un peu moindre. */
@media (orientation:landscape){
  .mj-mot .mj-motar,.mj-mot .mj-lettre-seule{font-size:min(13vw,25vh)!important;line-height:2!important;padding:0!important}
}
</style>
<script>
(function(){
  function initiale(){
    var m=document.getElementById('m-avatar');if(!m)return '';
    for(var i=0;i<m.childNodes.length;i++){var n=m.childNodes[i];if(n.nodeType===3&&n.textContent.trim())return n.textContent.trim();}
    return '';
  }
  function maj(b){
    b.textContent=initiale()||'•';
    var d=document.createElement('span');d.className='cp-drap';d.setAttribute('aria-hidden','true');
    try{d.innerHTML=(window._DRAPEAUX||{})[st.lang]||'';}catch(e){}
    b.appendChild(d);
  }
  function pose(){
    var tb=document.getElementById('topbar');
    if(!tb){setTimeout(pose,400);return;}
    if(document.getElementById('tb-compte'))return;
    var b=document.createElement('div');b.id='tb-compte';b.className='menu-avatar';
    b.setAttribute('role','button');b.tabIndex=0;
    var sd=document.getElementById('sound-dot2');
    tb.insertBefore(b,sd?sd.nextSibling:null);
    maj(b);
    b.addEventListener('click',function(e){e.stopPropagation();maj(b);if(window._ouvreCompte)window._ouvreCompte(b);});
    /* l'initiale et le drapeau suivent ceux du menu principal */
    var m=document.getElementById('m-avatar');
    if(m&&window.MutationObserver)new MutationObserver(function(){maj(b);}).observe(m,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',pose);else pose();
})();
</script>
