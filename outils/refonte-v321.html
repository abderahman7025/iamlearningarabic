<script>
(function(){
  var FLECHE='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
  var ECHANGE='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>';
  window._GLYPHE3D=window._GLYPHE3D||{};
  function g(d){return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';}
  _GLYPHE3D.memory=g('<rect x="3" y="5" width="9" height="13" rx="2" transform="rotate(-8 7.5 11.5)"/><rect x="11" y="5" width="9" height="13" rx="2" fill="rgba(255,255,255,.3)" transform="rotate(8 15.5 11.5)"/>');
  _GLYPHE3D.puzzle=g('<path d="M5 8h3a2 2 0 114 0h3v3a2 2 0 110 4v3H5v-3a2 2 0 100-4z"/>');
  _GLYPHE3D.carte=g('<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>');
  function arme(){
    /* la flèche du bouton retour */
    var b=document.getElementById('tb-back');
    if(b&&!b.querySelector('.tb-fl')){
      for(var i=0;i<b.childNodes.length;i++){var n=b.childNodes[i];
        if(n.nodeType===3&&n.nodeValue.indexOf('‹')>=0){n.nodeValue=n.nodeValue.replace('‹','');break;}}
      var s=document.createElement('span');s.className='tb-fl';s.setAttribute('aria-hidden','true');s.innerHTML=FLECHE;
      b.insertBefore(s,b.firstChild);
    }
    /* changer d'interface */
    ['tb-inter','menu-inter'].forEach(function(id){var e=document.getElementById(id);if(e&&!e.querySelector('svg'))e.innerHTML=ECHANGE;});
    /* le son : un titre qui dit ce que fait le bouton */
    titreSon();
  }
  function titreSon(){
    document.querySelectorAll('.sound-dot').forEach(function(d){
      var on=!(typeof st!=='undefined'&&st&&st.soundOn===false);
      var tx=on?te('Son activé — touche pour couper'):te('Son coupé — touche pour remettre');
      d.title=tx;d.setAttribute('aria-label',tx);d.setAttribute('role','button');
    });
  }
  var bulle=null;
  window._sonBulle=function(){
    var on=!(typeof st!=='undefined'&&st&&st.soundOn===false);
    if(bulle)bulle.remove();
    bulle=document.createElement('div');bulle.className='son-bulle';
    bulle.textContent=(on?'🔊 ':'🔇 ')+(on?te('Son activé'):te('Son coupé'));
    document.body.appendChild(bulle);
    var b2=bulle;setTimeout(function(){if(b2.parentNode)b2.remove();},1900);
    titreSon();
  };
  window._armeBoutons3D=arme;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arme);else arme();
})();
</script>
